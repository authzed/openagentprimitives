# Smoke fixture for the SidecarToolbox feature. Applied by `mage test:smoke`
# AFTER the echo-mcp-smoke:dev image is kind-loaded.
#
# Flow exercised end-to-end:
#   1. SidecarToolbox controller runs a one-shot probe Pod from the echo
#      image, calls tools/list over the pod network, sees the `echo` tool,
#      and marks the CR Valid=True + Reachable=True.
#   2. AgentClass validation gates on SidecarToolbox Valid=True (Task 10).
#   3. AgentSession reconcile resolves the sidecar, allocates a port, writes
#      the per-session sidecar Secret, and injects a `sidecar-sb-echo`
#      container (Task 9 + podspec) into the <session>-runner Pod.
#   4. The sidecar container's startupProbe hits /healthz on the in-pod
#      loopback — reaching Ready proves the loopback MCP server works.
---
apiVersion: v1
kind: Secret
metadata: {name: sidecar-llm-creds, namespace: default}
type: Opaque
stringData:
  api-key: smoke-test-key-unused
---
# Minimal cluster-scoped SpiceboxClass the SidecarToolbox inherits sandbox
# settings from. image + one tool + resources are all that's needed for the
# class to go Valid=True (no toolspecs → no coverage check).
apiVersion: agentprimitives.authzed.com/v1alpha1
kind: SpiceboxClass
metadata: {name: sidecar-sandbox-smoke}
spec:
  image: busybox:latest
  resources: {cpu: "100m", memory: "64Mi", ephemeralStorage: "16Mi"}
  tools: [{name: noop, command: ["/bin/true"]}]
---
apiVersion: agentprimitives.authzed.com/v1alpha1
kind: SidecarToolbox
metadata: {name: sb-echo, namespace: default}
spec:
  name: echo
  version: "1"
  intent: "Echoes its input verbatim. Smoke-test sidecar."
  source:
    # The Go echo-MCP image built + kind-loaded by Test.Smoke().
    image: echo-mcp-smoke:dev
  sandbox:
    class: sidecar-sandbox-smoke
  transport:
    port: 8080
    healthcheck:
      path: /healthz
      timeoutSeconds: 60
  upstreamAuth:
    # echo needs no upstream credential, but upstreamAuth.provider is
    # required and must resolve to a /providers/ library entry. github-pat
    # is a built-in provider; envVar is omitted so the per-session sidecar
    # Secret is written empty (the echo server ignores env beyond MCP_PORT).
    provider: github-pat
  tools:
    - name: echo
      intent: "Echoes its input verbatim."
      args:
        allowedFields: [text]
        # No CEL constraint: the SidecarToolbox controller's celCheck compiles
        # tools[].args.constraints through the toolspec (`call`-scoped) CEL env,
        # which does not declare the MCP-style `args` variable. An `args.*`
        # constraint here would fail compilation and block Valid=True. The smoke
        # exercises injection + loopback, not constraint enforcement, so the
        # allowlist alone is sufficient.
---
apiVersion: agentprimitives.authzed.com/v1alpha1
kind: AgentClass
metadata: {name: ac-sidecar-smoke, namespace: default}
spec:
  model:
    provider: anthropic
    name: claude-opus-4-7
    apiKey: {name: sidecar-llm-creds, key: api-key}
  systemPrompt: {inline: "sidecar smoke test"}
  budget: {maxTurns: 1, maxTokens: 1000, maxDuration: "5m"}
  # No toolBundles / mcpServers → no AgentIdentity required. The only tool
  # surface is the loopback echo sidecar.
  sidecarToolboxes:
    - {name: echo, ref: sb-echo}
  authz:
    toolCalls:
      mode: disabled
---
apiVersion: agentprimitives.authzed.com/v1alpha1
kind: AgentSession
metadata: {name: sidecar-smoke, namespace: default}
spec:
  class: ac-sidecar-smoke
  prompt: {inline: "noop"}
