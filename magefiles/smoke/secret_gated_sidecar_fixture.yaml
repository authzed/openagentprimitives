# Smoke fixture for the secret-gated separate-pod SidecarToolbox feature.
# Applied by `mage test:smoke` AFTER the echo-mcp-smoke:dev image is kind-loaded
# and the per-session secret-output Secret is pre-seeded (see smokeSecretGatedSidecar).
#
# What this smoke uniquely validates (vs the in-process e2e):
#   1. A SidecarToolbox with secretInputs is recognised as secret-gated — the
#      operator resolves it with RunMode=separate-pod.
#   2. Once the per-session secret-output Secret exists with the required key,
#      the operator creates a SEPARATE pod (<session>-sidecar-<ref>), NOT a
#      container in the runner pod.
#   3. That separate pod reaches Ready — its startupProbe hits /healthz on the
#      loopback echo-MCP — proving the sidecar container started successfully
#      with the secret env var wired in.
#   4. The pod spec carries SMOKE_SECRET wired via secretKeyRef to the
#      per-session secret-output Secret — confirming the operator injected the
#      correct secret-input binding.
#
# Producer approach: this smoke pre-seeds the per-session secret-output Secret
# directly (kubectl apply) rather than driving a full agent turn. Driving a
# real LLM round-trip in a kind cluster requires a real API key and network
# access — outside the scope of a self-contained smoke test. The control-plane
# behavior exercised (operator detects the Secret, resolves AwaitingSecret=false,
# creates the separate pod) is identical whether the Secret arrived from a live
# producer or a pre-seed.
#
# Session name: sg-sidecar-smoke
# Toolbox name: sg-echo
# Separate pod: sg-sidecar-smoke-sidecar-sg-echo  (SidecarPodName convention)
# Secret name:  sg-sidecar-smoke-secret-outputs   (SecretOutputSecretName convention)
# Secret key:   kubeconfig                         (secretInputs[0].from)
---
apiVersion: v1
kind: Secret
metadata: {name: sg-sidecar-llm-creds, namespace: default}
type: Opaque
stringData:
  api-key: smoke-test-key-unused
---
# SpiceboxClass providing sandbox defaults for the secret-gated sidecar.
apiVersion: agentprimitives.authzed.com/v1alpha1
kind: SpiceboxClass
metadata: {name: sg-sidecar-sandbox-smoke}
spec:
  image: busybox:latest
  resources: {cpu: "100m", memory: "64Mi", ephemeralStorage: "16Mi"}
  tools: [{name: noop, command: ["/bin/true"]}]
---
# Secret-gated SidecarToolbox. The secretInputs field makes this a
# separate-pod sidecar (RunMode=separate-pod): the operator will NOT inject it
# as a container in the runner pod; instead, it creates a dedicated per-session
# pod once the bound secret-output key is present in the per-session Secret.
#
# deliver: env means the operator projects the secret as an env var named
# SMOKE_SECRET in the sidecar container. The echo-MCP whoami tool reads
# SMOKE_SECRET and returns sha256(value) — a fingerprint that the smoke asserts
# without ever printing the value.
#
# Only `whoami` is allowlisted; the echo tool is served by the image but is
# NOT advertised for this toolbox. The smoke asserts only whoami is in the
# pod's resolved tool set.
apiVersion: agentprimitives.authzed.com/v1alpha1
kind: SidecarToolbox
metadata: {name: sg-echo, namespace: default}
spec:
  name: sg-echo
  version: "1"
  intent: "Secret-gated echo sidecar. Smoke-test: proves separate-pod creation + secret delivery."
  source:
    image: echo-mcp-smoke:dev
  sandbox:
    class: sg-sidecar-sandbox-smoke
  transport:
    port: 8080
    healthcheck:
      path: /healthz
      timeoutSeconds: 60
  upstreamAuth:
    # No upstream credential needed; the per-session Secret written by the
    # pre-seed step is the only credential injected (via secretInputs below).
    provider: github-pat
  secretInputs:
    # Binds the producer's secretOutput named `kubeconfig` (the per-session
    # secret-output Secret key sg-sidecar-smoke-secret-outputs[kubeconfig])
    # into the sidecar as the SMOKE_SECRET env var.
    - name: SMOKE_SECRET
      deliver: env
      from: kubeconfig
  tools:
    - name: whoami
      intent: "Returns sha256 fingerprint of the delivered SMOKE_SECRET. Safe: fingerprint only, never the value."
      args:
        allowedFields: []
---
apiVersion: agentprimitives.authzed.com/v1alpha1
kind: AgentClass
metadata: {name: ac-sg-sidecar-smoke, namespace: default}
spec:
  model:
    provider: anthropic
    name: claude-opus-4-7
    apiKey: {name: sg-sidecar-llm-creds, key: api-key}
  systemPrompt: {inline: "secret-gated sidecar smoke test"}
  budget: {maxTurns: 1, maxTokens: 1000, maxDuration: "5m"}
  sidecarToolboxes:
    - {name: sg-echo, ref: sg-echo}
  authz:
    toolCalls:
      mode: disabled
---
apiVersion: agentprimitives.authzed.com/v1alpha1
kind: AgentSession
metadata: {name: sg-sidecar-smoke, namespace: default}
spec:
  class: ac-sg-sidecar-smoke
  prompt: {inline: "noop"}
