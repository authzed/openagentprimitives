apiVersion: v1
kind: Secret
metadata: {name: llm-creds, namespace: default}
type: Opaque
stringData:
  api-key: smoke-test-key-unused
---
apiVersion: agentprimitives.authzed.com/v1alpha1
kind: SpiceboxToolspec
metadata: {name: ts-a, namespace: default}
spec:
  toolkit: {name: echo, revision: "2026-04-25"}
  allowSubcommands: [""]
---
apiVersion: agentprimitives.authzed.com/v1alpha1
kind: SpiceboxToolspec
metadata: {name: ts-b, namespace: default}
spec:
  toolkit: {name: cat, revision: "2026-04-25"}
  allowSubcommands: [""]
---
apiVersion: agentprimitives.authzed.com/v1alpha1
kind: SpiceboxClass
metadata: {name: cls-a}
spec:
  image: busybox:latest
  resources: {cpu: "100m", memory: "64Mi", ephemeralStorage: "16Mi"}
  tools: [{name: echo, command: ["/bin/echo"]}]
  toolspecs: [{name: ts-a}]
---
apiVersion: agentprimitives.authzed.com/v1alpha1
kind: SpiceboxClass
metadata: {name: cls-b}
spec:
  image: busybox:latest
  resources: {cpu: "100m", memory: "64Mi", ephemeralStorage: "16Mi"}
  tools: [{name: cat, command: ["/bin/cat"]}]
  toolspecs: [{name: ts-b}]
---
apiVersion: agentprimitives.authzed.com/v1alpha1
kind: AgentIdentity
metadata: {name: ai-smoke, namespace: default}
spec:
  # The cli authkind (pkg/platform/identity/authkind/cli) requires each binding to
  # carry an env mapping; otherwise the AgentIdentity goes Valid=False with
  # ReasonBindingModeMismatch. The smoke uses a single throwaway credential
  # reused across both bindings — the test never executes the tools, but
  # the controller still validates the binding shape.
  credentials:
    - name: smoke-token
      type: static
      static:
        secretRef: {name: llm-creds, key: api-key}
  bindings:
    - match:
        allows: [cli:echo]
      env:
        ECHO_TOKEN: {credential: smoke-token}
    - match:
        allows: [cli:cat]
      env:
        CAT_TOKEN: {credential: smoke-token}
---
apiVersion: agentprimitives.authzed.com/v1alpha1
kind: AgentClass
metadata: {name: ac-smoke, namespace: default}
spec:
  model:
    provider: anthropic
    name: claude-opus-4-7
    apiKey: {name: llm-creds, key: api-key}
  systemPrompt: {inline: "smoke test"}
  budget: {maxTurns: 1, maxTokens: 1000, maxDuration: "5m"}
  agentIdentity: ai-smoke
  toolBundles:
    - {name: a, class: cls-a, toolspecs: [ts-a]}
    - {name: b, class: cls-b, toolspecs: [ts-b]}
  authz:
    toolCalls:
      mode: disabled
---
apiVersion: agentprimitives.authzed.com/v1alpha1
kind: AgentSession
metadata: {name: smoke, namespace: default}
spec:
  class: ac-smoke
  prompt: {inline: "noop"}
