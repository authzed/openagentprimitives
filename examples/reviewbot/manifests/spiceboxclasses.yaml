# Two SpiceboxClasses for reviewbot, mirroring codebot's shape. Both are
# reviewbot-prefixed rather than reusing codebot's bare `gitlike-bundle` /
# `codelike-bundle` names: SpiceboxClass is CLUSTER-scoped
# (+kubebuilder:resource:scope=Cluster), so two bundles declaring the same
# class name collide at install time — whichever installs second silently
# overwrites the other's definition. Concretely, that would hand reviewbot's
# sandbox codebot's `git-rw`/`gh-pr` toolspecs (write access, PR commenting)
# whenever codebot is installed after reviewbot on the same cluster — the one
# thing this agent is specified never to do. Keep every new bundle's
# SpiceboxClass names prefixed by the agent so this can't happen again.
#
#   demo-reviewbot-gitlike  — git (read-only) + gh, allowlist-networked to
#                             GitHub only. Shared /workspace volume so git and
#                             gh operate on the same clone without an extra
#                             copy step.
#
#   demo-reviewbot-codelike — the claude binary (Claude Code),
#                             allowlist-networked to the Anthropic API +
#                             language registries. Reads /workspace via the
#                             shared mount; reviewbot never writes back to the
#                             reviewed repo, but the inner Claude Code may
#                             still need to run the reviewed repo's own test
#                             suite (per whichever review skill is used), so
#                             the toolchains it needs for that are still
#                             installed here.
#
# demo-reviewbot-codelike statically composes the `claude` overlay (claude
# moved out of the base sandbox image); the `toolchains` install question
# (oap.yaml, Task 5) APPENDS the language selection (default [go, node]) onto
# that via the `[]` append marker. The registry hosts below are already
# allowlisted so a selected toolchain's `go mod download` / `pnpm install`
# can reach them.
#
# SpiceboxClass is cluster-scoped (no metadata.namespace).
apiVersion: agentprimitives.authzed.com/v1alpha1
kind: SpiceboxClass
metadata:
  name: demo-reviewbot-gitlike
spec:
  resources:
    cpu: "500m"
    memory: "256Mi"
    ephemeralStorage: "500Mi"
    pidsLimit: 64
  network:
    mode: allowlist
    allowedHosts:
      - api.github.com
      - github.com
  # No GIT_AUTHOR_*/committer identity: git-ro never commits, so there is no
  # author to attribute — unlike codebot, which derives one per-user at
  # runtime.
  tools:
    - name: git
      command: ["/usr/bin/git"]
      expectedDuration: short
    - name: gh
      command: ["/usr/bin/gh"]
      expectedDuration: short
  toolspecs:
    - name: demo-reviewbot-git-ro
    - name: demo-reviewbot-gh-review
  sessionDefaults:
    idleTTL: "30m"
    maxDuration: "1h"
---
apiVersion: agentprimitives.authzed.com/v1alpha1
kind: SpiceboxClass
metadata:
  name: demo-reviewbot-codelike
spec:
  resources:
    cpu: "1"
    # Raised from 1Gi because tmpSize/workSize below are memory-backed tmpfs:
    # their pages are charged against THIS limit as they are written. Raising
    # the caps alone would buy nothing — the memory limit binds first and the
    # pod is OOM-killed rather than told ENOSPC.
    memory: "4Gi"
    ephemeralStorage: "1Gi"
    pidsLimit: 64
    # A build box needs more scratch than the 50Mi/100Mi defaults: `claude`
    # writes ~/.claude (HOME is /tmp — also where the two staged review
    # skills get symlinked into Claude Code's discovery path, see the claude
    # toolchain's launcher), and any tool that ignores TMPDIR lands here. The
    # large consumers are already redirected to the disk-backed
    # /var/ap-cache by the toolchain env (GOCACHE, GOMODCACHE, PNPM_HOME,
    # XDG_*, TMPDIR), so this is headroom, not the primary cache.
    tmpSize: "512Mi"
    workSize: "256Mi"
    # The disk-backed /var/ap-cache holds GOCACHE + GOMODCACHE + PNPM_HOME while
    # this box builds and tests the repo it is reviewing. The 2Gi default is too
    # small here: reviewing a Go dependency-bump PR resolves the full (often
    # huge) module graph — a docker/docker bump alone blew past 2Gi and the
    # kubelet evicted the pod mid-review. This is charged against node disk
    # (the builder raises the container's ephemeral-storage limit to match),
    # NOT against the 4Gi memory limit above.
    cacheSize: "8Gi"
  network:
    # mode is the part the cluster ENFORCES today: `allowlist` emits DNS plus
    # coarse TCP 443/80 to 0.0.0.0/0 (see cosidecar.AllowlistEgressRules),
    # while `none` is deny-all. Vanilla NetworkPolicy cannot express hostnames.
    #
    # allowedHosts is RECORDED on
    # AgentSession.status.resolvedSidecarToolboxes[].effectiveAllowedHosts and
    # is NOT enforced by the operator. Declare the truth here anyway: the day
    # a DNS-aware policy controller (Cilium, Calico) is installed and starts
    # consuming that snapshot, a stale list would silently break `go test` /
    # `pnpm install` in production and nowhere else.
    mode: allowlist
    allowedHosts:
      # Claude Code's own LLM calls, authed by the agent-owned Anthropic key.
      - api.anthropic.com
      # Go modules + the checksum database, for a reviewed repo's own tests.
      - proxy.golang.org
      - sum.golang.org
      # npm / pnpm, and yarn classic's registry.
      - registry.npmjs.org
      - registry.yarnpkg.com
      # Source hosts: modules and packages that resolve to a git URL or a
      # release tarball rather than to a registry.
      - github.com
      - api.github.com
      - codeload.github.com
      - objects.githubusercontent.com
      - raw.githubusercontent.com
  envDefaults:
    HOME: /tmp
  tools:
    # The class tool name MUST equal the toolspec's toolkit name (claude) —
    # the AgentClass validator matches them (the runtime tool the
    # orchestrator calls is then codelike_claude).
    - name: claude
      # Absolute path into the claude overlay. claude moved out of the base
      # sandbox image (it was /usr/local/bin/claude) into the
      # oap-toolchain-claude overlay; pkg/tools/exec/remote requires an
      # absolute cmd[0]. --dangerously-skip-permissions is baked in (as
      # codebot's is) because a webhook-triggered review has no human on the
      # other end to answer a permission prompt; --print/--output-format are
      # supplied per-call by the orchestrator, not baked in here, so the same
      # tool serves both a first-round review and a later --continue round.
      command: ["/opt/ap-toolchains/claude/bin/claude", "--dangerously-skip-permissions"]
      expectedDuration: long
  toolspecs:
    - name: demo-reviewbot-claude
  # claude is mandatory infra for a review agent (its runtime lives in the
  # claude overlay), so it is declared statically here. The `toolchains`
  # install question (oap.yaml, Task 5) APPENDS the user's language selection
  # onto this list via the `#spec.toolchains[]` append marker — it does NOT
  # replace it, so claude always survives.
  toolchains:
    - claude
  sessionDefaults:
    idleTTL: "30m"
    maxDuration: "1h"
