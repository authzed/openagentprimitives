apiVersion: apps/v1
kind: Deployment
metadata:
  name: spicebox-graphiti
  namespace: agentprimitives-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: spicebox-graphiti
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spicebox-graphiti
    spec:
      containers:
        - name: graphiti
          image: zepai/graphiti:latest
          env:
            - name: NEO4J_URI
              value: bolt://spicebox-neo4j.agentprimitives-system.svc:7687
            - name: NEO4J_USER
              value: neo4j
            - name: NEO4J_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: spicebox-neo4j-token
                  key: password
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: spicebox-graphiti-config
                  key: openai-api-key
            - name: MODEL_NAME
              value: gpt-4.1-mini
            - name: EMBEDDING_MODEL_NAME
              value: text-embedding-3-small
          ports:
            - containerPort: 8000
              name: http
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /healthcheck
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthcheck
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
