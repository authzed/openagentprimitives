apiVersion: apps/v1
kind: Deployment
metadata:
  name: spicebox-postgres
  namespace: agentprimitives-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: spicebox-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spicebox-postgres
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg17
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: spicebox-postgres-token
                  key: password
            - name: POSTGRES_DB
              value: memory
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1"
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: spicebox-postgres-data
