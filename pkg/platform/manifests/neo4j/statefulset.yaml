apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: spicebox-neo4j
  namespace: agentprimitives-system
spec:
  serviceName: spicebox-neo4j
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: spicebox-neo4j
  template:
    metadata:
      labels:
        app.kubernetes.io/name: spicebox-neo4j
    spec:
      containers:
        - name: neo4j
          image: neo4j:5.26-community
          env:
            - name: NEO4J_AUTH
              valueFrom:
                secretKeyRef:
                  name: spicebox-neo4j-token
                  key: auth
          ports:
            - containerPort: 7687
              name: bolt
            - containerPort: 7474
              name: http
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            tcpSocket:
              port: 7687
            initialDelaySeconds: 30
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 5Gi
