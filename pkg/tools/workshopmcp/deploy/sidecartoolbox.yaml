# SidecarToolbox/workshop: the agent-builder's own sidecar, internal/cmd/workshop.
#
# This is a FLAT declaration — sidecartoolbox.Kind.ValidateFile (and the
# MatchFlat-based `oap tools validate` dispatch) unmarshal a file like this
# one directly into SidecarToolboxSpec, no apiVersion/kind/metadata/spec
# wrapper. It is consumed as a builder-bundle artifact (a later plan wires it
# into the agent-builder's own AgentClass); it is NOT part of the operator
# install bundle and is not referenced by config/** or mage manifests.
#
# upstreamAuth.provider is the "none" sentinel (design doc §2.3, plan-3b
# Ruling B): this sidecar's credential is the controller-issued projected
# ServiceAccount token + the per-workshop operator bearer, minted by the
# Workshop/AgentSession reconcilers — never an AgentIdentity credential
# resolved through the provider library. See
# pkg/tools/kinds/sidecartoolbox/kind.go's lint and
# pkg/platform/identity/authkind/sidecartoolbox/kind.go's SetupRequirements,
# both of which special-case this value.
#
# transport.path is REQUIRED (not the empty-means-root default):
# internal/cmd/workshop/main.go mounts the MCP handler at exactly MCP_PATH
# (default "/mcp" when unset) and nothing at "/" — the operator never injects
# MCP_PATH for this sidecar, so the served path is always "/mcp". Runner
# dispatch derives its request URL from this field (EndpointPath in
# pkg/agent/tool/sidecartoolbox/synthesize.go), so it must agree.
#
# The gate that actually enforces a tool's stateImpact here is the RUNNER's,
# pkg/authz/spicedb/toolcheck/check_tool_call.go — it denies outright
# ("stateImpact requires a check but none was supplied") whenever
# CheckRequired() is true and Check is nil, and it fires on every real cluster
# (ToolCallAuthz registers whenever toolAuthMode != disabled, and this
# toolbox's AgentClass sets none, so the default — enforcing — applies).
# pkg/controllers/agentclass's validatePermissionShape is NOT that gate: it
# never walks a SidecarToolbox's tools at all (validatePermissions there
# ranges only mcpServers and toolkits), so it passes this file clean whatever
# is declared here. Read the runner gate, not the admission one, before
# changing anything below — this package's sidecartoolbox_test.go drives these
# tools through it, with the grants a session would be holding.
#
# The four rulings this file makes:
#
#   - 15 tools (inventory, probe_mcp, probe_image, cli_help, validate_spec,
#     get, list, render_summary, load_draft, test_tool, test_link,
#     test_sessions, read_test_log, stop_test, agents_in_thread) are
#     `passthrough`. They touch cluster/session state but carry no natural
#     per-call SpiceDB resource id — the workshop identity is fixed by the
#     calling session, not an argument — which is exactly what Passthrough
#     means (see pkg/agent/tool/meta/workspace_tools_test.go's
#     sync_workspace precedent, the same defect fixed the same way once
#     already). CheckRequired() is false for Passthrough, so the runner
#     gate never asks these for one.
#   - 4 tools are `external` and keyed on the DRAFT — apply on `change`,
#     delete on `remove`, watch_test on `test`, project_agent on `project`,
#     every one of them naming the instance `workshop_draft:draft`. `external`
#     means "an approval naming the instance" (checkExternalSlotGrant), and
#     the id is a CONSTANT, which is what lets a plan phase bind it: a phase
#     names the instances it will touch before any call exists, so an id
#     derived from a call's own arguments could never be one of them. The git
#     toolkit keys read/write on the literal `workspace` the same way
#     (toolkits/git.yaml). These four are the REPEATABLE work — a build phase
#     applies many times, re-arms a watch, replaces an object it got wrong —
#     so one approval naming the draft covers every call in that phase, while
#     a permission the phase did not name still raises a card: a `change`
#     grant never satisfies `remove`. The resource is declared in
#     spicedbSchema at the foot of this file; the AgentClass declares the
#     matching slots (pkg/platform/builderbundle/src/manifests/agentclass.yaml,
#     spec.authz.slots).
#
#     "Per phase" is a property of the CLASS, not of the grant. The grant a
#     phase approval writes lives for the SESSION —
#     authz.SlotGrantExpiry(now, sessionExpiration) — and what re-gates a later
#     call is the builder class's `planGate: enforcing` + `requirePlan`, whose
#     frozen ceiling refuses every handle the running phase did not name. A
#     class that copied this toolbox with the plan gate in `logging` would get
#     session-wide `change` from one click, and nothing here would say so.
#
#     project_agent is the one of the four whose repetition varies the TARGET,
#     and its bound is not the card: one approval covers every projection for
#     the grant's life, and the card names the draft rather than any
#     {namespace, name}. The per-target refusal is server-side — the projection
#     route tools_project.go posts to (pkg/web/workshopprojectsrv) refuses any
#     class not reachable from this conversation's own agent set.
#   - 4 tools are `external` with NO check, so each call raises a card, and
#     that is the right cost for each: request_credential names a different
#     identity every time and a person should see each ask; request_install
#     and recommend_capability are once-only per workshop, so a grant would
#     buy nothing; close_others acts on the person's OTHER workshops, which
#     is not work this session's draft can stand in for.
#   - 1 tool is `stateless`: export_draft reads what the workshop already
#     holds and writes only a session artifact, so it names no cluster state
#     to key on. 15 + 4 + 4 + 1 = the 24 tools declared below.
#
# The fragment at the foot and the class's slots ship TOGETHER, in one bundle,
# and must: an older SidecarToolbox whose spicedbSchema lacks workshop_draft
# leaves the class's slot naming a type no reachable fragment classifies, and
# resolveStandingFor refuses it — SlotDeclarationInvalid, fail-closed, the
# class not Ready — rather than guessing a standing for it.
name: workshop
version: "1"
intent: >-
  The agent-builder's own MCP toolset: inventories the cluster's real
  capabilities, probes candidate images/MCP servers, applies and inspects
  draft agent-primitive CRs inside the caller's workshop namespace, renders
  plain-language summaries for approval cards, and exports/loads a portable
  .oap draft. Runs only inside a Ready, session-owned Workshop's provisioned
  namespace — never a standing deployment.

source:
  image: ap-workshop:dev

sandbox:
  class: workshop-sandbox

# Separate-pod, ALWAYS: the ap-workshop image is fail-closed on the projected
# workshop SA token, and BuildSidecarPod's identity branch — the only thing
# that projects it — is reachable solely in separate-pod mode. In-pod, this
# sidecar boots without its identity and exits.
isolation: isolated

transport:
  port: 8080
  path: /mcp
  healthcheck:
    path: /healthz
    timeoutSeconds: 30

upstreamAuth:
  provider: none

tools:
  - name: inventory
    intent: "Snapshot of this cluster's real capabilities, channel kinds, renderers, sandbox classes, MCP catalog, and the caller's effective settings ceilings, and the first-party sidecar images this cluster admits (with the reference to use), and the sign-in flows (providers) an account can be connected with."
    effects:
      readOnly: true
    permission:
      stateImpact: passthrough

  - name: probe_mcp
    intent: "List the tools a candidate MCP server exposes (tools/list), through the SSRF-guarded client."
    args:
      allowedFields: ["url"]
    effects:
      readOnly: true
    permission:
      stateImpact: passthrough

  - name: probe_image
    intent: "Run a candidate container image and discover the MCP tool surface it declares."
    args:
      allowedFields: ["image", "timeout_seconds"]
    effects:
      readOnly: true
    permission:
      stateImpact: passthrough

  - name: cli_help
    intent: "Run a candidate container image's CLI binary with --help to discover its interface."
    args:
      allowedFields: ["image", "binary", "args", "timeout_seconds"]
    effects:
      readOnly: true
    permission:
      stateImpact: passthrough

  - name: validate_spec
    intent: "Round-trip a candidate resource's spec content through the real toolspec/MCP/sidecar validators and CEL compile."
    args:
      allowedFields: ["kind", "manifest"]
    effects:
      readOnly: true
    permission:
      stateImpact: passthrough

  - name: apply
    intent: "Server-side-apply a candidate custom resource into the workshop, under this sidecar's field manager."
    args:
      allowedFields: ["manifest"]
    permission:
      stateImpact: external
      check:
        resourceType: workshop_draft
        resourceIDTemplate: "draft"
        permission: change

  - name: get
    intent: "Read one custom resource, by kind and name, from the workshop."
    args:
      allowedFields: ["kind", "name"]
    effects:
      readOnly: true
    permission:
      stateImpact: passthrough

  - name: list
    intent: "List every custom resource of one kind in the workshop."
    args:
      allowedFields: ["kind"]
    effects:
      readOnly: true
    permission:
      stateImpact: passthrough

  - name: delete
    intent: "Delete one custom resource, by kind and name, from the workshop."
    args:
      allowedFields: ["kind", "name"]
    permission:
      stateImpact: external
      check:
        resourceType: workshop_draft
        resourceIDTemplate: "draft"
        permission: remove

  - name: render_summary
    intent: "Plain-language rendering of a custom resource, for approval cards and the running build summary."
    args:
      allowedFields: ["manifest", "kind", "name"]
    effects:
      readOnly: true
    permission:
      stateImpact: passthrough

  - name: export_draft
    intent: "Bundle the agent this workshop's builder has authored into a portable .oap draft, stored as a builder-session artifact."
    permission:
      stateImpact: stateless

  - name: load_draft
    intent: "Re-apply a previously exported draft's bundle into this workshop, one apply per object, resuming a build."
    args:
      allowedFields: ["oap"]
    permission:
      stateImpact: passthrough

  - name: test_tool
    intent: "Run the agent under construction as a one-shot tester against a representative request and return its tool-results (never its prose). Read-only: use it automatically for read-only tools; get the person's OK before testing a side-effecting one."
    args:
      allowedFields: ["class", "request"]
    effects:
      readOnly: true
    permission:
      stateImpact: passthrough

  - name: test_link
    intent: "The ap:agentlink props that send the person to try the agent under construction themselves, in the browser chat."
    args:
      allowedFields: ["class", "prompt"]
    effects:
      readOnly: true
    permission:
      stateImpact: passthrough

  - name: watch_test
    intent: "Ask to be told when the person's own test of the agent starts, pauses, ends, or times out."
    args:
      allowedFields: ["class", "timeoutMinutes"]
    permission:
      stateImpact: external
      check:
        resourceType: workshop_draft
        resourceIDTemplate: "draft"
        permission: test

  - name: test_sessions
    intent: "The person's own test sessions of an agent in this workshop, by name and phase."
    args:
      allowedFields: ["class"]
    effects:
      readOnly: true
    permission:
      stateImpact: passthrough

  - name: read_test_log
    intent: "Read the current test session's tool-results and tool-errors."
    args:
      allowedFields: ["session"]
    effects:
      readOnly: true
    permission:
      stateImpact: passthrough

  - name: stop_test
    intent: "Stop the person's test session; the conversation returns to the builder. Stopping deletes the test conversation and its log, so read the log first."
    args:
      allowedFields: ["session"]
    permission:
      stateImpact: passthrough

  - name: request_credential
    intent: "Ask the person to connect a bot/shared credential (an API key, PAT, or static secret to paste, or a shared OAuth-MCP account to authorize) for an AgentIdentity you authored in this workshop. A card with a secure link goes to the person; they enter or authorize it and it lands in the workshop."
    args:
      allowedFields: ["identity", "credential", "authKind"]
    permission:
      stateImpact: external

  - name: request_install
    intent: "Ask a platform admin to install the agent this workshop has built. Records the request on the workshop; an admin card (delivered by a later plan) is what the person sees. Once-only: a second call after an install has already been requested is refused, not overwritten."
    args:
      allowedFields: ["suggestedName", "bundleDigest"]
    permission:
      stateImpact: external

  - name: recommend_capability
    intent: "Recommend a platform capability this build surfaced a need for — something no existing tool or toolbox covers. Records the recommendation on the workshop for a platform admin to review. Once-only: a second call after one has already been recorded is refused, not overwritten. This tool does not end the session by itself — call agent_work_complete afterward to do that."
    args:
      allowedFields: ["summary", "artifactRef", "draftRef"]
    permission:
      stateImpact: external

  - name: close_others
    intent: "Close the person's other open builder workshops (all, or the ones named, by the name shown on the page or the workshop name). A platform admin may name anyone's. Never closes this one. Answers with what was closed, what was refused and why, and anything still being decided."
    args:
      allowedFields: ["workshops"]
    permission:
      stateImpact: external

  - name: agents_in_thread
    intent: "List the other agents that have already worked this conversation thread — participants and their own delegated subagents — so a builder picking up mid-thread knows who was here already."
    effects:
      readOnly: true
    permission:
      stateImpact: passthrough

  - name: project_agent
    intent: "Project a credential-free practice double of another agent's class — one reachable from this conversation thread — into the workshop, so a hand-off to it can be rehearsed without ever running the real agent."
    args:
      allowedFields: ["namespace", "name"]
    permission:
      stateImpact: external
      check:
        resourceType: workshop_draft
        resourceIDTemplate: "draft"
        permission: project

# The instance those four checks name. `draft` is a CONSTANT id, and that is
# what lets a phase approval bind it: a plan names the instances a phase will
# touch before any call exists, so an id derived from a call's own arguments
# could never be one of them. The git toolkit keys read/write on the literal
# `workspace` for the same reason (toolkits/git.yaml). A grant is scoped to the
# session, so a shared id leaks nothing across sessions — what it means is
# "this session's own draft" — and the workshop namespace already bounds what
# apply can reach (pkg/controllers/workshop/rbac.go).
spicedbSchema:
  resources:
    - name: workshop_draft
      # session-only: no local permission governs who may approve a change to
      # a draft nobody has built yet. The session's own approvers decide, and
      # their decision IS the authority — for a builder session that is the
      # person, its only participant. Stated because there is no default.
      standing: session-only
      # The phrase an approval card shows in place of the wire handle. No
      # `label` deriver is named: those turn an instance's own value into a
      # short label, and a constant id has nothing per-instance to shorten.
      display: {name: "the draft in this workshop"}
      # One relation, so the definition is well-formed and names the session
      # a draft belongs to.
      relations:
        - {name: session, subjectType: agentsession}
      # The words each permission carries, for the two audiences a handle has.
      # `title` is what an approval card shows in place of `perm:change:workshop_draft`;
      # `planningNote` is the line the builder reads while DECLARING the phase
      # that will make the change. Without them this type has NO prose at all —
      # it is declared here and nowhere else, so the card detokenizes the wire
      # handle and the planner is told nothing. toolkits/git.yaml does the same
      # for git_repo.
      #
      # `expr` is INERT, not a permission model. schema.ComposeSlots REPLACES the
      # expression of every permission an AgentClass slots with
      # slot_grant_<permission>->interact, so what is written here survives only
      # for a class that failed to slot the permission — and `session` is a
      # relation nothing ever writes a tuple for, so that leftover resolves to
      # nobody. The composer owns the EXPR; the prose is published as declared.
      permissions:
        - name: change
          expr: session
          title: "Change this workshop's draft (any of its definitions)"
          planningNote: >-
            A phase that changes the draft lists this handle AND declares the
            workshop_draft slot on the phase (no id needed); the handle alone is
            refused, and the slot alone would quietly bind change.
        - name: remove
          expr: session
          title: "Remove a definition from this workshop's draft"
          planningNote: >-
            List it beside change when a definition will be replaced; a remove
            without it raises a card.
        - name: test
          expr: session
          title: "Watch a test of this workshop's draft"
          planningNote: >-
            The test phase lists it with the slot declared; re-arming the watch
            then needs no card.
        - name: project
          expr: session
          title: "Project a practice double of another agent into this workshop"
          planningNote: >-
            One approval covers every projection in the phase; the platform
            refuses any agent not already part of this conversation.
