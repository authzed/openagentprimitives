name: deny-pr-merge
toolkit: toolkit.yaml
spec: spec.yaml
invocation:
  command: gh
  argv: [pr, merge, "45", -R, authzed/openagentprimitives, --squash]
  binaryVersion: "2.53.1"
expect:
  allow: false
  failedOn: {path: allowSubcommands}
  traceContains:
    - {path: parse,            status: pass}
    - {path: allowSubcommands, status: fail}
