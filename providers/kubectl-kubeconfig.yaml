id: kubectl-kubeconfig
title: Kubernetes
description: A kubeconfig so the agent can run kubectl against your cluster as you.
docsURL: https://kubernetes.io/docs/concepts/configuration/organize-cluster-access-kubeconfig/
shape: kubeconfig
builtin: kubectl-kubeconfig

prompt: |
  The user needs to provide a kubeconfig that authenticates against the
  target cluster. Two paths are typical:
  1. Copy from an existing kubeconfig (e.g. ~/.kube/config). Walk the
     user through narrowing it to a single context, removing unused
     clusters/users, and pasting the YAML.
  2. Mint a service-account token + minimal kubeconfig for a specific
     namespace. The user provides the cluster CA + API server URL; the
     token comes from `kubectl create token <serviceaccount>`.
  Store the resulting kubeconfig YAML as a single string via
  store_credential.

# SECURITY NOTE: Regexes must be anchored at both ends (^ ... $).
# An unanchored pattern like "^kubectl config view" would allow
# "kubectl config view; rm -rf /" to pass because regexp.MatchString only
# requires the pattern to match somewhere in the input.
runShellAllowlist:
  - regex: '^kubectl config view( --raw| --minify| --flatten)*( -o (yaml|json))?$'
    description: "Render the user's current kubeconfig (no secrets stripped if --raw)"
  - regex: '^kubectl create token [a-z0-9-]+( --namespace [a-z0-9-]+)?( --duration [0-9]+[hms])?$'
    description: "Mint a fresh service-account token"

tokenShape:
  pattern: '(?s)^apiVersion:\s*v1\s*\n.*kind:\s*Config'
  description: "Starts with `apiVersion: v1` and contains `kind: Config`"
