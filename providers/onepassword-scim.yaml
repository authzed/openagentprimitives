id: onepassword-scim
title: 1Password
description: The bearer token for your 1Password SCIM bridge, so the agent can read managed groups and their members.
docsURL: https://support.1password.com/scim/
shape: bearer
builtin: onepassword-scim

instructions: |
  Supply your 1Password SCIM bridge's bearer token:

    1. The token was issued when the bridge was deployed, alongside the
       scimsession file — see https://support.1password.com/scim/
    2. Retrieve it from wherever your deployment stored it (your
       1Password account's automated-provisioning setup, or the secret
       your bridge deployment reads).
    3. Paste the BEARER TOKEN only. The scimsession file is a bridge
       deployment artifact, not a per-request credential.

  The bridge's own address is a separate value and is not asked for here.

prompt: |
  The 1Password SCIM bridge's bearer token is minted at bridge setup time,
  alongside a scimsession file, and is presented as
  "Authorization: Bearer <token>" to the customer-hosted bridge. It is not
  created on a page the user can be sent to on demand: point them at
  https://support.1password.com/scim/ and at wherever their own deployment
  stored it. Do NOT accept the scimsession file — it is a deployment
  artifact, not a request credential. The bridge's base URL is configured
  separately and must not be collected as part of the credential. After the
  user pastes the token, call store_credential.

# No tokenShape: 1Password documents no stable prefix or layout for the SCIM
# bridge bearer token, and a pattern guessed from one deployment would
# reject a legitimate token from another. ValidateToken stays permissive —
# never refuse a credential whose format we do not know — and the flow's own
# emptiness guard is what stops a blank one being stored.

# No verify: probe. VerifyConfig.Endpoint is catalog-supplied and absolute,
# and this bridge's address is per-install (spec.baseURL on the
# RelationshipSource), so there is no constant to probe. The flow's Verify
# reports "unsupported" rather than claiming a check it did not run.
