id: onepassword-service-account
title: 1Password
description: A 1Password service-account token, scoped to exactly one vault, so the agent's browser toolbox can fill the logins it holds.
docsURL: https://developer.1password.com/docs/service-accounts/
shape: bearer
builtin: onepassword-service-account

instructions: |
  Create a 1Password service account so the agent's browser toolbox can
  fill logins from one vault, and nothing else:

    1. Open https://developer.1password.com/docs/service-accounts/ and
       follow its guide to create a service account.
    2. Grant it read_items access to exactly ONE vault — the vault
       holding the logins this agent should use — and NO other vault
       or permission. A token scoped to more than one vault, or to
       write access, is rejected when it is verified.
    3. Copy the token (starts with ops_) and paste it below.

prompt: |
  Walk the user through creating a 1Password service account at
  https://developer.1password.com/docs/service-accounts/. It MUST be
  scoped to read_items on exactly ONE vault — the vault holding the
  logins this agent's browser toolbox should fill — and to no other
  vault or permission. After the user pastes the token (starts with
  ops_), validate the shape and call store_credential.

# Format gate — enforced at every entry point (paste forms, put-token CLI,
# setup flow) via ValidateToken. 1Password documents the ops_ prefix for
# service-account tokens; no length is pinned beyond the prefix so an
# unusual-but-valid token is never rejected.
tokenShape:
  pattern: '^ops_[A-Za-z0-9_-]+$'
  description: "service-account tokens start with ops_"

# No verify: probe. This provider's builtin flow (onepassword-service-account)
# runs a RICHER live check than the generic declarative bearer probe could
# express: it confirms the token resolves to EXACTLY ONE visible vault — the
# scoping invariant the browser toolbox's direct-credential path depends on
# (see pkg/platform/identity/directcred's doc comment) — not merely that some
# endpoint answers 200. A declarative verify: block here would be a no-op
# anyway: verify.go's VerifyCredential dispatches to a registered builtin
# before it ever reads this block.
