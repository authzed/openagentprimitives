<!doctype html><html><head><meta charset="utf-8"><style>
  body{font:16px/1.5 system-ui;margin:0;padding:24px;color:#111;max-width:560px}
  label{display:block;margin:14px 0 4px;font-weight:600}
  input,select,textarea{width:100%;padding:8px;border:1px solid #cbd5e1;border-radius:6px;font:inherit;box-sizing:border-box}
  .btn{margin-top:18px;padding:10px 18px;border-radius:8px;background:#2563eb;color:#fff;border:0;cursor:pointer;font:inherit}
</style></head><body>
  <h1 id="title">Create your account</h1>
  <form>
    <label for="email">Work email</label><input id="email" type="email" placeholder="you@example.com">
    <label for="team">Team size</label><select id="team"><option>1–10</option><option>11–50</option><option>51+</option></select>
    <label for="notes">What are you hoping to build?</label><textarea id="notes" rows="4"></textarea>
    <button id="submit" class="btn">Create account</button>
  </form>
</body></html>
