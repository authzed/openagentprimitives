name: CI

on:
  push:
    branches: [main]
  pull_request:

# On a PR branch, a push fires both `push` and `pull_request` for the same
# commit; scoping `push` to `main` leaves PRs covered by `pull_request` alone
# and keeps `main` validated after merges — no duplicate runs.
permissions:
  contents: read

# Cancel superseded runs on the same ref so a rapid re-push doesn't pile up
# duplicate PR runs. Never cancels `main` (push) runs, so every merge commit is
# fully validated.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Free disk space
        run: .github/free-disk-space.sh
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go install github.com/magefile/mage@v1.17.2 && echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: mage test:unit
      - run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s images/promptinjection-detector -p 'test_*.py'

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Free disk space
        run: .github/free-disk-space.sh
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go install github.com/magefile/mage@v1.17.2 && echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: mage test:integration

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - name: Free disk space
        run: .github/free-disk-space.sh
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go install github.com/magefile/mage@v1.17.2 && echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: mage test:e2e

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5
          run_install: false
      - run: pnpm install --frozen-lockfile
        working-directory: web
      - run: pnpm typecheck
        working-directory: web
      - run: pnpm test
        working-directory: web
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go install github.com/magefile/mage@v1.17.2 && echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: mage web:check
