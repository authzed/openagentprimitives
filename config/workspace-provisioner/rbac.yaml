apiVersion: v1
kind: ServiceAccount
metadata:
  name: ap-workspace-provisioner
  namespace: ap-workspace-storage
  labels:
    agentprimitives.authzed.com/install-tier: workspace-provisioner-rwx
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ap-workspace-provisioner
  labels:
    agentprimitives.authzed.com/install-tier: workspace-provisioner-rwx
rules:
  - apiGroups: [""]
    resources: ["nodes", "persistentvolumeclaims", "configmaps"]
    verbs: ["get", "list", "watch"]
  # The local-path provisioner provisions each volume by spawning a short-lived
  # busybox "helper pod" (mkdir on the selected node) in its own namespace, so it
  # needs create/delete on pods — not just read. Without this, provisioning fails
  # with "pods is forbidden: ... cannot create resource pods" and the PVC never
  # binds (the WaitForFirstConsumer consumer is created, but the volume can't be).
  - apiGroups: [""]
    resources: ["pods", "pods/log"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["endpoints", "persistentvolumes"]
    verbs: ["get", "list", "watch", "create", "delete", "patch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ap-workspace-provisioner
  labels:
    agentprimitives.authzed.com/install-tier: workspace-provisioner-rwx
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ap-workspace-provisioner
subjects:
  - kind: ServiceAccount
    name: ap-workspace-provisioner
    namespace: ap-workspace-storage
