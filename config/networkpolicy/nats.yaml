# nats: restricts who may reach the NATS broker.
#
# Ingress to spicebox-nats pods is allowed ONLY on the client port 4222, and
# only FROM the three legitimate NATS clients:
#   - channelsd  (the broker process)
#   - operator   (publishes/consumes control-plane subjects)
#   - runner pods, identified by the agentprimitives.authzed.com/agentsession
#     label key. Runner pods may run in ARBITRARY session namespaces, not just
#     agentprimitives-system, so the runner peer pairs a podSelector matching
#     that label key (operator: Exists) with an empty namespaceSelector ({})
#     meaning "any namespace". The label key alone is the identity signal.
#
# The NATS monitor port 8222 is deliberately NOT listed here — default-deny
# keeps it unreachable from every pod.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nats
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: spicebox-nats
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: spicebox-channelsd
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: spicebox-operator
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: agentprimitives-authzd
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: spicebox-webd
        # Runner pods, in any namespace, identified by the agentsession label.
        - namespaceSelector: {}
          podSelector:
            matchExpressions:
              - { key: agentprimitives.authzed.com/agentsession, operator: Exists }
      ports:
        - { protocol: TCP, port: 4222 }
