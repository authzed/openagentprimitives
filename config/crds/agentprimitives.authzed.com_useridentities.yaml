---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: useridentities.agentprimitives.authzed.com
spec:
  group: agentprimitives.authzed.com
  names:
    categories:
    - authzed
    - spicebox
    kind: UserIdentity
    listKind: UserIdentityList
    plural: useridentities
    shortNames:
    - uid
    singular: useridentity
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.subject
      name: Subject
      type: string
    - jsonPath: .status.conditions[?(@.type=='Valid')].status
      name: Valid
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          UserIdentity is a human's credential catalog: the credentials one person has
          linked, keyed by their canonical SpiceDB subject, used by
          identityMode=userPassthrough agents through a per-session
          SessionUserIdentity projection.

          Cluster-scoped. Reconciled by pkg/controllers/useridentity -- one reconciler
          for validity, one for proactive OAuth refresh. metadata.name is a
          deterministic hash of spec.subject rather than the subject itself, and the
          referenced Secrets live in the agentprimitives-identities namespace.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              credentials:
                description: |-
                  Credentials are the user's reusable named credentials. Same shape as
                  AgentIdentity.Spec.Credentials. The secretRefs name Secrets in the
                  agentprimitives-identities namespace (IdentitiesNamespace).
                  Credential names must match what tools declare (or the runtime
                  default — see MCPServerAuth.Credential / ToolkitEnvVar.Credential).
                items:
                  properties:
                    allowedHosts:
                      description: |-
                        AllowedHosts scopes where this credential may be sent, as host patterns
                        ("github.com", "*.internal.example"). Matching is on the URL authority
                        (host and port), case-insensitively; a leading "*." matches one or more
                        leading labels but never the apex, so an author who wants both lists
                        both.

                        It exists because destination and credential were independent fields on
                        the same tenant-writable object with nothing tying them together: a
                        SkillSource naming spec.repoURL: "https://attacker.example/x.git" and
                        spec.auth pointing at a production PAT made the operator send that PAT to
                        that host as an HTTP Basic password, reading the Secret with its own
                        cluster-wide credentials so the actor never needed `get secrets`.

                        EMPTY MEANS UNSCOPED, which is the only reading that does not break every
                        existing credential on upgrade. That makes the field opt-in, so a caller
                        with a stricter default enforces it itself rather than relying on this:
                        the SkillSource controller refuses an unscoped credential for a clone
                        outright, because there is no safe default destination for one.
                      items:
                        type: string
                      type: array
                    federated:
                      description: |-
                        Federated is populated when type=federated. The credential is MINTED
                        on demand via ID-JAG from the user's enterprise identity — there is
                        no stored access token. Valid ONLY on UserIdentity /
                        SessionUserIdentity; rejected on AgentIdentity (bot identities have no
                        human subject to assert).
                      properties:
                        idpSecretRef:
                          description: |-
                            IdPSecretRef points at the subject-keyed IdP-identity Secret in
                            IdentitiesNamespace (the user's refresh token).
                          properties:
                            name:
                              description: Name is the Secret's name, in the referring
                                object's own namespace.
                              type: string
                          required:
                          - name
                          type: object
                        resource:
                          description: |-
                            Resource is the identifier the IdP knows the MCP server by — the
                            ID-JAG audience.
                          type: string
                        resourceServerURL:
                          description: |-
                            ResourceServerURL is the MCP server URL whose authorization server
                            accepts the ID-JAG (leg 2 discovery target).
                          type: string
                        scopes:
                          description: Scopes are optional scopes requested at the
                            resource AS.
                          items:
                            type: string
                          type: array
                      required:
                      - idpSecretRef
                      - resource
                      - resourceServerURL
                      type: object
                    githubApp:
                      description: GitHubApp is populated when type=githubApp.
                      properties:
                        secretRef:
                          description: SecretRef points at the Secret the channel
                            wizard wrote.
                          properties:
                            name:
                              description: Name is the Secret's name, in the referring
                                object's own namespace.
                              type: string
                          required:
                          - name
                          type: object
                      required:
                      - secretRef
                      type: object
                    name:
                      description: |-
                        Name is the credential's unique identifier. It is matched against the
                        credential names a toolkit/MCPServer declares to inject the resolved
                        value at runtime.
                      type: string
                    oauth:
                      description: |-
                        OAuth is populated when type=oauth. The referenced Secret holds
                        access_token, refresh_token, expires_at, token_endpoint, client_id,
                        scope as separate keys. Key names are fixed; not configurable.
                      properties:
                        secretRef:
                          description: |-
                            SecretRef points at a Secret whose keys hold the OAuth state.
                            Required keys (read at runtime / refresh time):
                              access_token   — current access token
                              refresh_token  — long-lived refresh token (optional)
                              expires_at     — RFC 3339 timestamp; absent → never expires
                              token_endpoint — auth-server URL for refresh
                              client_id      — OAuth client ID used at registration
                              scope          — granted scopes (informational)
                          properties:
                            name:
                              description: Name is the Secret's name, in the referring
                                object's own namespace.
                              type: string
                          required:
                          - name
                          type: object
                      required:
                      - secretRef
                      type: object
                    static:
                      description: Static is populated when type=static.
                      properties:
                        secretRef:
                          description: SecretRef points at a Secret in the same namespace
                            as the AgentIdentity.
                          properties:
                            key:
                              description: Key is the data key within the Secret holding
                                the value.
                              type: string
                            name:
                              description: Name is the Secret's name, in the referring
                                object's own namespace.
                              type: string
                          required:
                          - key
                          - name
                          type: object
                      required:
                      - secretRef
                      type: object
                    type:
                      description: Type discriminates which of the blocks below is
                        populated.
                      enum:
                      - static
                      - oauth
                      - federated
                      - githubApp
                      type: string
                  required:
                  - name
                  - type
                  type: object
                type: array
              displayName:
                description: |-
                  DisplayName is a human-friendly label (e.g. an email address) surfaced in
                  CLI output and the web UI.
                type: string
              refreshThreshold:
                description: |-
                  RefreshThreshold overrides the operator-wide default OAuth refresh
                  threshold for this identity. No effect on type=static credentials.
                type: string
              subject:
                description: |-
                  Subject is the canonical SpiceDB subject of the user this catalog
                  belongs to, e.g. "user:YWxpY2VAZXhhbXBsZS5jb20=". metadata.name is a
                  deterministic hash of this value (see pkg/platform/identity/useridentity).
                minLength: 1
                type: string
            required:
            - subject
            type: object
          status:
            properties:
              availableCredentials:
                description: |-
                  AvailableCredentials is the set of credential names this identity
                  successfully provides — a convenience for the operator's passthrough
                  gate and CLI output.
                items:
                  type: string
                type: array
              channelIdentities:
                description: |-
                  ChannelIdentities is the durable directory of the channel-native
                  identities (Slack user in a workspace, …) that map to this canonical
                  user. One canonical user fans out to many entries — the same human has
                  distinct external IDs across unrelated Slack workspaces/orgs. Written by
                  channelsd (best-effort) via a status merge-patch disjoint from the
                  credential fields the useridentity controller owns.
                items:
                  description: |-
                    ChannelIdentity is one channel-native identity linked to a canonical user.
                    (Kind, Domain, ExternalID) is the unique key: Domain is the workspace/org
                    scope (Slack team_id) that distinguishes the same person across workspaces.
                  properties:
                    displayName:
                      description: DisplayName is the channel-native display/real
                        name, when known.
                      type: string
                    domain:
                      description: Domain is the workspace/org scope (Slack team_id);
                        "" for kinds without one.
                      type: string
                    email:
                      description: Email is the trusted email the channel vouched
                        for, when known.
                      type: string
                    externalID:
                      description: ExternalID is the channel-native user id, e.g.
                        a Slack user_id.
                      type: string
                    kind:
                      description: Kind is the channel kind, e.g. "slack".
                      type: string
                  required:
                  - domain
                  - externalID
                  - kind
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - kind
                - domain
                - externalID
                x-kubernetes-list-type: map
              conditions:
                description: |-
                  Conditions carries Valid and Refresh; the reason constants are shared
                  with AgentIdentity.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              lastRefreshAt:
                description: LastRefreshAt is the most recent successful OAuth refresh.
                format: date-time
                type: string
              observedCredentials:
                description: |-
                  ObservedCredentials is the durable trigger state for in-flight
                  credential revocation — see AgentIdentityStatus.ObservedCredentials for
                  the full contract. SecretNames is unused here: a UserIdentity
                  credential's master Secret name is derived from (identity, credential)
                  rather than referenced by the spec.
                items:
                  description: |-
                    ObservedCredential is one entry of an identity's status.observedCredentials
                    — the operator's record of a credential it has already accounted for in the
                    revocation diff. Shared by AgentIdentity and UserIdentity.
                  properties:
                    fingerprint:
                      description: |-
                        Fingerprint is "<type>:<secretRefName>": stable across reconciles and
                        sensitive to both a type change (static↔oauth) and a Secret-ref rename,
                        which is how an OAuth refresh surfaces a replaced credential.
                      type: string
                    name:
                      description: Name is the credential name from spec.credentials[].name.
                      type: string
                    secretNames:
                      description: |-
                        SecretNames are the backing Secret names for this credential, recorded
                        so a REMOVED credential's revoke key can be reconstructed without
                        re-reading a spec that no longer mentions it.

                        Empty for UserIdentity, whose backing Secret name is derived from
                        (identity name, credential name) rather than referenced by the spec.
                      items:
                        type: string
                      type: array
                  required:
                  - fingerprint
                  - name
                  type: object
                type: array
              observedGeneration:
                description: ObservedGeneration is the spec generation this status
                  reflects.
                format: int64
                type: integer
              resolvedCredentials:
                description: ResolvedCredentials lists credential names whose Secret
                  + key resolved.
                items:
                  type: string
                type: array
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
