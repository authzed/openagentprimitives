---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: workspacesources.agentprimitives.authzed.com
spec:
  group: agentprimitives.authzed.com
  names:
    categories:
    - authzed
    - spicebox
    kind: WorkspaceSource
    listKind: WorkspaceSourceList
    plural: workspacesources
    shortNames:
    - wsrc
    singular: workspacesource
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.source.kind
      name: Kind
      type: string
    - jsonPath: .status.conditions[?(@.type=='Valid')].status
      name: Valid
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          WorkspaceSource declares a named, pluggable origin that per-session
          workspaces are cut from. The origin kind is registered
          (pkg/platform/workspacekinds); git is the backend that exists today.

          Namespaced. Reconciled by pkg/controllers/workspacesource, which validates
          the spec against the named kind, provisions a shared base PVC, and runs a
          Job to materialize the checkout into it. Sessions never clone the origin
          themselves: the AgentSession reconciler cuts a copy-on-write overlay off
          that shared base once, then freezes it for the session lifetime, so
          re-pointing this object mid-session does not move a running workspace.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              base:
                description: Base configures the shared read-cache every session overlays
                  off.
                properties:
                  refresh:
                    description: |-
                      Refresh controls whether/how often the shared base is re-pulled from the
                      origin. "" or "onDemand" (default) never auto-refreshes. A Go duration
                      (e.g. "10m") re-pulls the base on that interval so new sessions overlay
                      off a near-current base and pull only the delta.
                    type: string
                  size:
                    description: Size is the base PVC request (default 2Gi).
                    type: string
                type: object
              scope:
                description: Scope narrows which subpaths a session may see; empty
                  exposes everything.
                properties:
                  paths:
                    description: Paths is the allowlist; empty exposes the whole checkout.
                    items:
                      properties:
                        path:
                          description: Path is a subpath relative to the checkout
                            root.
                          type: string
                        writable:
                          description: Writable permits the session to modify this
                            subtree; default is read-only.
                          type: boolean
                      required:
                      - path
                      type: object
                    type: array
                type: object
              source:
                description: Source is the driver and the location it points at.
                properties:
                  config:
                    additionalProperties:
                      type: string
                    description: Config is driver-specific extra configuration, opaque
                      here.
                    type: object
                  kind:
                    description: Kind selects the registered driver (e.g. "git").
                    pattern: ^[a-z0-9]+$
                    type: string
                  locator:
                    description: Locator is the driver-parsed source location (repo
                      URL, file:// path, …).
                    type: string
                  ref:
                    description: |-
                      Ref is the driver-specific revision (a git branch, tag or SHA); empty
                      takes the driver's default.
                    type: string
                required:
                - kind
                - locator
                type: object
            required:
            - source
            type: object
          status:
            properties:
              baseClaimName:
                description: BaseClaimName is the shared base PVC sessions cut their
                  overlay from.
                type: string
              conditions:
                description: Conditions carries Valid and Ready.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              lastMaterializedAt:
                description: LastMaterializedAt is when the base checkout was first
                  populated.
                format: date-time
                type: string
              lastRefreshedAt:
                description: LastRefreshedAt is when a scheduled base refresh last
                  completed.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the spec generation this status
                  reflects.
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
