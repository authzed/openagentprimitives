---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: clusterskillsources.agentprimitives.authzed.com
spec:
  group: agentprimitives.authzed.com
  names:
    categories:
    - authzed
    - spicebox
    kind: ClusterSkillSource
    listKind: ClusterSkillSourceList
    plural: clusterskillsources
    shortNames:
    - csksrc
    singular: clusterskillsource
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.repoURL
      name: Repo
      type: string
    - jsonPath: .status.resolvedSHA
      name: SHA
      type: string
    - jsonPath: .status.discoveredSkills
      name: Skills
      type: integer
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ClusterSkillSource is a git repo that materializes cluster-scoped
          ClusterSkills. Auth is a direct Secret reference, because AgentIdentity is
          namespaced and so unavailable at cluster scope.

          Cluster-scoped. Reconciled by pkg/controllers/clusterskillsource, which
          clones at spec.ref, discovers SKILL.md files under spec.subpath, caches each
          bundle by content digest, and owns the ClusterSkills it creates. It is the
          cluster-scoped mirror of pkg/controllers/skillsource.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              auth:
                description: Auth references a Secret holding the clone token (e.g.
                  a github PAT).
                properties:
                  namespace:
                    description: Namespace of the Secret (required — cluster scope
                      has no implicit namespace).
                    type: string
                  secretRef:
                    properties:
                      key:
                        description: Key is the data key within the Secret holding
                          the value.
                        type: string
                      name:
                        description: Name is the Secret's name, in the referring object's
                          own namespace.
                        type: string
                    required:
                    - key
                    - name
                    type: object
                required:
                - namespace
                - secretRef
                type: object
              disableRepoInstructions:
                description: |-
                  DisableRepoInstructions, when true, stops this source from discovering and
                  attaching the repo-root agent-instructions file (AGENTS.md/CLAUDE.md) to
                  the skills it materializes. Default (false) = enabled.
                type: boolean
              ref:
                type: string
              repoURL:
                type: string
              subpath:
                type: string
              sync:
                description: SkillSourceSync controls the re-poll cadence.
                properties:
                  interval:
                    description: Interval between re-polls. Zero → controller default
                      (1h).
                    type: string
                type: object
            required:
            - repoURL
            type: object
          status:
            description: SkillSourceStatus is the observed state.
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              discoveredSkills:
                description: DiscoveredSkills is the number of Skills materialized
                  on the last sync.
                format: int32
                type: integer
              discoveryProblems:
                description: |-
                  DiscoveryProblems lists SKILL.md files found but skipped on the last sync
                  (invalid frontmatter, name/dir mismatch, parse/bundle error) WITH the
                  reason, so an operator can see why a skill did not materialize without
                  reading operator logs. Capped (excess summarized).
                items:
                  type: string
                type: array
              lastSyncTime:
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the spec generation this status
                  reflects.
                format: int64
                type: integer
              resolvedSHA:
                description: ResolvedSHA is the commit the last successful sync pulled.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
