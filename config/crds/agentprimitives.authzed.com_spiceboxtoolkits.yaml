                    description: |-
                      VersionRange is the semver range the description is valid for; empty
                      accepts any version.
                    type: string
                required:
                - binary
                type: object
              toolkitRevision:
                description: |-
                  ToolkitRevision is the description's own revision, bumped when the
                  declared surface changes.
