---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: spiceboxtoolkits.agentprimitives.authzed.com
spec:
  group: agentprimitives.authzed.com
  names:
    categories:
    - authzed
    - spicebox
    kind: SpiceboxToolkit
    listKind: SpiceboxToolkitList
    plural: spiceboxtoolkits
    shortNames:
    - sbxtk
    singular: spiceboxtoolkit
  scope: Cluster
  versions:
  - name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          SpiceboxToolkit is the machine-readable description of one CLI a sandbox
          tool can be built from: its subcommands, flags, env, parser config and
          default per-tool authz policy. A SpiceboxToolspec narrows a toolkit down to
          the specific tool an agent is actually handed.

          Cluster-scoped. Reconciled by pkg/controllers/spiceboxtoolkit, which detects
          collisions with the built-in toolkits and stamps a cli-kind pin baseline
          onto status.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              SpiceboxToolkitSpec mirrors pkg/tools/toolspec/toolkit.Toolkit.

              The shape is re-declared rather than embedded so the CRD carries explicit
              kubebuilder annotations and controller-gen emits a stable DeepCopy.
              Conversion uses a JSON round-trip (ToToolkit), so this field set must stay
              byte-compatible with toolkit.Toolkit's JSON shape.
            properties:
              docs:
                description: Docs is prose about the CLI, surfaced to authors.
                type: string
              env:
                description: |-
                  Env describes the environment variables the binary reads. It documents
                  and wires them — notably which are sensitive — and is not a filter on the
                  environment the binary actually receives. Mirrors
                  pkg/tools/toolspec/toolkit.Toolkit.Env.
                properties:
                  allowed:
                    description: |-
                      Allowed DESCRIBES the environment variables the binary reads. It is not
                      an enforcement boundary: nothing strips a variable for being absent here.
                      The environment a tool call runs with is composed by the ToolCall
                      controller from the broker-resolved credentials, ToolCall.spec.env,
                      SpiceboxSession.spec.defaultEnv, this toolkit's envDefaults and the
                      sandbox container's own env.

                      What an entry drives is keyed off Sensitive: redaction wherever the call
                      is surfaced, which credential a setup flow must obtain, and which names a
                      SpiceboxClass may not shadow through its own envDefaults. Adding a
                      variable here documents and wires it; omitting one does not keep it out
                      of the binary's environment.
                    items:
                      properties:
                        credential:
                          description: |-
                            Credential is the name of the credential (in the agent's identity
                            catalog) that fills this env var. When empty, resolution falls back
                            to a name derived from the env var (lowercased, "_"→"-"). Only
                            meaningful when Sensitive is true.
                          type: string
                        description:
                          description: Description is the user-facing explanation
                            of what this variable carries.
                          type: string
                        name:
                          description: Name is the environment variable name.
                          type: string
                        prompt:
                          description: |-
                            Prompt is free-text the LLM-fallback setup agent uses as system
                            context when no provider matches. Optional.
                          type: string
                        provider:
                          description: |-
                            Provider names a provider in the /providers/ library that satisfies
                            this env's auth needs. Used by `oap agent setup-identity` to dispatch
                            the right setup flow. Optional.
                          type: string
                        sensitive:
                          description: |-
                            Sensitive marks the value as credential material: it is resolved from an
                            identity, masked in output, and never logged.
                          type: boolean
                        title:
                          description: |-
                            Title is the short user-facing display name for the credential this
                            env var carries ("GitHub"). Shown as the bold header of a
                            credential-request row. Takes precedence over the provider catalog;
                            when empty the catalog (via Provider) or a humanized credential name
                            is used. Only meaningful when Sensitive is true.
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                required:
                - allowed
                type: object
              envDefaults:
                additionalProperties:
                  type: string
                description: |-
                  EnvDefaults is static, non-secret environment this toolkit sets on every
                  invocation of its binary, so a CLI's own hardening travels with the
                  description of that CLI. It is a floor: the runner stamps it onto each
                  ToolCall's spec.env, and the toolcall controller demotes any key still
                  carrying this declared value below SpiceboxSession.spec.defaultEnv and
                  SpiceboxClass.spec.envDefaults, so an operator setting the same key keeps
                  winning.

                  Values are never secret. A key that Env.Allowed marks sensitive is
                  rejected: those come from an AgentIdentity credential, and a static
                  default for the same key would either fail the call
                  (ToolCallEnvShadowsAgent) or replace the credential with a fixed string.
                  Mirrors pkg/tools/toolspec/toolkit.Toolkit.EnvDefaults.
                type: object
              globalFlags:
                description: GlobalFlags are flags accepted before any subcommand.
                items:
                  properties:
                    description:
                      description: Description is the user-facing explanation of the
                        flag.
                      type: string
                    long:
                      description: Long is the flag's long form, without leading dashes.
                      type: string
                    optionalValue:
                      description: |-
                        OptionalValue declares that the binary accepts this flag's value only in
                        the attached `--flag=value` form (git's PARSE_OPT_OPTARG, pflag's
                        NoOptDefVal), so the parser must not consume the following token as the
                        value — the binary won't. Mirrors
                        pkg/tools/toolspec/toolkit.Flag.OptionalValue; invalid on type "bool".
                      type: boolean
                    sensitive:
                      description: Sensitive keeps the flag's value out of logs and
                        approval prompts.
                      type: boolean
                    short:
                      description: Short is the single-letter form, without its dash;
                        empty if none.
                      type: string
                    splitOn:
                      description: |-
                        SplitOn, when non-empty, splits one supplied value into repeated flag
                        occurrences on this separator.
                      type: string
                    type:
                      description: Type is the value type; "bool" means the flag takes
                        no value.
                      type: string
                    values:
                      description: Values, when non-empty, restricts the flag to this
                        enumeration.
                      items:
                        type: string
                      type: array
                  required:
                  - long
                  - type
                  type: object
                type: array
              name:
                description: Name is the toolkit identifier a SpiceboxToolspec references.
                type: string
              parser:
                description: Parser selects how an invocation's argv is validated
                  and bound.
                properties:
                  kind:
                    description: |-
                      Kind selects the argv parser: declarative drives off this spec, builtin
                      names a compiled-in parser.
                    enum:
                    - declarative
                    - builtin
                    type: string
                  name:
                    description: Name identifies the builtin parser; unused when Kind
                      is declarative.
                    type: string
                required:
                - kind
                type: object
              permission:
                description: |-
                  Permission is the toolkit-wide default per-tool authz policy.
                  Subcommands may override individually via their own Permission
                  block. Mirrors pkg/tools/toolspec/toolkit.Toolkit.Permission.
                properties:
                  check:
                    description: |-
                      PermissionCheck names the SpiceDB resource and permission to
                      evaluate. Required when StateImpact is Readonly / Readwrite /
                      External; forbidden when Stateless / Passthrough.
                    properties:
                      enforceMode:
                        description: |-
                          EnforceMode controls deny-finality under permissive toolAuthMode.
                          Empty → EnforceInherit (slice-1 default).
                        type: string
                      extractionPrompt:
                        description: |-
                          ExtractionPrompt, when set, is an English fragment the runner
                          includes in the extraction LLM's system prompt for this resource
                          type. Tool spec authors write this once per toolspec/MCPServer
                          file. The runner aggregates ExtractionPrompts across all tools
                          whose Check targets the same resourceType (dedup'd, concatenated).
                          The AgentClass's BoundEntityType.ExtractionPrompt overrides
                          entirely if set.
                        type: string
                      grantBindsArgs:
                        description: |-
                          GrantBindsArgs, when set, restricts the slice-2 grant's
                          arguments_hash caveat binding to only the listed top-level arg
                          keys. Default (nil/empty) hashes the full arg map, meaning the
                          grant satisfies only the exact same call. Setting it to e.g.
                          ["repo"] lets a single approval cover every subsequent call
                          against the same repo regardless of other args (pr number,
                          etc.) — useful for readonly tools where the resource is the
                          load-bearing input.

                          The hash is an HMAC-SHA256 under the per-session args-hash key
                          minted by the AgentSession reconciler into the per-session
                          Secret and read by the runner at startup. Caveat contexts
                          therefore cannot be predicted or minted outside the
                          controller+runner trust domain — neither the agent nor a
                          confused deputy with SpiceDB write access can forge a valid
                          binding for arguments that were never requested. Note: hashes
                          of previously-requested (including denied) calls remain
                          observable in session status and channel payloads, so a
                          SpiceDB-write attacker could still replay those; the keying
                          narrows that surface to exactly the calls a human has already
                          seen. See pkg/authz/guardian/grants.ArgsHashFiltered for the
                          filtering contract.

                          NOTE: the hash no longer BINDS the grant. A slot grant is keyed on
                          (instance, permission), which is what makes it safe to reuse across
                          calls: a grant shaped for one permission cannot be spent on another
                          against the same id. The filtered hash is still computed and published
                          on the approval request (ToolApprovalDetails.ArgsHash) so an approver —
                          and the audit log — can see exactly which call was asked about.
                        items:
                          type: string
                        type: array
                      permission:
                        description: |-
                          Permission is the SpiceDB permission (or relation) name to
                          Check (e.g. "read", "write", "admin"). Static.

                          Pattern-validated at admission for the same reason as ResourceType.
                          Mirrors BoundEntityType.Permission.
                        pattern: ^[a-z][a-z0-9_]*$
                        type: string
                      resourceIDExpr:
                        description: |-
                          ResourceIDExpr is a CEL string expression evaluated against
                          `args` that yields the SpiceDB resource id. Exactly one of
                          ResourceIDTemplate or ResourceIDExpr must be set: the template
                          form for simple `{arg}` interpolation, the Expr form for
                          nested-arg extraction.
                        type: string
                      resourceIDHint:
                        description: |-
                          ResourceIDHint is shown to the AGENT when the resource id cannot be
                          resolved from the call's arguments.

                          That failure is usually the caller's to fix — it named no resource, or
                          named it in a form the check cannot read — and the agent is the only
                          party who can retry. Without a hint the message is the raw resolution
                          error prefixed "internal:", which reads as a system fault and tells it
                          not to bother.

                          Written by whoever authors the check, because only they know what the
                          call should have looked like. Example, for a git push whose remote must
                          be a URL so the repository can be authorized: "name the remote as a full
                          https:// URL, not a shorthand like `origin`".
                        type: string
                      resourceIDTemplate:
                        description: |-
                          ResourceIDTemplate is a string with {arg} placeholders that
                          interpolate from the tool call's args (e.g. "{owner}/{repo}").
                          Resolved at runtime by ResolveTemplate; validated at
                          AgentClass-reconcile time so every {arg} matches a parameter
                          the tool declares.
                        type: string
                      resourceIDTransforms:
                        description: |-
                          ResourceIDTransforms names registered transforms applied IN
                          ORDER to the resolved template string before SpiceDB sees it:
                          lowercase, remove_spaces, spicedb_object_id, basename, sha256.
                          See transforms.go.
                        items:
                          type: string
                        type: array
                      resourceType:
                        description: |-
                          ResourceType is the SpiceDB definition the Check runs against
                          (e.g. "github_repo", "channel"). Static — no template interpolation.

                          Pattern-validated at admission because this value is a component of a
                          permsurface.Handle, which appears in approved plan ceilings and audit
                          records. Mirrors BoundEntityType.ResourceType.
                        pattern: ^[a-z][a-z0-9_]*(/[a-z][a-z0-9_]*)*$
                        type: string
                    required:
                    - permission
                    - resourceType
                    type: object
                  stateImpact:
                    description: StateImpact describes the policy mode for a tool
                      / subcommand.
                    type: string
                  toolName:
                    description: |-
                      ToolName lets Layer 2's CheckScope evaluate the tool allow/deny
                      axis. Wire from the registered tool name. Empty string skips
                      the Layer 2 tool check (existing behavior).
                    type: string
                required:
                - stateImpact
                type: object
              siteURL:
                description: |-
                  SiteURL is the toolkit-backed service's user-facing homepage.
                  identityd discovers a favicon from this URL for the credential
                  rows backed by this toolkit's sensitive env vars (e.g., a
                  github-token row resolves through the github toolkit). Optional;
                  unset renders the deterministic generated fallback icon.

                  Must be http or https; admission rejects other schemes.
                type: string
              spicedbSchema:
                description: |-
                  SpiceDBSchema declares the SpiceDB resource types this toolkit's
                  permission checks name, so the toolkit ships the definitions its own
                  checks depend on. Mirrors pkg/toolspec/toolkit.Toolkit.SpiceDBSchema; the
                  guardian composes it alongside MCPServer and SpiceDBBootstrap fragments.
                properties:
                  rawZed:
                    description: |-
                      RawZed is appended verbatim to the composed schema after Resources
                      are emitted. Use this for SpiceDB schema features the structured
                      form can't represent: subject-relations (e.g. `slack_user#user`)
                      and unions (e.g. `user | agent`). The composer does not parse or
                      validate RawZed beyond schema-load time; malformed text fails the
                      SpiceDB WriteSchema call.
                    type: string
                  resources:
                    description: |-
                      Resources lists structured SpiceDB definitions contributed by this
                      fragment. Each resource is emitted with its declared relations and
                      permissions; the composer dedupes by name across fragments.
                    items:
                      description: SpiceDBResource is one SpiceDB resource definition
                        contributed by a fragment.
                      properties:
                        approverPermission:
                          description: |-
                            ApproverPermission names the permission an approver must hold on an
                            instance for their approval to count. Required when Standing is `required`,
                            and must be empty when it is `session-only` — a type nothing governs has no
                            permission to name, and accepting one there would read as governance that
                            is never consulted.

                            Declared rather than assumed. This was hardcoded to "owner" at four call
                            sites, which silently made two very different types look identical to the
                            approval router: crm_company's `owner` is a real computed permission backed
                            by seeded tuples, while git_repo's `owner` is a bare relation declared only
                            so the checks are answerable and never populated by anything. The router
                            could not tell governance from an artifact of schema shape, so a push to a
                            git remote resolved to an empty owner-set and became unapprovable forever.

                            Naming it also lifts the assumption that the approving permission is called
                            "owner": a type may route approval through `maintainer`, `admin`, or any
                            permission its own schema defines.
                          type: string
                        display:
                          description: |-
                            Display declares how an INSTANCE of this resource type presents on an
                            approval card — an icon, and how to turn its raw value (a URL, typically)
                            into a short label. Absent means the card falls back to the wire type
                            name, exactly as before this field existed.
                          properties:
                            icon:
                              description: |-
                                Icon names a glyph from a CLOSED, code-defined registry — never a URL
                                and never free-form. A vendor-specific type (github_repo) may name the
                                vendor's own mark; a host-agnostic type (git_repo) must name a generic
                                one, because claiming a vendor mark would lie the moment an instance
                                points somewhere else (a self-hosted remote). An unrecognized name
                                renders no icon — never a fallback image, never a guess.
                              maxLength: 40
                              type: string
                            label:
                              description: |-
                                Label names a deriver from a CLOSED, code-defined set that turns an
                                instance's raw value into a short display label — "url_path",
                                "b64url_path", "last_segment", or "none" (the set registered in
                                pkg/authz/plangate's labelDerivers, which is the authority; this list is
                                prose and has drifted from it once). Not a template and not a regex: nothing here
                                can produce a label the code did not author, and the deriver never sees
                                anything an agent did not itself write into the plan (the instance
                                value), so a declaration can shorten a value's presentation but can
                                never fabricate one. An unrecognized name derives nothing, and the card
                                falls back to Name.
                              maxLength: 40
                              type: string
                            name:
                              description: |-
                                Name is the human name for this resource TYPE — "Git repository", never
                                the wire handle "git_repo". Shown when no per-instance label can be
                                derived (Label is "none", unset, or the deriver produces nothing for
                                this instance's value).
                              maxLength: 60
                              type: string
                          type: object
                        name:
                          description: Name is the SpiceDB definition name; the composer
                            dedupes on it.
                          type: string
                        permissions:
                          description: Permissions are the resource's computed permissions.
                          items:
                            description: |-
                              SpiceDBPermission is one permission on a resource. Expr is
                              the right-hand-side of the SpiceDB schema's `permission <name> = ...`
                              statement; the composer pastes it verbatim.
                            properties:
                              expr:
                                description: Expr is the right-hand side of `permission
                                  <name> = …`, pasted verbatim.
                                type: string
                              name:
                                description: Name is the permission name.
                                type: string
                              planningNote:
                                description: |-
                                  PlanningNote is one line of guidance the agent reads while DECLARING a
                                  plan, rendered next to the handles it may declare.

                                  The knowledge that shapes a good plan is toolkit-specific, so it lives
                                  with the toolkit rather than in the runner's generic prompt. git_repo
                                  splits its permissions across two instances — read/write key on the
                                  checked-out copy, fetch/push on the remote URL — so a phase declaring
                                  `write` without `read` can change files it cannot open, and the first
                                  read interrupts the human with an amendment the plan should have carried
                                  from the start.

                                  It shapes what the agent DECLARES, never what anything grants: a note is
                                  prose the model reads at plan time, and no authorization decision reads
                                  it. A phase that ignores its guidance still gets the gate it earned.
                                maxLength: 300
                                type: string
                              title:
                                description: |-
                                  Title is the phrase a human reads on an approval card instead of the
                                  permission's handle. `perm:push:git_repo` is a WIRE FORMAT; asking
                                  somebody to decide on it makes the decision slower and worse exactly
                                  where care matters most.

                                  Declared here because this is where the permission itself is declared, so
                                  one declaration serves every channel and the CLI. Absent is fine and
                                  common: the card detokenizes the handle instead, which shows no plumbing
                                  and invents no English.
                                maxLength: 120
                                type: string
                            required:
                            - expr
                            - name
                            type: object
                          type: array
                        relations:
                          description: Relations are the resource's relations, emitted
                            verbatim.
                          items:
                            description: SpiceDBRelation is one relation on a resource.
                            properties:
                              name:
                                description: Name is the relation name as it appears
                                  in the composed schema.
                                type: string
                              subjectType:
                                description: |-
                                  SubjectType must be a bare resource-type name (e.g. "user",
                                  "hubspot_owner") declared in this same SpiceDBSchema or the
                                  implicit "user" type. Wildcards ("user:*") are expressed via
                                  the separate Wildcard field. Subject-relation forms
                                  ("team#member") are NOT representable. Exactly one
                                  SubjectType per Relation — SpiceDB unions like
                                  `relation viewer: user | team#member` cannot be modeled.
                                type: string
                              wildcard:
                                description: |-
                                  Wildcard, when true, makes the relation accept ANY subject
                                  of SubjectType — emitted as `relation <name>: <subjectType>:*`
                                  in the composed schema. Use sparingly: a wildcard relation
                                  effectively grants the underlying-resource permission to
                                  every subject of that type, so any per-call gating must come
                                  from a different layer (e.g. `stateImpact: external` on the
                                  tool, which routes every call through the approval flow
                                  regardless of the SpiceDB Check result).
                                type: boolean
                            required:
                            - name
                            - subjectType
                            type: object
                          type: array
                        standing:
                          description: |-
                            Standing declares whether SpiceDB is AUTHORITATIVE for this resource type —
                            that is, whether an approver can be expected to already hold a permission on
                            an instance of it. REQUIRED, with no default.

                              - required      SpiceDB governs who may approve. The approver pool is
                                              ApproverPermission on the named instance, and an EMPTY pool
                                              is a final refusal — nobody can approve what nobody governs.
                              - session-only  No local permission governs approval for this type, so the
                                              session's own approvers decide and their decision IS the
                                              authority. Everything downstream is unchanged: the grant is
                                              still written, still expiring, still session-scoped and
                                              revocable, and the tool-call Check still runs.

                            There is deliberately NO default. A default is a hole you open by omission:
                            defaulting to session-only silently widens who may approve a type somebody
                            forgot to classify, and defaulting to required makes a forge-governed type
                            permanently unbindable because nothing writes a SpiceDB tuple for every git
                            remote. Neither failure announces itself, so the author states the answer.
                            Same reasoning as AP_CLUSTER_KIND, which also refuses to default.

                            Choosing is a question about the RESOURCE, not about convenience: does a
                            permission on this instance already say who may speak for it? A CRM company
                            with seeded owner tuples: yes, `required`. A git remote whose permissions
                            live at the forge: no, `session-only`.

                            A cluster or namespace admin can force any type to `required` with
                            SettingsLimits.RequireStandingFor, which no fragment may widen past.
                          enum:
                          - session-only
                          - required
                          type: string
                      required:
                      - name
                      - standing
                      type: object
                    type: array
                type: object
              streamFormat:
                description: |-
                  StreamFormat names a registered parser in pkg/tools/toolkitstream/registry.
                  When non-empty AND a subcommand has Mode stream or interactive, the
                  sandbox tool routes the bridge's stdout through the named parser before
                  publishing KindToolSessionEvent envelopes. Empty (default) preserves
                  the raw KindToolSessionDelta path. Mirrors
                  pkg/tools/toolspec/toolkit.Toolkit.StreamFormat. Example: "claude-stream-json".
                type: string
              subcommands:
                description: |-
                  Subcommands are the invocations this toolkit describes; anything absent
                  here is not expressible as a tool.
                items:
                  properties:
                    description:
                      description: Description is the user-facing explanation of what
                        the subcommand does.
                      type: string
                    effects:
                      description: Effects is the declared effect profile driving
                        approval and authz gating.
                      properties:
                        creds:
                          description: Creds is which credentials the invocation needs
                            or rewrites.
                          properties:
                            required:
                              description: Required names credentials the invocation
                                needs to succeed.
                              items:
                                type: string
                              type: array
                            writes:
                              description: Writes names credentials the invocation
                                may overwrite.
                              items:
                                type: string
                              type: array
                          required:
                          - required
                          - writes
                          type: object
                        destructive:
                          description: Destructive means the invocation can remove
                            or overwrite state.
                          type: boolean
                        filesystem:
                          description: Filesystem is what the invocation may touch
                            on disk.
                          properties:
                            paths:
                              description: Paths names the filesystem locations the
                                invocation touches.
                              items:
                                type: string
                              type: array
                          required:
                          - paths
                          type: object
                        network:
                          description: Network is where the invocation may reach.
                          properties:
                            destinations:
                              description: Destinations names the hosts the invocation
                                contacts; empty means none.
                              items:
                                type: string
                              type: array
                          required:
                          - destinations
                          type: object
                        reads:
                          description: Reads names the resource kinds the invocation
                            reads.
                          items:
                            type: string
                          type: array
                        writes:
                          description: Writes names the resource kinds the invocation
                            mutates.
                          items:
                            type: string
                          type: array
                      required:
                      - creds
                      - destructive
                      - filesystem
                      - network
                      - reads
                      - writes
                      type: object
                    flags:
                      description: Flags are the flags this subcommand accepts beyond
                        the global ones.
                      items:
                        properties:
                          description:
                            description: Description is the user-facing explanation
                              of the flag.
                            type: string
                          long:
                            description: Long is the flag's long form, without leading
                              dashes.
                            type: string
                          optionalValue:
                            description: |-
                              OptionalValue declares that the binary accepts this flag's value only in
                              the attached `--flag=value` form (git's PARSE_OPT_OPTARG, pflag's
                              NoOptDefVal), so the parser must not consume the following token as the
                              value — the binary won't. Mirrors
                              pkg/tools/toolspec/toolkit.Flag.OptionalValue; invalid on type "bool".
                            type: boolean
                          sensitive:
                            description: Sensitive keeps the flag's value out of logs
                              and approval prompts.
                            type: boolean
                          short:
                            description: Short is the single-letter form, without
                              its dash; empty if none.
                            type: string
                          splitOn:
                            description: |-
                              SplitOn, when non-empty, splits one supplied value into repeated flag
                              occurrences on this separator.
                            type: string
                          type:
                            description: Type is the value type; "bool" means the
                              flag takes no value.
                            type: string
                          values:
                            description: Values, when non-empty, restricts the flag
                              to this enumeration.
                            items:
                              type: string
                            type: array
                        required:
                        - long
                        - type
                        type: object
                      type: array
                    mode:
