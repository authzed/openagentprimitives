                      ("sha256:…"). RECORDED, not verified: in-sandbox measurement needs a
                      sandbox exec primitive that does not exist yet.
                    type: string
                  versionProbe:
                    description: VersionProbe is how to ask the binary its version;
                      nil skips the check.
