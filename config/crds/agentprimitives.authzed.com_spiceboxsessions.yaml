---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: spiceboxsessions.agentprimitives.authzed.com
spec:
  group: agentprimitives.authzed.com
  names:
    categories:
    - authzed
    - spicebox
    kind: SpiceboxSession
    listKind: SpiceboxSessionList
    plural: spiceboxsessions
    shortNames:
    - sbxses
    singular: spiceboxsession
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.class
      name: Class
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          SpiceboxSession is one live sandbox instantiated from a SpiceboxClass: the
          long-lived pod that this session's ToolCalls execute inside, plus its
          workspace, idle TTL and default env.

          Namespaced. Reconciled by pkg/controllers/spiceboxsession, which owns the
          sandbox pod through the registered backend (pkg/tools/sandboxkinds -- pod or
          agent-sandbox). An AgentSession that runs sandbox tools creates and owns one
          of these; it is also usable on its own, without an agent.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              agent:
                description: |-
                  Agent names an AgentIdentity in the same namespace whose credential
                  bindings are used as the default for ToolCalls in this session.
                  Optional; if unset and ToolCall.spec.agent is also unset, calls run with
                  no AgentIdentity-injected env.
                type: string
              class:
                description: Class names the cluster-scoped SpiceboxClass to instantiate.
                type: string
              defaultEnv:
                additionalProperties:
                  type: string
                description: |-
                  DefaultEnv is non-secret environment merged into every ToolCall in this
                  session, at lower precedence than ToolCall.spec.env and any
                  AgentIdentity-injected env. Used by the AgentSession controller to stamp
                  static tool-hardening env (e.g. GIT_CONFIG_GLOBAL) onto bundle sessions.
                type: object
              idleTTL:
                description: IdleTTL overrides the class's idle timeout for this session.
                type: string
              maxDuration:
                description: MaxDuration overrides the class's wall-clock lifetime
                  cap.
                type: string
              mounts:
                description: |-
                  Mounts are the data mounts this session's pod materializes, resolved by
                  the AgentSession controller. Concatenated with the class's authored
                  mounts by the pod builder, which does not care which provenance a mount
                  came from.
                items:
                  properties:
                    digest:
                      description: |-
                        Digest is the expected content identity ("sha256:..."), verified before
                        the content is used. Empty skips verification.
                      type: string
                    format:
                      default: raw
                      description: |-
                        Format describes what the source content is. Defaults to raw, which is
                        a direct read-only volume mount and is what every mount predating this
                        field does.
                      enum:
                      - raw
                      - tarGz
                      type: string
                    mountPath:
                      description: MountPath is the absolute path inside the sandbox
                        container.
                      type: string
                    name:
                      description: Name is the pod volume name.
                      type: string
                    source:
                      description: Source is where the mounted content comes from.
                      properties:
                        configMapRef:
                          description: ConfigMapRef names a ConfigMap in the session's
                            namespace.
                          properties:
                            name:
                              default: ""
                              description: |-
                                Name of the referent.
                                This field is effectively required, but due to backwards compatibility is
                                allowed to be empty. Instances of this type with an empty value here are
                                almost certainly wrong.
                                More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                              type: string
                          type: object
                          x-kubernetes-map-type: atomic
                      type: object
                  required:
                  - mountPath
                  - name
                  - source
                  type: object
                type: array
              sandbox:
                description: |-
                  Sandbox overrides the referenced SpiceboxClass's sandbox backend for this
                  session. Stamped by the AgentSession reconciler with the tier-resolved
                  decision; unset for a directly-created session, which then uses the
                  class's own setting. Folded into status.resolvedClass at bind time.
                properties:
                  config:
                    description: |-
                      Config is passed through to the backend verbatim. Opaque to AP: each
                      kind parses its own. Unset for the built-in pod backend, which takes all
                      of its configuration from the pod-vocabulary fields above.
                    x-kubernetes-preserve-unknown-fields: true
                  kind:
                    default: pod
                    description: |-
                      Kind names a registered sandbox kind. Defaults to "pod". An
                      UNRECOGNIZED kind marks the class Valid=False — lookup never falls back
                      to the built-in backend, because silently installing a different
                      substrate than the one asked for is worse than refusing.
                    type: string
                  warmPool:
                    description: |-
                      WarmPool requests pre-warmed capacity for this backend. Unset or
                      replicas: 0 means pre-warming is off — it spends real money on idle
                      capacity, so it is opt-in. Only a backend whose Runtime implements the
                      sandboxkinds.Prewarmer interface can honor a non-zero value; asking for
                      it on a backend that cannot is a class validation error, not a silent
                      no-op.

                      PREREQUISITE: pre-warming only actually adopts a pod when the
                      cluster's agent-sandbox install allows the
                      "agentprimitives.authzed.com" label domain (its AllowedLabelDomains
                      defaults to "sandbox.users.io" alone). Without that grant AP cannot
                      label an adopted pod, and — because AP's per-session NetworkPolicy
                      selects on that label — the backend degrades to ordinary cold
                      sandboxes and emits a monitoring warning rather than run one
                      unpoliced.
                    properties:
                      namespaces:
                        description: |-
                          Namespaces lists the namespaces to keep pre-warmed capacity in; a
                          separate pool is created in EACH. SpiceboxClass is cluster-scoped but the
                          pool objects are namespaced, and adoption only ever looks a pool up in
                          the ADOPTING SESSION's own namespace — so a pool in a namespace nothing
                          runs sessions in is pure idle spend nothing can adopt. Naming them
                          explicitly rather than discovering them is deliberate: pre-warming spends
                          real money, so the cluster owner states exactly where, as they state
                          exactly how many.

                          Replicas > 0 with an empty Namespaces is a class validation error, not a
                          silent no-op.
                        items:
                          type: string
                        type: array
                      replicas:
                        description: |-
                          Replicas is the number of sandboxes kept ready, PER NAMESPACE listed
                          below. 0 disables pre-warming.
                        format: int32
                        minimum: 0
                        type: integer
                    type: object
                type: object
              skillBundles:
                description: |-
                  SkillBundles is DEPRECATED; superseded by Mounts. Retained so a session
                  created before mounts existed and re-hydrated afterwards still builds:
                  sessions are wakeable, so a removal would break in-flight work mid-upgrade.
                  Removal is Task 11 of the sandbox-data-mounts plan, not an aspiration.
                items:
                  description: |-
                    SkillBundleMount names one staged skill bundle the sandbox pod unpacks. The
                    ConfigMap (created by the AgentSession controller in the session namespace)
                    holds the gzipped tar under "bundle.tar.gz"; the init container extracts it
                    to /skills/<MountName>/.
                  properties:
                    configMapName:
                      description: |-
                        ConfigMapName is the per-session ConfigMap holding the bundle tarball
                        (binaryData key "bundle.tar.gz").
                      type: string
                    mountName:
                      description: |-
                        MountName is the sanitized, collision-free directory name the bundle
                        unpacks to under /skills/<MountName>/.
                      type: string
                  required:
                  - configMapName
                  - mountName
                  type: object
                type: array
              toolConfig:
                additionalProperties:
                  x-kubernetes-preserve-unknown-fields: true
                description: |-
                  ToolConfig is a snapshot of the owning AgentClass.spec.config, stamped by
                  the AgentSession controller at session creation. The toolcall controller
                  exposes it to toolspec constraint CEL as the `config` root. Snapshotted
                  (not read live) so a mid-session class edit cannot silently change the
                  authority a running session was admitted under.
                type: object
                x-kubernetes-preserve-unknown-fields: true
              toolspecs:
                description: |-
                  Toolspecs optionally narrows the Class's toolspec set for this session.
                  If set, every entry must appear in the resolved Class's spec.toolspecs.
                  If unset, the session inherits the full class set.
                items:
                  description: ToolspecRef is a cluster-scoped reference to a SpiceboxToolspec.
                  properties:
                    name:
                      description: Name is the SpiceboxToolspec CR name.
                      type: string
                  required:
                  - name
                  type: object
                type: array
              workspace:
                description: |-
                  Workspace selects whether the sandbox shares a workspace volume or gets
                  its own.
                properties:
                  mode:
                    default: shared
                    description: |-
                      Mode is whether /workspace is a shared RWX volume or private to this
                      sandbox.
                    enum:
                    - shared
                    - isolated
                    type: string
                  sharedClaimName:
                    description: |-
                      SharedClaimName is the name of the RWX PersistentVolumeClaim to mount
                      at /workspace. Set by the AgentSession controller for bundle sessions
                      when a workspace StorageClass is configured. Ignored when Mode is
                      isolated or this is empty.
                    type: string
                type: object
            required:
            - class
            type: object
          status:
            properties:
              callCount:
                description: CallCount is a monotonic counter of completed ToolCalls.
                format: int64
                type: integer
              conditions:
                description: Conditions carries Ready, Progressing, Failed and Terminated.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              effectiveToolspecs:
                description: |-
                  EffectiveToolspecs is the resolved set of SpiceboxToolspec names in use
                  for this session — equal to spec.toolspecs if non-empty, else the
                  resolved class's spec.toolspecs. Recomputed on session and class changes.
                items:
                  type: string
                type: array
              lastActivityAt:
                description: LastActivityAt is the most recent time a ToolCall completed
                  against this session.
                format: date-time
                type: string
              observedGeneration:
                description: ObservedGeneration is the spec generation this status
                  reflects.
                format: int64
                type: integer
              podName:
                description: PodName is the sandbox Pod managed by this session.
                type: string
              resolvedAgent:
                description: |-
                  ResolvedAgent is a snapshot of spec.agent at session bind time. Frozen
                  for the session lifetime so a mid-flight Session edit doesn't change
                  identity for an in-flight session.
                type: string
              resolvedClass:
                description: |-
                  ResolvedClass is a snapshot of the SpiceboxClass spec at bind time.
                  Tool catalogs are frozen for the session lifetime, even if the class changes.
                properties:
                  envDefaults:
                    additionalProperties:
                      type: string
                    description: |-
                      EnvDefaults is merged into every bundle pod's spicebox container as
                      unconditional environment variables. Used to point process-level env
                      at PrivateVolumes mount paths (e.g. GIT_DIR=/var/ap-git/.git so git's
                      metadata + url-rewrite credentials never land on the shared workspace).
                      Keys that exactly match an auth-injected env var (those declared
                      sensitive in any builtin toolkit's env.allowed) are rejected at class
                      validation.
                    type: object
                  image:
                    description: |-
                      Image is the OCI image used for sandbox pods of this class. Optional: when
                      empty, the operator's configured default sandbox image is used
                      (--sandbox-image, which `oap install` registry-qualifies for the cluster, the
                      same way it does the runner image). Set it only to pin a custom sandbox
                      image — most classes (and every identity-setup bundle) should leave it
                      unset so the image is portable across local and cloud clusters.
                    type: string
                  mounts:
                    description: Mounts are extra read-only volumes composed into
                      every sandbox pod.
                    items:
                      properties:
                        digest:
                          description: |-
                            Digest is the expected content identity ("sha256:..."), verified before
                            the content is used. Empty skips verification.
                          type: string
                        format:
                          default: raw
                          description: |-
                            Format describes what the source content is. Defaults to raw, which is
                            a direct read-only volume mount and is what every mount predating this
                            field does.
                          enum:
                          - raw
                          - tarGz
                          type: string
                        mountPath:
                          description: MountPath is the absolute path inside the sandbox
                            container.
                          type: string
                        name:
                          description: Name is the pod volume name.
                          type: string
                        source:
                          description: Source is where the mounted content comes from.
                          properties:
                            configMapRef:
                              description: ConfigMapRef names a ConfigMap in the session's
                                namespace.
                              properties:
                                name:
                                  default: ""
                                  description: |-
                                    Name of the referent.
                                    This field is effectively required, but due to backwards compatibility is
                                    allowed to be empty. Instances of this type with an empty value here are
                                    almost certainly wrong.
                                    More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                                  type: string
                              type: object
                              x-kubernetes-map-type: atomic
                          type: object
                      required:
                      - mountPath
                      - name
                      - source
                      type: object
                    type: array
                  network:
                    description: Network is the sandbox's egress posture.
                    properties:
                      allowedHosts:
                        description: |-
                          AllowedHosts is the intended hostname allowlist. RECORDED, not enforced:
                          stock NetworkPolicy cannot express hostnames, so a DNS-aware policy
                          controller must consume it to narrow beyond Mode's L3/L4 rules.
                        items:
                          type: string
                        type: array
                      mode:
                        default: none
                        description: |-
                          Mode is the egress posture: none denies all, allowlist permits DNS plus
                          coarse outbound TCP.
                        enum:
                        - none
                        - allowlist
                        type: string
                    type: object
                  privateVolumes:
                    description: |-
                      PrivateVolumes are emptyDir volumes mounted only on this class's
                      bundle pods. Use these to hold per-bundle state that must NOT be
                      visible to other bundles sharing the workspace (e.g. .git directory
                      for credential isolation).
                    items:
                      description: PrivateVolume describes a per-bundle emptyDir mount.
                      properties:
                        mountPath:
                          description: |-
                            MountPath is the absolute path inside the spicebox container where
                            the volume is mounted. Must start with "/". Rejected at class
                            validation if it collides with a pod-builder-reserved mount path
                            (/work, /tmp, /workspace) or another PrivateVolume.
                          type: string
                        name:
                          description: |-
                            Name is the volume name (also the pod volume Name). Must be a
                            DNS-1123 label. Rejected at class validation if it collides with a
                            pod-builder-reserved volume name (work, tmp, workspace), a ConfigMap
                            mount name from spec.mounts, or another PrivateVolume.
                          type: string
                      required:
                      - mountPath
                      - name
                      type: object
                    type: array
                  resources:
                    description: Resources are the sandbox container's CPU, memory
                      and storage limits.
                    properties:
                      cacheSize:
                        anyOf:
                        - type: integer
                        - type: string
                        description: |-
                          CacheSize is the size limit of the disk-backed /var/ap-cache volume the
                          toolchain overlay mounts. Defaults to 2Gi when unset; only takes effect
                          when a toolchain is attached (no toolchains, no cache volume).

                          Unlike TmpSize/WorkSize this is DISK-backed, not memory-backed: it holds
                          the large consumers a toolchain redirects here — GOCACHE, GOMODCACHE,
                          PNPM_HOME, the XDG roots and TMPDIR. The pod builder raises the
                          container's ephemeral-storage limit by exactly this value, so raising it
                          is charged against node disk, not Memory. Raise it for a build box that
                          resolves a large dependency graph (e.g. reviewing a Go dependency-bump
                          PR): the module + build caches easily exceed 2Gi and the kubelet evicts
                          the pod when the volume passes its SizeLimit.
                        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                        x-kubernetes-int-or-string: true
                      cpu:
                        anyOf:
                        - type: integer
                        - type: string
                        description: CPU is the sandbox container's CPU limit.
                        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                        x-kubernetes-int-or-string: true
                      ephemeralStorage:
                        anyOf:
                        - type: integer
                        - type: string
                        description: EphemeralStorage is the container's disk-backed
                          storage limit.
                        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                        x-kubernetes-int-or-string: true
                      memory:
                        anyOf:
                        - type: integer
                        - type: string
                        description: |-
                          Memory is the container's memory limit, and the real cap on the
                          memory-backed /tmp and /work — see TmpSize.
                        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                        x-kubernetes-int-or-string: true
                      pidsLimit:
                        default: 64
                        description: PidsLimit caps processes inside the sandbox,
                          bounding fork bombs.
                        format: int64
                        minimum: 1
                        type: integer
                      tmpSize:
                        anyOf:
                        - type: integer
                        - type: string
                        description: |-
                          TmpSize is the size limit of the pod's /tmp. Defaults to 50Mi when unset.

                          /tmp and /work are memory-backed (tmpfs) emptyDirs. The size here is a CAP,
                          not a reservation: pages are charged against this class's Memory limit only
                          as they are written. So raising TmpSize alone buys nothing — the memory
                          limit binds first, and the pod is OOM-killed rather than told ENOSPC. Raise
                          Memory alongside it.

                          Prefer pointing a tool's scratch at the disk-backed /var/ap-cache over
                          growing tmpfs at all: TMPDIR, GOCACHE, PNPM_HOME and the XDG roots already
                          resolve there when a toolchain is attached, so /tmp holds only what a tool
                          writes in defiance of them.
                        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                        x-kubernetes-int-or-string: true
                      workSize:
                        anyOf:
                        - type: integer
                        - type: string
                        description: |-
                          WorkSize is the size limit of the pod's /work. Defaults to 100Mi when
                          unset. Memory-backed; see TmpSize.
                        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                        x-kubernetes-int-or-string: true
                    required:
                    - cpu
                    - ephemeralStorage
                    - memory
                    type: object
                  runtimeClassName:
                    description: RuntimeClassName selects the Kubernetes RuntimeClass.
                      Defaults to "kata-fc" when unset.
                    type: string
                  sandbox:
                    description: |-
                      Sandbox selects the backend that runs this class's sandboxes. Optional:
                      an unset kind defaults to "pod", the built-in Kubernetes Pod backend.

                      The pod-vocabulary fields above (Image, RuntimeClassName, Resources,
                      Mounts, PrivateVolumes) remain the shared vocabulary every pod-shaped
                      backend consumes; this stanza carries only the discriminator and
                      backend-specific extras.
                    properties:
                      config:
                        description: |-
                          Config is passed through to the backend verbatim. Opaque to AP: each
                          kind parses its own. Unset for the built-in pod backend, which takes all
                          of its configuration from the pod-vocabulary fields above.
                        x-kubernetes-preserve-unknown-fields: true
                      kind:
                        default: pod
                        description: |-
                          Kind names a registered sandbox kind. Defaults to "pod". An
                          UNRECOGNIZED kind marks the class Valid=False — lookup never falls back
                          to the built-in backend, because silently installing a different
                          substrate than the one asked for is worse than refusing.
                        type: string
                      warmPool:
                        description: |-
                          WarmPool requests pre-warmed capacity for this backend. Unset or
                          replicas: 0 means pre-warming is off — it spends real money on idle
                          capacity, so it is opt-in. Only a backend whose Runtime implements the
                          sandboxkinds.Prewarmer interface can honor a non-zero value; asking for
                          it on a backend that cannot is a class validation error, not a silent
                          no-op.

                          PREREQUISITE: pre-warming only actually adopts a pod when the
                          cluster's agent-sandbox install allows the
                          "agentprimitives.authzed.com" label domain (its AllowedLabelDomains
                          defaults to "sandbox.users.io" alone). Without that grant AP cannot
                          label an adopted pod, and — because AP's per-session NetworkPolicy
                          selects on that label — the backend degrades to ordinary cold
                          sandboxes and emits a monitoring warning rather than run one
                          unpoliced.
                        properties:
                          namespaces:
                            description: |-
                              Namespaces lists the namespaces to keep pre-warmed capacity in; a
                              separate pool is created in EACH. SpiceboxClass is cluster-scoped but the
                              pool objects are namespaced, and adoption only ever looks a pool up in
                              the ADOPTING SESSION's own namespace — so a pool in a namespace nothing
                              runs sessions in is pure idle spend nothing can adopt. Naming them
                              explicitly rather than discovering them is deliberate: pre-warming spends
                              real money, so the cluster owner states exactly where, as they state
                              exactly how many.

                              Replicas > 0 with an empty Namespaces is a class validation error, not a
                              silent no-op.
                            items:
                              type: string
                            type: array
                          replicas:
                            description: |-
                              Replicas is the number of sandboxes kept ready, PER NAMESPACE listed
                              below. 0 disables pre-warming.
                            format: int32
                            minimum: 0
                            type: integer
                        type: object
                    type: object
                  sessionDefaults:
                    description: SessionDefaults are the lifetime defaults sessions
                      of this class inherit.
                    properties:
                      idleTTL:
                        default: 30m
                        description: IdleTTL is how long a session may sit idle before
                          it is terminated.
                        type: string
                      maxDuration:
                        default: 4h
                        description: MaxDuration is the wall-clock lifetime cap on
                          a session.
                        type: string
                    type: object
                  toolchains:
                    description: |-
                      Toolchains names SpiceboxToolchain CRs whose payloads are composed into
                      every pod of this class as read-only overlays under /opt/ap-toolchains.
                      Each named toolchain must exist and be Valid=True or the session fails
                      closed. Order is irrelevant: the operator sorts and deduplicates.
                    items:
                      type: string
                    type: array
                  tools:
                    description: Tools are the executables a ToolCall may dispatch
                      inside this sandbox.
                    items:
                      properties:
                        command:
                          description: Command is the absolute path + argv[0] of the
                            tool binary.
                          items:
                            type: string
                          type: array
                        defaultArgs:
                          description: DefaultArgs are prepended to every invocation's
                            arguments.
                          items:
                            type: string
                          type: array
                        expectedDuration:
                          default: short
                          description: |-
                            ExpectedDuration picks the dispatch mode: short runs synchronously, long
                            and persistent stream.
                          enum:
                          - short
                          - long
                          - persistent
                          type: string
                        name:
                          description: Name is how a ToolCall refers to this tool.
                          type: string
                      required:
                      - command
                      - name
                      type: object
                    type: array
                  toolspecs:
                    description: |-
                      Toolspecs lists SpiceboxToolspec CRs whose validation rules apply to
                      ToolCalls in sessions of this class. At least one Toolspec must cover
                      each tool in spec.tools, otherwise the class is marked Valid=False.
                    items:
                      description: ToolspecRef is a cluster-scoped reference to a
                        SpiceboxToolspec.
                      properties:
                        name:
                          description: Name is the SpiceboxToolspec CR name.
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                required:
                - resources
                type: object
              resolvedToolchains:
                description: |-
                  ResolvedToolchains is the frozen, self-contained resolution of the
                  class's spec.toolchains, captured at first bind alongside ResolvedClass.
                  The pod builder reads only this — it never re-reads SpiceboxToolchain CRs,
                  so a catalog edit mid-session cannot change a running pod.
                items:
                  description: |-
                    ToolchainMount is a resolved, self-contained toolchain: everything the pod
                    builder needs, with no further CR reads. Frozen onto
                    SpiceboxSessionStatus.ResolvedToolchains at first bind, mirroring how
                    SkillBundleMount is threaded onto the session spec.
                  properties:
                    bin:
                      description: Bin lists PATH entries relative to this toolchain's
                        root.
                      items:
                        type: string
                      type: array
                    env:
                      additionalProperties:
                        type: string
                      description: Env is already expanded — no templates remain.
                      type: object
                    image:
                      description: Image is the OCI image carrying the payload.
                      type: string
                    name:
                      description: Name is the toolchain name; it is also the directory
                        under the root path.
                      type: string
                    prefix:
                      description: Prefix is the payload's absolute path inside Image.
                      type: string
                    sizeBytes:
                      description: SizeBytes is the payload's on-disk usage, driving
                        the emptyDir SizeLimit.
                      format: int64
                      type: integer
                    sourceKind:
                      description: SourceKind is the delivery backend that resolved
                        this mount.
                      type: string
                  required:
                  - image
                  - name
                  - prefix
                  - sourceKind
                  type: object
                type: array
              sandbox:
                description: |-
                  Sandbox is the durable handle to this session's sandbox, written by the
                  SpiceboxSession controller once the backend has created it. It is the
                  only link the ToolCall controller has to the sandbox, and it must
                  survive an operator restart, so it lives here rather than in memory.
                properties:
                  kind:
                    description: Kind is the sandbox kind that owns Ref.
                    type: string
                  prewarmed:
                    description: |-
                      Prewarmed reports whether this sandbox was adopted from a pool of
                      already-running capacity rather than created on demand.

                      LOAD-BEARING, not decoration. A pre-warming backend may resolve Ref
                      differently for an adopted sandbox than for a cold one, and every verb
                      (status, teardown, exec) resolves from the stored handle alone. It is
                      persisted here, rather than recomputed, precisely so it survives an
                      operator restart: recomputing it would ask a question whose inputs no
                      longer exist once the sandbox is running.
                    type: boolean
                  ref:
                    description: |-
                      Ref is the backend's own identifier for this sandbox. The pod backend
                      uses "<namespace>/<podName>"; another backend may use a bare ID.
                    type: string
                required:
                - kind
                - ref
                type: object
              toolchainSetDigest:
                description: |-
                  ToolchainSetDigest is a stable hex sha256 over the (name, image) pairs of
                  ResolvedToolchains, order-independent and image-sensitive. Recorded
                  alongside the freeze and carried into the toolchain-audit "resolved" entry
                  so an investigation can match a session's pod to what was attested.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
