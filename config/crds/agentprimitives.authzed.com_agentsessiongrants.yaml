          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              pairs:
                description: |-
                  Pairs is the unique set of (resourceType, permission) tuples this
                  class needs as grant relations. Order is normalized at write time.
                items:
                  properties:
                    permission:
                      description: |-
                        Permission is the SpiceDB permission name on ResourceType
                        (e.g., "read", "admin").
                      minLength: 1
                      pattern: ^[a-z][a-z0-9_]*$
                      type: string
                    resourceType:
                      description: ResourceType is the SpiceDB definition name (e.g.,
                        "github_repo").
                      minLength: 1
                      pattern: ^[a-z][a-z0-9_]*(/[a-z][a-z0-9_]*)*$
                      type: string
                  required:
                  - permission
                  - resourceType
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - resourceType
                - permission
                x-kubernetes-list-type: map
              slots:
                description: |-
                  Slots is the set of (resourceType, permission) tuples this class declares
                  through authz.slots — the INSTANCE axis.

                  Shape-identical to Pairs and semantically its mirror image, which is why
                  it is a separate field rather than more entries in the same list. A Pair
                  makes the composer put a grant relation on the SESSION pointing at the
                  resource; a Slot makes it put one on the RESOURCE pointing at the session.
                  Collapsing them would lose exactly the distinction that decides whether
                  the resulting check is per-requester.
                items:
                  properties:
                    permission:
                      description: |-
                        Permission is the SpiceDB permission name on ResourceType
                        (e.g., "read", "admin").
                      minLength: 1
                      pattern: ^[a-z][a-z0-9_]*$
                      type: string
                    resourceType:
                      description: ResourceType is the SpiceDB definition name (e.g.,
                        "github_repo").
                      minLength: 1
                      pattern: ^[a-z][a-z0-9_]*(/[a-z][a-z0-9_]*)*$
                      type: string
                  required:
                  - permission
                  - resourceType
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - resourceType
                - permission
                x-kubernetes-list-type: map
            type: object
          status:
            properties:
              conditions:
                description: Conditions carries SchemaIncluded.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
