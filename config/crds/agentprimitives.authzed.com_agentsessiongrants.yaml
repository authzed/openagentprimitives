                type: array
              observedPairCount:
                description: ObservedPairCount echoes len(spec.pairs) at the last
                  observation.
                format: int32
                type: integer
              observedSchemaWrittenAt:
                description: |-
                  ObservedSchemaWrittenAt records when the guardian controller last
                  confirmed (or wrote) a SpiceDB schema that includes these pairs.
                format: date-time
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
