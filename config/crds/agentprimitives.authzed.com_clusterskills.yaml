---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: clusterskills.agentprimitives.authzed.com
spec:
  group: agentprimitives.authzed.com
  names:
    categories:
    - authzed
    - spicebox
    kind: ClusterSkill
    listKind: ClusterSkillList
    plural: clusterskills
    shortNames:
    - cskl
    singular: clusterskill
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=='Valid')].status
      name: Valid
      type: string
    - jsonPath: .spec.canonicalName
      name: Canonical
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ClusterSkill is a cluster-scoped Skill, visible to every namespace. A
          namespaced Skill with the same canonical name shadows it at resolution time.

          Cluster-scoped. Reconciled by pkg/controllers/clusterskill, which only keeps
          the Valid and Pinned conditions honest -- it never pulls or stages content,
          because a ClusterSkill is fully described by its spec. Discovery and
          materialization belong to the ClusterSkillSource controller.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: SkillSpec is the desired state of a Skill.
            properties:
              body:
                description: |-
                  Body is the SKILL.md markdown body, loaded on demand by the load_skill
                  tool. Stored inline, well within the etcd object budget.
                type: string
              bundle:
                description: |-
                  Bundle references the cached scripts/assets archive; nil means the skill
                  is instruction-only and nothing is staged into the sandbox for it.
                properties:
                  cacheKey:
                    description: CacheKey is the skillbundle.Store lookup key.
                    type: string
                  digest:
                    description: Digest is the content digest of the bundle archive.
                    type: string
                required:
                - cacheKey
                - digest
                type: object
              canonicalName:
                description: |-
                  CanonicalName is the stable, collision-free identity, e.g.
                  "github.com/someorg/somerepo//skills/skillone@v1.2.0". All references
                  (AgentClass, settings ceilings) use this string.
                type: string
              description:
                description: |-
                  Description is the frontmatter description — the always-on metadata that
                  progressive disclosure injects into the agent prompt (~100 tokens).
                type: string
              displayName:
                description: DisplayName is an optional human label; defaults to the
                  frontmatter name.
                type: string
              frontmatter:
                description: Frontmatter carries the remaining SKILL.md frontmatter
                  fields.
                properties:
                  allowedTools:
                    description: |-
                      AllowedTools is the experimental space-separated pre-approved tool list.
                      RECORDED, not enforced: nothing gates a tool call on it.
                    type: string
                  compatibility:
                    description: Compatibility is the author's declared compatibility
                      statement.
                    type: string
                  license:
                    description: License is the skill author's declared license identifier.
                    type: string
                  metadata:
                    additionalProperties:
                      type: string
                    description: |-
                      Metadata is the author's arbitrary key/value frontmatter, carried
                      verbatim and interpreted by nothing here.
                    type: object
                  name:
                    description: |-
                      Name is the frontmatter "name" (kebab-case); must match the canonical
                      skill directory basename.
                    type: string
                required:
                - name
                type: object
              repoInstructions:
                description: |-
                  RepoInstructions is the repo-root agent-instructions file (AGENTS.md or
                  CLAUDE.md) discovered in the skill's source repo, injected into the agent's
                  system prompt when this skill is linked to an AgentClass. nil for
                  hand-authored skills (no repo) or when the source set
                  disableRepoInstructions.
                properties:
                  content:
                    description: Content is the (possibly truncated) file contents.
                    type: string
                  sourceFile:
                    description: |-
                      SourceFile is the repo-root filename the content came from
                      ("AGENTS.md" or "CLAUDE.md"), shown as provenance in the prompt.
                    type: string
                  truncated:
                    description: Truncated is true when Content was capped at the
                      64 KiB injection limit.
                    type: boolean
                required:
                - content
                - sourceFile
                type: object
              source:
                description: |-
                  Source records git provenance, written by the SkillSource controller.
                  Empty for hand-authored skills.
                properties:
                  ref:
                    description: Ref is the requested ref (tag/branch/sha) as written
                      in the source.
                    type: string
                  repoLocator:
                    description: RepoLocator is the normalized host/org/repo (no scheme,
                      no .git).
                    type: string
                  resolvedSHA:
                    description: ResolvedSHA is the commit the controller actually
                      pulled.
                    type: string
                  sourceName:
                    description: SourceName is the owning SkillSource CR name (empty
                      for hand-authored).
                    type: string
                  subpath:
                    description: Subpath is the skill's directory within the repo.
                    type: string
                required:
                - repoLocator
                - subpath
                type: object
            required:
            - body
            - canonicalName
            - description
            type: object
          status:
            description: SkillStatus is the observed state of a Skill.
            properties:
              conditions:
                description: Conditions carries Valid and Pinned.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              observedGeneration:
                description: ObservedGeneration is the spec generation this status
                  reflects.
                format: int64
                type: integer
              pin:
                description: |-
                  Pin is the recorded pin identity in the common PinRecord shape. Its
                  Strength ("frozen" | "named" | "unpinned") is the single source of the
                  skill's syntactic pin strength. nil when the canonical name did not
                  parse -- the Valid and Pinned conditions carry the reason.
                properties:
                  details:
                    additionalProperties:
                      type: string
                    description: Details carries kind-specific extras (toolCount,
                      registry host, …).
                    type: object
                  digest:
                    description: |-
                      Digest is the immutable identity: git sha, sha256:… image digest,
                      canonical tool-manifest hash, or binary hash.
                    type: string
                  kind:
                    description: |-
                      Kind is the pinning registry kind name (skill, image, mcp, cli, …).
                      Validated against the registry by controllers, not by a CRD enum, so
                      new kinds register without an API change.
                    minLength: 1
                    type: string
                  observedAt:
                    description: ObservedAt is when the recording controller observed
                      this identity.
                    format: date-time
                    type: string
                  strength:
                    description: Strength is the syntactic pin strength of the declared
                      ref.
                    enum:
                    - frozen
                    - named
                    - unpinned
                    type: string
                  version:
                    description: |-
                      Version is the human-readable identity: tag, serverInfo.version, or
                      version-probe output.
                    type: string
                required:
                - kind
                - strength
                type: object
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
