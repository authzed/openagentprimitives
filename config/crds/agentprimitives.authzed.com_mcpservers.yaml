                    visibility:
                      description: "Visibility mirrors mcpspec.Tool.Visibility (MCP
                        Apps' _meta.ui.visibility):\nwhich surfaces (\"model\" / \"app\")
                        a tool is exposed to.\n\nThis repo's routing is an EXCLUSIVE
                        split, not a fan-out (see\npkg/agent/tool/mcp/synthesize.go):
                        a tool is browser-callable if and\nonly if this list contains
                        \"app\" and does NOT contain \"model\", and the\nowning MCPServer
                        sets mcpUiAppTools.enabled. Concretely:\n\n\tunset / []        ->
                        model-visible only; never reaches the browser\n\t[\"app\"]
                        \          -> browser-callable (with the opt-in); withheld
                        from the model\n\t[\"app\"] no opt-in -> rejected by default:
                        in NEITHER registry\n\t[\"model\"]         -> model-visible
                        only\n\t[\"app\",\"model\"]   -> model-visible only; NOT browser-callable\n\nSo
                        \"unset\" is not \"both\": it is the model surface. A tool
                        intended for\nan agent UI must say [\"app\"] and nothing else.
                        `oap agent lint` reports\nany other value for a tool an AgentUI
