---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  name: sessionuseridentities.agentprimitives.authzed.com
spec:
  group: agentprimitives.authzed.com
  names:
    categories:
    - authzed
    - spicebox
    kind: SessionUserIdentity
    listKind: SessionUserIdentityList
    plural: sessionuseridentities
    shortNames:
    - suid
    singular: sessionuseridentity
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.agentSession
      name: Session
      type: string
    - jsonPath: .status.conditions[?(@.type=='Ready')].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          SessionUserIdentity is one session's narrowing of a user's UserIdentity
          catalog down to just the credentials that session's agent asked for, for
          identityMode=userPassthrough. It is 1:1 with its AgentSession: metadata.name
          equals the session name, and an owner-ref ties their lifetimes together.

          Namespaced. It has no controller of its own -- pkg/controllers/agentsession
          builds it and server-side-applies it. status.missingCredentials is what
          parks the session in AwaitingCredentials, so an empty spec.credentials here
          means "still waiting for the user to link", not "no credentials needed".
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              agentSession:
                description: |-
                  AgentSession is the name of the owning AgentSession (same namespace).
                  metadata.name equals this value (1:1).
                type: string
              credentials:
                description: |-
                  Credentials is the subset of the UserIdentity's catalog the agent
                  needs. Same shape as AgentIdentity.Spec.Credentials. SecretRefs name
                  Secrets in the agentprimitives-identities namespace. Empty while
                  the session is parked with missing credentials.
                items:
                  properties:
                    allowedHosts:
                      description: |-
                        AllowedHosts scopes where this credential may be sent, as host patterns
                        ("github.com", "*.internal.example"). Matching is on the URL authority
                        (host and port), case-insensitively; a leading "*." matches one or more
                        leading labels but never the apex, so an author who wants both lists
                        both.

                        It exists because destination and credential were independent fields on
                        the same tenant-writable object with nothing tying them together: a
                        SkillSource naming spec.repoURL: "https://attacker.example/x.git" and
                        spec.auth pointing at a production PAT made the operator send that PAT to
                        that host as an HTTP Basic password, reading the Secret with its own
                        cluster-wide credentials so the actor never needed `get secrets`.

                        EMPTY MEANS UNSCOPED, which is the only reading that does not break every
                        existing credential on upgrade. That makes the field opt-in, so a caller
                        with a stricter default enforces it itself rather than relying on this:
                        the SkillSource controller refuses an unscoped credential for a clone
                        outright, because there is no safe default destination for one.
                      items:
                        type: string
                      type: array
                    federated:
                      description: |-
                        Federated is populated when type=federated. The credential is MINTED
                        on demand via ID-JAG from the user's enterprise identity — there is
                        no stored access token. Valid ONLY on UserIdentity /
                        SessionUserIdentity; rejected on AgentIdentity (bot identities have no
                        human subject to assert).
                      properties:
                        idpSecretRef:
                          description: |-
                            IdPSecretRef points at the subject-keyed IdP-identity Secret in
                            IdentitiesNamespace (the user's refresh token).
                          properties:
                            name:
                              description: Name is the Secret's name, in the referring
                                object's own namespace.
                              type: string
                          required:
                          - name
                          type: object
                        resource:
                          description: |-
                            Resource is the identifier the IdP knows the MCP server by — the
                            ID-JAG audience.
                          type: string
                        resourceServerURL:
                          description: |-
                            ResourceServerURL is the MCP server URL whose authorization server
                            accepts the ID-JAG (leg 2 discovery target).
                          type: string
                        scopes:
                          description: Scopes are optional scopes requested at the
                            resource AS.
                          items:
                            type: string
                          type: array
                      required:
                      - idpSecretRef
                      - resource
                      - resourceServerURL
                      type: object
                    githubApp:
                      description: GitHubApp is populated when type=githubApp.
                      properties:
                        secretRef:
                          description: SecretRef points at the Secret the channel
                            wizard wrote.
                          properties:
                            name:
                              description: Name is the Secret's name, in the referring
                                object's own namespace.
                              type: string
                          required:
                          - name
                          type: object
                      required:
                      - secretRef
                      type: object
                    name:
                      description: |-
                        Name is the credential's unique identifier. It is matched against the
                        credential names a toolkit/MCPServer declares to inject the resolved
                        value at runtime.
                      type: string
                    oauth:
                      description: |-
                        OAuth is populated when type=oauth. The referenced Secret holds
                        access_token, refresh_token, expires_at, token_endpoint, client_id,
                        scope as separate keys. Key names are fixed; not configurable.
                      properties:
                        secretRef:
                          description: |-
                            SecretRef points at a Secret whose keys hold the OAuth state.
                            Required keys (read at runtime / refresh time):
                              access_token   — current access token
                              refresh_token  — long-lived refresh token (optional)
                              expires_at     — RFC 3339 timestamp; absent → never expires
                              token_endpoint — auth-server URL for refresh
                              client_id      — OAuth client ID used at registration
                              scope          — granted scopes (informational)
                          properties:
                            name:
                              description: Name is the Secret's name, in the referring
                                object's own namespace.
                              type: string
                          required:
                          - name
                          type: object
                      required:
                      - secretRef
                      type: object
                    static:
                      description: Static is populated when type=static.
                      properties:
                        secretRef:
                          description: SecretRef points at a Secret in the same namespace
                            as the AgentIdentity.
                          properties:
                            key:
                              description: Key is the data key within the Secret holding
                                the value.
                              type: string
                            name:
                              description: Name is the Secret's name, in the referring
                                object's own namespace.
                              type: string
                          required:
                          - key
                          - name
                          type: object
                      required:
                      - secretRef
                      type: object
                    type:
                      description: Type discriminates which of the blocks below is
                        populated.
                      enum:
                      - static
                      - oauth
                      - federated
                      - githubApp
                      type: string
                  required:
                  - name
                  - type
                  type: object
                type: array
              subject:
                description: Subject is the starter's canonical SpiceDB subject.
                type: string
              userIdentity:
                description: |-
                  UserIdentity is the name of the cluster-scoped UserIdentity this
                  projection was narrowed from.
                type: string
            required:
            - agentSession
            - subject
            - userIdentity
            type: object
          status:
            properties:
              conditions:
                description: Conditions carries Ready; see SessionUserIdentityConditionReady.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              explanation:
                description: |-
                  Explanation is the structured per-credential description rendered to
                  the user (one Item per missing credential). Populated by the
                  operator's BuildExplanation; rendered by channelsd (Slack DM) and
                  identityd (portal menu).
                properties:
                  items:
                    description: Items is one entry per missing credential, in stable
                      order.
                    items:
                      description: |-
                        CredentialExplanationItem is one credential row: a service Title, a
                        Description of what the token is, and an agent-specific Why.
                      properties:
                        credential:
                          description: Credential is the final (post-remap) credential
                            name this row is for.
                          type: string
                        description:
                          description: Description is the "what is this token" sentence.
                          type: string
                        title:
                          description: Title is the user-facing service/token display
                            name ("GitHub").
                          type: string
                        why:
                          description: |-
                            Why is the agent-specific reason. EMPTY is meaningful: it signals
                            "no explicit reason declared" so the render surface applies its own
                            fallback (channelsd: LLM then static; identityd: static). A non-empty
                            Why is rendered verbatim and never sent to the LLM.
                          type: string
                      required:
                      - credential
                      type: object
                    type: array
                type: object
              lastInteractionAt:
                description: |-
                  LastInteractionAt is bumped by identityd's heartbeat while the user is
                  actively linking, so an in-progress link does not time out.
                format: date-time
                type: string
              missingCredentials:
                description: |-
                  MissingCredentials lists credential names the agent needs but the
                  user has not linked. Empty → ready to proceed.
                items:
                  type: string
                type: array
              observedGeneration:
                description: ObservedGeneration is the spec generation this status
                  reflects.
                format: int64
                type: integer
              parkedAt:
                description: |-
                  ParkedAt is when the owning session first entered AwaitingCredentials.
                  The credential-link timeout is measured from
                  max(ParkedAt, LastInteractionAt).
                format: date-time
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
