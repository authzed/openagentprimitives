                  configMapRef:
                    description: |-
                      ConfigMapKeyRef points at a single key inside a ConfigMap in the same
                      namespace as the referencing CR.
                    properties:
                      key:
                        description: Key is the data key within the ConfigMap.
                        type: string
                      name:
                        description: Name is the ConfigMap's name.
                        type: string
                    required:
                    - key
                    - name
                    type: object
                  inline:
                    type: string
                type: object
              toolBundles:
                description: |-
                  ToolBundles is optional. An empty/missing list means the agent runs
                  with only meta tools (e.g. agent_work_complete). Plan 1 supports only
                  the empty case; Plan 2 wires sandbox tool dispatch.
                items:
                  properties:
                    agentIdentity:
                      description: AgentIdentity overrides spec.agentIdentity for
                        this bundle.
                      type: string
                    class:
                      description: Class names a SpiceboxClass (cluster-scoped).
                      type: string
                    credentialRemap:
                      additionalProperties:
                        type: string
                      description: |-
                        CredentialRemap remaps a tool-declared credential name to a
                        differently-named credential in the agent's identity catalog —
                        the opt-in escape hatch when two tools declare the same credential
                        name but need different tokens. Keyed by the tool's declared name.
                      type: object
                    name:
                      description: Name is the LLM-facing prefix; pattern [a-z0-9_-]{1,32}.
                      type: string
                    sandbox:
                      description: |-
                        Sandbox overrides the sandbox backend for this bundle, taking precedence
                        over the referenced SpiceboxClass's own setting: the class states the
                        bundle's default, and the agent consuming it may have a reason to run it
                        elsewhere. Unset inherits the class's setting, or the tier defaults.
                      properties:
                        config:
                          description: |-
                            Config is passed through to the backend verbatim. Opaque to AP: each
                            kind parses its own. Unset for the built-in pod backend, which takes all
                            of its configuration from the pod-vocabulary fields above.
                          x-kubernetes-preserve-unknown-fields: true
                        kind:
                          default: pod
                          description: |-
                            Kind names a registered sandbox kind. Defaults to "pod". An
                            UNRECOGNIZED kind marks the class Valid=False — lookup never falls back
                            to the built-in backend, because silently installing a different
                            substrate than the one asked for is worse than refusing.
                          type: string
                        warmPool:
                          description: |-
                            WarmPool requests pre-warmed capacity for this backend. Unset or
                            replicas: 0 means pre-warming is off — it spends real money on idle
                            capacity, so it is opt-in. Only a backend whose Runtime implements the
                            sandboxkinds.Prewarmer interface can honor a non-zero value; asking for
                            it on a backend that cannot is a class validation error, not a silent
                            no-op.

                            PREREQUISITE: pre-warming only actually adopts a pod when the
                            cluster's agent-sandbox install allows the
                            "agentprimitives.authzed.com" label domain (its AllowedLabelDomains
                            defaults to "sandbox.users.io" alone). Without that grant AP cannot
                            label an adopted pod, and — because AP's per-session NetworkPolicy
                            selects on that label — the backend degrades to ordinary cold
                            sandboxes and emits a monitoring warning rather than run one
                            unpoliced.
                          properties:
                            namespaces:
                              description: |-
                                Namespaces lists the namespaces to keep pre-warmed capacity in; a
                                separate pool is created in EACH. SpiceboxClass is cluster-scoped but the
                                pool objects are namespaced, and adoption only ever looks a pool up in
                                the ADOPTING SESSION's own namespace — so a pool in a namespace nothing
                                runs sessions in is pure idle spend nothing can adopt. Naming them
                                explicitly rather than discovering them is deliberate: pre-warming spends
                                real money, so the cluster owner states exactly where, as they state
                                exactly how many.

                                Replicas > 0 with an empty Namespaces is a class validation error, not a
                                silent no-op.
                              items:
                                type: string
                              type: array
                            replicas:
                              description: |-
                                Replicas is the number of sandboxes kept ready, PER NAMESPACE listed
                                below. 0 disables pre-warming.
                              format: int32
                              minimum: 0
                              type: integer
                          type: object
                      type: object
                    stageSkills:
                      description: |-
                        StageSkills names which of this AgentClass's sandbox-targeted skills get
                        staged to disk, by their local AgentSkill.Name. "*" means all of them.
                        Absent means none — the default, since most agents consume a skill
                        through load_skill and never need it on disk.

                        Enforced CLASS-WIDE, not per-bundle: the union of every ToolBundle's
                        StageSkills in this class is staged onto EVERY bundle's sandbox session,
                        so a bundle whose own StageSkills names nothing still receives whatever
                        another bundle in the class opted in. A per-bundle mount, scoped to only
                        the bundle that named it, is a possible future direction and not
                        current behaviour.
                      items:
                        type: string
                      type: array
                    toolspecs:
                      description: Toolspecs lists SpiceboxToolspec names that scope
                        this bundle.
                      items:
                        type: string
                      type: array
                  required:
                  - class
                  - name
                  - toolspecs
                  type: object
                type: array
              toolGuard:
                description: |-
                  ToolGuard is this class's tool circuit-breaker / rate-limit rules,
                  consulted first in the tier walk (overrides namespace/cluster defaults
                  and the built-in rule for matching tools).
                properties:
                  rules:
                    description: |-
                      Rules are evaluated in order, first match wins; empty means this tier
                      contributes nothing and the walk falls through.
