                  name:
                    type: string
                  provider:
                    enum:
                    - anthropic
                    - openai
                    - openrouter
                    - test
                    type: string
                  routingMetadata:
                    description: |-
                      RoutingMetadata refines dynamic model selection for this agent. Merged over
                      the resolved catalog entry's routing with narrowing-only semantics: an
