                      description: ResourceID is the instance ResourceType is currently
                        pinned to.
                      type: string
                    resourceType:
                      description: |-
                        ResourceType is the slot's declared resource type, and the key
                        UpsertSlotPin replaces by — a single-occupancy slot holds at most one
