apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentprimitives-extractord
  namespace: agentprimitives-system
  labels:
    app.kubernetes.io/name: agentprimitives-extractord
    app.kubernetes.io/part-of: agentprimitives
# No Role/RoleBinding for this ServiceAccount, anywhere: extractord never
# calls the Kubernetes API. That absence is deliberate, not an oversight —
# do not "fix" it by adding an RBAC binding.
#
# automountServiceAccountToken: false because an empty RBAC binding does not
# stop the kubelet from projecting a live token into the pod by default — an
# unused-but-present bearer that still authenticates as system:authenticated
# against the apiserver, sitting in the one pod on the whole attachment path
# that parses hostile, attacker-controlled file bytes. Without this, "no
# Kubernetes API access" was true of RBAC but false of the filesystem.
automountServiceAccountToken: false
