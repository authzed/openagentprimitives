      # names no repository, so the transform passes it through untouched rather
      # than encoding it. Its grant is written on `search` exactly as before.
      stateImpact: readonly
      check:
        resourceType: github_repo_url
        permission: read
        resourceIDTemplate: "search"
        resourceIDTransforms: [github_repo_url_id]
    effects:
      destructive: false
      reads:  [network]
      writes: []
