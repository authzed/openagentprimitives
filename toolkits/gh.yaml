      - {long: field,       short: F, type: string}
      - {long: raw-field,   short: f, type: string}
      - {long: header,      short: H, type: string}
      - {long: hostname,             type: string}
      - {long: jq,                   type: string}
    permission:
      # The FALLBACK is the dangerous reading, and that ordering is the design:
      # variants below name what is SAFE, so a method or endpoint nobody
      # anticipated lands here rather than slipping past an allowlist.
      stateImpact: external
      check:
        resourceType: github_repo_url
        permission: write
        resourceIDExpr: 'has(args.endpoint) && args.endpoint.startsWith("repos/") && args.endpoint.split("/").size() >= 3 ? args.endpoint.split("/")[1] + "/" + args.endpoint.split("/")[2] : ""'
        resourceIDTransforms: [github_repo_url_id]
        resourceIDHint: "for a write, call a repo-scoped endpoint (repos/OWNER/NAME/...) — an endpoint naming no repository cannot be authorized"
    permissionVariants:
      # EVERY variant below must also carry the safe-flags guard:
      #
      #   !("field" in args) && !("raw-field" in args) && !("hostname" in args)
      #
      # The endpoint and method do not describe what this call does on their
      # own. `-f`/`-F` add parameters, and gh's method defaults to POST once
      # parameters are present — so a write reads as a GET. `-F key=@path`
      # additionally reads that path off the sandbox filesystem, and
      # `--hostname` chooses where the request is sent; together they are a
      # single-call file exfiltration charged as a repository read.
      #
      # Map membership, not `has()`: `has(args.raw-field)` does not compile,
      # because CEL parses the hyphen as subtraction. A variant whose
      # expression fails to compile is dropped and the call falls back, so the
      # mistake fails closed — and silently disables the read path for
      # everyone, which is why it is called out here.
      #
      # A repo-scoped GET is a read of that repository. `gh pr view` is
      # readonly#read on the same object; routing the identical read through a
      # human just because it went via `api` was over-restriction, not security.
      - when: '(!has(args.method) || args.method == "" || args.method == "GET") && !("field" in args) && !("raw-field" in args) && !("hostname" in args) && has(args.endpoint) && args.endpoint.startsWith("repos/") && args.endpoint.split("/").size() >= 3'
        check:
          stateImpact: readonly
          check:
            resourceType: github_repo_url
            permission: read
            resourceIDExpr: 'args.endpoint.split("/")[1] + "/" + args.endpoint.split("/")[2]'
            # Same canonical id as every other repository reference here: the
            # endpoint yields OWNER/NAME, and github_repo_url_id folds and
            # encodes it exactly as `gh pr view` does, so `gh api repos/o/r/...`
            # and `gh pr view --repo o/r` are one target and one grant.
            resourceIDTransforms: [github_repo_url_id]
      # `gh api user` — the authenticated user's own profile. codebot's identity
      # flow opens with it to derive the committer, and it names no repository,
      # so it keys on the `self` sentinel: grantable and revocable on its own,
      # rather than either ungated or impossible.
      - when: '(!has(args.method) || args.method == "" || args.method == "GET") && !("field" in args) && !("raw-field" in args) && !("hostname" in args) && has(args.endpoint) && (args.endpoint == "user" || args.endpoint.startsWith("user/"))'
        check:
          stateImpact: readonly
          check:
            resourceType: github_repo_url
            permission: read
            resourceIDTemplate: "self"
            # Carried even though the id is a constant, so that EVERY check on
            # this type runs one chain and none can key it differently by
            # omission. It is a no-op here by construction: `self` names no
            # github.com repository, so the transform passes it through and the
            # grant stays written on the literal `self`, exactly as before.
            resourceIDTransforms: [github_repo_url_id]
      # Cross-repo search, same sentinel the `search` subcommands use.
      - when: '(!has(args.method) || args.method == "" || args.method == "GET") && !("field" in args) && !("raw-field" in args) && !("hostname" in args) && has(args.endpoint) && args.endpoint.startsWith("search/")'
        check:
          stateImpact: readonly
          check:
            resourceType: github_repo_url
            permission: read
            resourceIDTemplate: "search"
            resourceIDTransforms: [github_repo_url_id]
    effects:
      destructive: false
      reads:  [network]
      writes: [network]
      network: {destinations: [api.github.com, "{flag:hostname}"]}
      filesystem: {paths: []}
      creds: {required: [GITHUB_TOKEN], writes: []}
