# wait-online-timeout.conf — drop-in for systemd-networkd-wait-online.service,
# installed by build/desktop/rootfs-customize.sh at
# /etc/systemd/system/systemd-networkd-wait-online.service.d/10-ap-timeout.conf.
#
# Why: 10-ap-dhcp.network (see rootfs-customize.sh) makes
# systemd-networkd actually try to DHCP the guest NIC, which means
# systemd-networkd-wait-online.service (already enabled by the stock
# Noble cloud image, WantedBy=network-online.target) now has something to
# wait FOR. The vendored unit's ExecStart
# (/usr/lib/systemd/systemd-networkd-wait-online, no flags — confirmed by
# loop-mount inspection of the Noble cloud image) defaults to requiring
# EVERY managed interface to reach "configured" with no timeout of its
# own, i.e. an unbounded wait. A DHCP server hiccup (or, worse, no DHCP
# server at all — a stray VNET/host misconfiguration) would then hang
# network-online.target, and every unit ordered After= it (this bundle's
# apguest.service and ssh.service both are), FOREVER: boot never
# completes, which looks identical to the original "guest never comes up"
# symptom this whole change fixes, just moved one layer down.
#
# --any (succeed once ANY interface configures, not all of them) plus an
# explicit --timeout so a slow/absent DHCP lease delays boot for a
# bounded 30s and then lets it proceed (network-online.target's ordering
# is "wait then continue," not "block forever on failure" —
# wait-online.service reports failure but boot proceeds since nothing
# else Requires= it, only After/Wants=) rather than deadlocking it.
[Service]
ExecStart=
ExecStart=/usr/lib/systemd/systemd-networkd-wait-online --any --timeout=30
