# ssh-service-hostkeys.conf — systemd drop-in installed at
# /etc/systemd/system/ssh.service.d/10-ap-hostkeys.conf by `mage
# desktop:rootfs` (build/desktop/rootfs-customize.sh). Makes the vendored
# ssh.service unit explicitly wait for this bundle's ssh-hostkeys.service
# (see that unit's doc comment for why host-key generation is baked in
# directly instead of relying on Ubuntu's cloud-init-gated default) rather
# than depending solely on that unit's own Before=ssh.service ordering
# hint.
[Unit]
Wants=ssh-hostkeys.service
After=ssh-hostkeys.service
