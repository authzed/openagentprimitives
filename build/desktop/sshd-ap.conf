# sshd-ap.conf — baked into the guest at
# /etc/ssh/sshd_config.d/10-ap.conf by `mage desktop:rootfs`
# (build/desktop/rootfs-customize.sh). Ubuntu's compiled-in openssh
# defaults already happen to be PermitRootLogin=prohibit-password and
# PubkeyAuthentication=yes (both left commented-out in the stock
# sshd_config), but this bundle's whole guest<->host handoff (see
# cmd/oap/internal/desktop/vz/provider_darwin.go's package doc) depends on
# root-by-key-only login working, so it's pinned explicitly rather than
# left to upstream defaults that could change. Combined with the
# 60-cloudimg-settings.conf drop-in Ubuntu's cloud image already ships
# (PasswordAuthentication no), this makes the guest's only login path
# "root, with the private key baked into the .app's
# Contents/Resources/ap-vm-key at build time" — see
# magefiles/desktop.go's desktopGenerateSSHKeypair.
PermitRootLogin prohibit-password
PubkeyAuthentication yes
