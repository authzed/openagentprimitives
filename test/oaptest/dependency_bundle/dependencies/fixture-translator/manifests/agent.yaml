apiVersion: agentprimitives.authzed.com/v1alpha1
kind: AgentClass
metadata:
  name: fixture-translator
spec:
  description: Test-only dependency translator.
  budget:
    maxDuration: 5m
    maxTokens: 100000
    maxTurns: 50
  systemPrompt:
    inline: You are a fixture child translator. Return the requested fixture translation.
