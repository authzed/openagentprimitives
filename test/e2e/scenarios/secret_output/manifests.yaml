# secret_output scenario fixtures.
#
# A channel-attached AgentClass with NO tool bundles and NO MCP servers.
# The producer tool that emits a secretOutput is injected in-process via
# h.SetSecretOutputProducer (the InProcessRunnerFactory's ExtraTools seam),
# because the SpiceboxToolspec CRD does not yet mirror the toolspec library's
# secretOutput field — so the CRD-driven sandbox synthesis path can't carry it.
# The runner-side path the producer exercises (applySecretOutput → store →
# operator /secret-output publish → status → Content scrub) is identical to a
# real sandbox producer's.
#
# authz.toolCalls.mode=disabled keeps the dispatcher from running a Check on
# the injected tool (it also declares StateImpact=passthrough, so no Check is
# required regardless).
---
# Placeholder Anthropic API key. provider=anthropic is accepted by the
# AgentClass controller; the runtime LLM is the in-process ScriptedLLM.
apiVersion: v1
kind: Secret
metadata:
  name: llm-creds
  namespace: default
type: Opaque
stringData:
  api-key: "unused-by-the-scripted-llm"
---
# Placeholder Channel credentials. The fake kind ignores them but
# Channel.spec.credentialsRef is mandatory.
apiVersion: v1
kind: Secret
metadata:
  name: so-fake-creds
  namespace: default
type: Opaque
stringData:
  placeholder: "unused-by-the-fake-channel"
---
apiVersion: agentprimitives.authzed.com/v1alpha1
kind: AgentClass
metadata:
  name: ac-secret-output
  namespace: default
spec:
  model:
    provider: anthropic
    name: claude-opus-4-7
    apiKey:
      name: llm-creds
      key: api-key
  systemPrompt:
    inline: "you are a test agent that produces secrets"
  authz:
    toolCalls:
      mode: disabled
  budget:
    maxTurns: 50
    maxTokens: 100000
    maxDuration: "1h"
---
# Channel for the channelsd pipeline to find. kind=fake is the in-process
# transport the harness drives via SendUserMessage.
apiVersion: agentprimitives.authzed.com/v1alpha1
kind: Channel
metadata:
  name: ac-secret-output-fake
  namespace: default
spec:
  kind: fake
  role: both
  agentClass: ac-secret-output
  credentialsRef:
    secretName: so-fake-creds
  fake:
    echo: false
