# Scenario: dual-credential resolution (credentials_test.go).
#
# A single session exercises BOTH credential paths through the token broker:
#   1. CLI path: sandbox git bundle. The ToolCall controller resolves the
#      git-token credential via inproc.Broker and stamps GIT_TOKEN on the
#      exec.Request.Env. The test asserts GIT_TOKEN equals the Secret value.
#   2. MCP path: MCPServer with auth.credential set. The InProcessRunnerFactory
#      resolves the mcp-bearer credential via inproc.Broker and passes the
#      Authorization header to each MCP call. The test asserts the stub saw
#      the expected "Bearer <token>" value.
#
# Notes:
#   - authz.toolCalls.mode=disabled bypasses SpiceDB authz so no SpiceDB schema,
#     bootstrap, or permission-check plumbing is needed.
#   - The MCP tool's permission block uses stateImpact: stateless which the
#     AgentClass validator accepts without requiring a check block.
#   - e2e harness does not run the SpiceboxToolspec controller — the test
#     stamps ts-git Valid=True after Apply.
#   - e2e harness does not run a real Pod scheduler — the test stamps bundle
#     SpiceboxSessions Ready=True + PodName + ResolvedClass once they appear.
#
# Token values are non-trivial hex strings chosen to avoid any chance of
# false-positive matches with other env vars or test credentials.
---
apiVersion: v1
kind: Secret
metadata:
  name: dual-cred-llm-creds
  namespace: default
type: Opaque
stringData:
  api-key: "unused-by-the-scripted-llm"
---
# Channel placeholder: fake kind ignores credentials but
# Channel.spec.credentialsRef.secretName is mandatory in the CRD schema.
apiVersion: v1
kind: Secret
metadata:
  name: dual-cred-fake-creds
  namespace: default
type: Opaque
stringData:
  placeholder: "unused-by-the-fake-channel"
---
# Git credential injected as GIT_TOKEN into the sandbox exec.
# The broker reads the "token" key and stamps GIT_TOKEN.
apiVersion: v1
kind: Secret
metadata:
  name: dual-git-token
  namespace: default
type: Opaque
stringData:
  token: "ghp-e2e-git-credential-a1b2c3d4"
---
# MCP bearer token. The broker reads the "access_token" key and produces
# Authorization: Bearer <value> on every MCP call.
apiVersion: v1
kind: Secret
metadata:
  name: dual-mcp-bearer
  namespace: default
type: Opaque
stringData:
  access_token: "mcp-e2e-bearer-x7y8z9w0"
---
# SpiceboxToolspec for the git bundle's status subcommand.
# The e2e harness does not run the SpiceboxToolspec controller, so the test
# stamps ts-dual-git Valid=True after Apply.
apiVersion: agentprimitives.authzed.com/v1alpha1
kind: SpiceboxToolspec
metadata:
  name: ts-dual-git
spec:
  name: ts-dual-git
  version: "1"
  toolkit:
    name: git
    revision: "2026-04-24"
  allowSubcommands:
    - status
---
# SpiceboxClass for the git bundle.
# spec.tools[].name MUST equal the toolkit name ("git") so the synthesizer
# matches. The resulting LLM-facing name is "<bundle.name>_<class-tool.name>"
# = "git_git" (bundle name is "git" in the AgentClass below).
apiVersion: agentprimitives.authzed.com/v1alpha1
kind: SpiceboxClass
metadata:
  name: cls-dual-git
spec:
  image: registry.example.com/git-toolbelt:latest
  resources:
    cpu: "100m"
    memory: "64Mi"
    ephemeralStorage: "16Mi"
  tools:
    - name: git
      command: ["/usr/bin/git"]
  toolspecs:
    - name: ts-dual-git
---
# MCPServer for the credential test. Declares a single stateless tool
# (no SpiceDB check needed) and references the mcp-bearer credential.
# The permission is required by the AgentClass validator regardless of
# authz.toolCalls.mode — stateImpact: stateless is the minimal valid declaration.
# spec.server.url is rewritten to {{MCP_URL}} by the e2e harness.
apiVersion: agentprimitives.authzed.com/v1alpha1
kind: MCPServer
metadata:
  name: dual-cred-mcp
  namespace: default
spec:
  name: dual-cred-mcp
  version: v1
  intent: "Credential-resolution e2e fixture: one stateless tool to verify MCP auth."
  server:
    url: "{{MCP_URL}}"
    transport: http
  auth:
    credential: mcp-bearer
  tools:
    - name: ping
      intent: "Echo the caller's message back."
      args:
        allowedFields: [message]
      permission:
        stateImpact: stateless
      effects:
        readOnly: true
        idempotent: true
---
# AgentIdentity with both credentials.
# git-token → resolves GIT_TOKEN in the sandbox exec.
# mcp-bearer → resolves Authorization header for dual-cred-mcp.
apiVersion: agentprimitives.authzed.com/v1alpha1
kind: AgentIdentity
metadata:
  name: dual-cred-identity
  namespace: default
spec:
  description: "Dual-credential e2e fixture: one CLI cred (git-token) and one MCP bearer (mcp-bearer)."
  credentials:
    - name: git-token
      type: static
      static:
        secretRef:
          name: dual-git-token
          key: token
    - name: mcp-bearer
      type: static
      static:
        secretRef:
          name: dual-mcp-bearer
          key: access_token
---
# AgentClass combining the git sandbox bundle and the MCP server.
# authz.toolCalls.mode=disabled bypasses SpiceDB authz checks entirely so no
# schema, bootstrap, or guardian wiring is required.
apiVersion: agentprimitives.authzed.com/v1alpha1
kind: AgentClass
metadata:
  name: ac-dual-cred
  namespace: default
spec:
  model:
    provider: test
    name: scripted
    apiKey:
      name: dual-cred-llm-creds
      key: api-key
  systemPrompt:
    inline: "you are a dual-credential test agent"
  authz:
    toolCalls:
      mode: disabled
  budget:
    maxTurns: 50
    maxTokens: 100000
    maxDuration: "1h"
  agentIdentity: dual-cred-identity
  toolBundles:
    - name: "git"
      class: "cls-dual-git"
      toolspecs: ["ts-dual-git"]
  mcpServers:
    - name: dcmcp
      ref: dual-cred-mcp
---
# Channel for the harness to drive messages through.
apiVersion: agentprimitives.authzed.com/v1alpha1
kind: Channel
metadata:
  name: ac-dual-cred-fake
  namespace: default
spec:
  kind: fake
  role: both
  agentClass: ac-dual-cred
  credentialsRef:
    secretName: dual-cred-fake-creds
  fake:
    echo: false
