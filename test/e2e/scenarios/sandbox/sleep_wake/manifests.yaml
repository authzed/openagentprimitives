# Scenario (sleep_wake) fixtures.
#
# A channel-attached AgentClass with two bundles and a tiny
# spec.channels.sleepAfter: once the session goes Idle, the operator's
# reconcileSleep reaps ALL its pods (both bundle SpiceboxSessions + the
# runner) while keeping the AgentSession CR itself Idle and wakeable. The
# next inbound message on the same channel/thread re-provisions everything
# before the runner is allowed to start.
#
# Notes:
#   - The e2e harness does not wire the SpiceboxToolspec controller, so the
#     test stamps each toolspec's Valid=True status after Apply.
#   - The e2e harness does not run a real Pod scheduler, so the test also
#     stamps the bundle SpiceboxSessions Ready=True once they appear — both
#     on first boot AND after the wake re-provisions them.
#
# Placeholder Anthropic API key. provider=anthropic accepted by the
# AgentClass controller; the actual LLM provider used at runtime is the
# in-process ScriptedLLM (the runner factory ignores model.provider).
---
apiVersion: v1
kind: Secret
metadata:
  name: sw-llm-creds
  namespace: default
type: Opaque
stringData:
  api-key: "unused-by-the-scripted-llm"
---
# Placeholder Channel credentials. The fake kind ignores them but
# Channel.spec.credentialsRef is mandatory.
apiVersion: v1
kind: Secret
metadata:
  name: sw-fake-creds
  namespace: default
type: Opaque
stringData:
  placeholder: "unused-by-the-fake-channel"
---
# Toolspec wrapping git's read-only `status` subcommand.
apiVersion: agentprimitives.authzed.com/v1alpha1
kind: SpiceboxToolspec
metadata:
  name: sw-ts-git
spec:
  name: sw-ts-git
  version: "1"
  toolkit:
    name: git
    revision: "2026-04-24"
  allowSubcommands:
    - status
---
# Toolspec wrapping cat. The cat toolkit's single subcommand is the empty
# path (path: []) so the joined subcommand-string is "".
apiVersion: agentprimitives.authzed.com/v1alpha1
kind: SpiceboxToolspec
metadata:
  name: sw-ts-codey
spec:
  name: sw-ts-codey
  version: "1"
  toolkit:
    name: cat
    revision: "2026-04-25"
  allowSubcommands:
    - ""
---
# SpiceboxClass for the git bundle. spec.tools[].name must equal the
# Toolspec's toolkit.name so the AgentClass binding-coverage check
# (validateBundles) accepts the binding.
apiVersion: agentprimitives.authzed.com/v1alpha1
kind: SpiceboxClass
metadata:
  name: sw-cls-git
spec:
  image: registry.example.com/git-toolbelt:latest
  resources:
    cpu: "100m"
    memory: "64Mi"
    ephemeralStorage: "16Mi"
  tools:
    - name: git
      command: ["/usr/bin/git"]
  toolspecs:
    - name: sw-ts-git
---
apiVersion: agentprimitives.authzed.com/v1alpha1
kind: SpiceboxClass
metadata:
  name: sw-cls-codey
spec:
  image: registry.example.com/codey-toolbelt:latest
  resources:
    cpu: "100m"
    memory: "64Mi"
    ephemeralStorage: "16Mi"
  tools:
    - name: cat
      command: ["/bin/cat"]
  toolspecs:
    - name: sw-ts-codey
---
# AgentIdentity with a credential named git-token covering the git bundle's
# toolspec. validateBundles checks that each sensitive toolkit env var
# (GIT_TOKEN → git-token) is backed by a named credential. The cat toolkit
# declares no sensitive env vars, so no credential is required for that bundle.
# Static credentials keep the refresh-controller and OAuth bits out of scope.
apiVersion: v1
kind: Secret
metadata:
  name: sw-ai-test-creds
  namespace: default
type: Opaque
stringData:
  token: "unused-by-the-test-scenarios"
---
apiVersion: agentprimitives.authzed.com/v1alpha1
kind: AgentIdentity
metadata:
  name: sw-ai-test
  namespace: default
spec:
  description: "Identity for the sleep_wake scenario."
  credentials:
    - name: git-token
      type: static
      static:
        secretRef:
          name: sw-ai-test-creds
          key: token
---
apiVersion: agentprimitives.authzed.com/v1alpha1
kind: AgentClass
metadata:
  name: ac-sleep-wake
  namespace: default
spec:
  model:
    provider: anthropic
    name: claude-opus-4-7
    apiKey:
      name: sw-llm-creds
      key: api-key
  systemPrompt:
    inline: "you are a test agent"
  budget:
    maxTurns: 50
    maxTokens: 100000
    maxDuration: "1h"
  agentIdentity: sw-ai-test
  toolBundles:
    - name: "git"
      class: "sw-cls-git"
      toolspecs: ["sw-ts-git"]
    - name: "codey"
      class: "sw-cls-codey"
      toolspecs: ["sw-ts-codey"]
  channels:
    sleepAfter: "3s"
---
# Channel for the channelsd pipeline to find. kind=fake is the in-process
# Plan-1 transport the harness drives via SendUserMessage.
apiVersion: agentprimitives.authzed.com/v1alpha1
kind: Channel
metadata:
  name: ac-sleep-wake-fake
  namespace: default
spec:
  kind: fake
  role: both
  agentClass: ac-sleep-wake
  credentialsRef:
    secretName: sw-fake-creds
  fake:
    echo: false
