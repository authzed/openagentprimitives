# Scenario 2 (p1_defaultenv_reaches_toolcall) fixtures.
#
# A single git bundle. The AgentSession reconciler stamps DefaultEnv on
# the bundle's SpiceboxSession via bundleDefaultEnv("git") which emits:
#   GIT_CONFIG_GLOBAL=/dev/null
#   GIT_CONFIG_NOSYSTEM=1
#   GIT_TERMINAL_PROMPT=0
# The test asserts these reach the ToolCall controller's exec.Request.Env
# without the LLM passing them on the tool_use args.
#
# Notes:
#   - The e2e harness does not wire the SpiceboxToolspec controller, so the
#     test stamps ts-git's Valid=True after Apply.
#   - The e2e harness does not run a real Pod scheduler, so the test also
#     stamps the bundle SpiceboxSession Ready=True + PodName + ResolvedClass
#     once it appears, unblocking BundlesReady AND giving the ToolCall
#     controller the fields it needs.
#
# Placeholder Anthropic API key. provider=anthropic is accepted by the
# AgentClass controller; the actual LLM provider at runtime is the
# in-process ScriptedLLM (the runner factory ignores model.provider).
---
apiVersion: v1
kind: Secret
metadata:
  name: llm-creds
  namespace: default
type: Opaque
stringData:
  api-key: "unused-by-the-scripted-llm"
---
# Placeholder Channel credentials. The fake kind ignores them but
# Channel.spec.credentialsRef is mandatory.
apiVersion: v1
kind: Secret
metadata:
  name: git-fake-creds
  namespace: default
type: Opaque
stringData:
  placeholder: "unused-by-the-fake-channel"
---
# Toolspec wrapping git's read-only `status` subcommand.
apiVersion: agentprimitives.authzed.com/v1alpha1
kind: SpiceboxToolspec
metadata:
  name: ts-git
spec:
  name: ts-git
  version: "1"
  toolkit:
    name: git
    revision: "2026-04-24"
  allowSubcommands:
    - status
---
# SpiceboxClass for the git bundle. spec.tools[].name MUST equal the
# Toolspec's toolkit.name ("git") so the synthesizer matches; the
# resulting LLM-facing tool name is "<bundle.name>_<class-tool.name>" =
# "git_git".
apiVersion: agentprimitives.authzed.com/v1alpha1
kind: SpiceboxClass
metadata:
  name: cls-git
spec:
  image: registry.example.com/git-toolbelt:latest
  resources:
    cpu: "100m"
    memory: "64Mi"
    ephemeralStorage: "16Mi"
  tools:
    - name: git
      command: ["/usr/bin/git"]
  toolspecs:
    - name: ts-git
---
# AgentIdentity with a credential named git-token covering the git bundle's
# toolspec. validateBundles checks that each sensitive toolkit env var
# (GIT_TOKEN → git-token) is backed by a named credential. Static credentials
# keep the refresh-controller and OAuth bits out of scope.
apiVersion: v1
kind: Secret
metadata:
  name: ai-test-creds
  namespace: default
type: Opaque
stringData:
  token: "unused-by-the-test-scenarios"
---
apiVersion: agentprimitives.authzed.com/v1alpha1
kind: AgentIdentity
metadata:
  name: ai-test
  namespace: default
spec:
  description: "Identity for the p1_defaultenv_reaches_toolcall scenario."
  credentials:
    - name: git-token
      type: static
      static:
        secretRef:
          name: ai-test-creds
          key: token
---
apiVersion: agentprimitives.authzed.com/v1alpha1
kind: AgentClass
metadata:
  name: ac-git
  namespace: default
spec:
  model:
    provider: anthropic
    name: claude-opus-4-7
    apiKey:
      name: llm-creds
      key: api-key
  systemPrompt:
    inline: "you are a test agent"
  # authz.toolCalls.mode=disabled bypasses authz.Check on every tool dispatch.
  # The scenario asserts mergeEnv flow only; the synthesized sandbox
  # tool has no Permission (no built-in "status" toolkit), and the
  # default enforcing mode would deny on "unknown stateImpact".
  authz:
    toolCalls:
      mode: disabled
  budget:
    maxTurns: 50
    maxTokens: 100000
    maxDuration: "1h"
  agentIdentity: ai-test
  toolBundles:
    - name: "git"
      class: "cls-git"
      toolspecs: ["ts-git"]
---
# Channel for the channelsd pipeline to find. kind=fake is the in-process
# Plan-1 transport the harness drives via SendUserMessage.
apiVersion: agentprimitives.authzed.com/v1alpha1
kind: Channel
metadata:
  name: ac-git-fake
  namespace: default
spec:
  kind: fake
  role: both
  agentClass: ac-git
  credentialsRef:
    secretName: git-fake-creds
  fake:
    echo: false
