# Scenario: passthrough_sandbox — a userPassthrough session dispatches a
# sandbox CLI ToolCall whose credential resolves from the per-session
# materialized Secret in the SESSION namespace (NOT the identities namespace).
#
# This is the e2e analog of p1_defaultenv_reaches_toolcall, but in
# identityMode: userPassthrough. It exists to close the harness↔production
# fidelity gap that let the cross-namespace passthrough-credential bug ship:
# the harness buildSandboxTools used to hardcode the agent-identity path, so a
# sandbox ToolCall's credential source was never driven through the
# userPassthrough branch. With buildSandboxTools now branching on identityMode
# (like internal/cmd/runner/main.go), the synthesized git tool's credential descriptor
# points at <session>-passthrough-creds in the session namespace, so the
# ToolCall passes ValidateCredentialSourceNamespaces and dispatches.
#
# Unlike p1_defaultenv (agent mode, static AgentIdentity in manifests), the
# user's credential here is pre-linked at runtime via useridentity.PutToken
# (type:static). The operator's passthrough gate then creates the
# SessionUserIdentity and materializes <session>-passthrough-creds; nothing in
# this file declares those — they are operator-created.
#
# Harness invariants mirrored from p1_defaultenv:
#   - The e2e harness does not run the SpiceboxToolspec controller → the test
#     stamps ts-git Valid=True after Apply.
#   - The e2e harness does not run a real Pod scheduler → the test stamps the
#     bundle SpiceboxSession Ready=True + PodName + ResolvedClass once it
#     appears, and programs the fake exec for the git pod's sandbox container.
#
# No real names: alice / example.com are fictional per CLAUDE.md.
---
apiVersion: v1
kind: Secret
metadata:
  name: pt-sandbox-llm-creds
  namespace: default
type: Opaque
stringData:
  api-key: "unused-by-the-scripted-llm"
---
# Placeholder Channel credentials. The fake kind ignores them but
# Channel.spec.credentialsRef is mandatory.
apiVersion: v1
kind: Secret
metadata:
  name: pt-sandbox-fake-creds
  namespace: default
type: Opaque
stringData:
  placeholder: "unused-by-the-fake-channel"
---
# Toolspec wrapping git's read-only `status` subcommand. The git toolkit
# declares GIT_TOKEN as a sensitive env mapped to credential "git-token", so a
# userPassthrough session with this bundle REQUIRES the "git-token" credential
# — which the test pre-links via PutToken so the session unparks.
apiVersion: agentprimitives.authzed.com/v1alpha1
kind: SpiceboxToolspec
metadata:
  name: ts-git
spec:
  name: ts-git
  version: "1"
  toolkit:
    name: git
    revision: "2026-04-24"
  allowSubcommands:
    - status
---
# SpiceboxClass for the git bundle. spec.tools[].name MUST equal the Toolspec's
# toolkit.name ("git") so the synthesizer matches; the resulting LLM-facing
# tool name is "<bundle.name>_<class-tool.name>" = "git_git".
apiVersion: agentprimitives.authzed.com/v1alpha1
kind: SpiceboxClass
metadata:
  name: cls-git
spec:
  image: registry.example.com/git-toolbelt:latest
  resources:
    cpu: "100m"
    memory: "64Mi"
    ephemeralStorage: "16Mi"
  tools:
    - name: git
      command: ["/usr/bin/git"]
  toolspecs:
    - name: ts-git
---
# AgentClass in identityMode: userPassthrough. No agentIdentity: passthrough
# classes source credentials per-session from the invoking user's
# UserIdentity, so the AgentClass bundle/credential-coverage validation is
# skipped and the class goes Valid without a shared AgentIdentity.
apiVersion: agentprimitives.authzed.com/v1alpha1
kind: AgentClass
metadata:
  name: ac-pt-git
  namespace: default
spec:
  identityMode: userPassthrough
  model:
    provider: anthropic
    name: claude-opus-4-7
    apiKey:
      name: pt-sandbox-llm-creds
      key: api-key
  systemPrompt:
    inline: "you are a passthrough git agent for the sandbox-credential e2e"
  # authz.toolCalls.mode=disabled bypasses authz.Check on every tool dispatch.
  # The scenario asserts the credential-source path only; the synthesized
  # sandbox tool has no Permission and the default enforcing mode would deny
  # on "unknown stateImpact" (mirrors p1_defaultenv).
  authz:
    toolCalls:
      mode: disabled
  budget:
    maxTurns: 50
    maxTokens: 100000
    maxDuration: "1h"
  toolBundles:
    - name: "git"
      class: "cls-git"
      toolspecs: ["ts-git"]
---
# Channel for the channelsd pipeline to find. kind=fake is the in-process
# transport the harness drives via SendUserMessage.
apiVersion: agentprimitives.authzed.com/v1alpha1
kind: Channel
metadata:
  name: ac-pt-git-fake
  namespace: default
spec:
  kind: fake
  role: both
  agentClass: ac-pt-git
  credentialsRef:
    secretName: pt-sandbox-fake-creds
  fake:
    echo: false
