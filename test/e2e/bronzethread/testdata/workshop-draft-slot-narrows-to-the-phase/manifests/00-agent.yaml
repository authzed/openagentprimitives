# Fixture agent for the workshop-draft-slot-narrows-to-the-phase bronze bundle.
#
# This is the ONE workshop fixture whose class leaves tool-call authorization
# ENFORCING. The other four (workshop-inventory-is-real,
# workshop-apply-earns-a-real-verdict, workshop-recommend-capability-is-real,
# workshop-try-it-link-and-watch) each set `authz.toolCalls: {mode: disabled}`
# so their scenario isolates the real workshop server from the approval round
# trip — which means none of them reaches the runner's gate at all, and none of
# them can say anything about who was asked for what. Everything this bundle
# claims lives on the other side of that gate, so `enforcing` is spelled out
# below rather than left to the CRD default: a fixture that merely inherited it
# would go quiet the day the default moved.
#
# The class also declares the `workshop_draft` slot EXACTLY as the shipped
# builder class does (pkg/platform/builderbundle/src/manifests/agentclass.yaml):
# same resourceType, same primary permission, same four-permission ceiling. The
# slot is what makes the grant writable at all — checkExternalSlotGrant refuses
# before it ever queries SpiceDB for a type the class never declared — so a
# fixture that declared a wider or narrower one would be testing a class nobody
# ships.
#
# WHAT THIS PROVES: a plan phase naming `perm:change:workshop_draft` binds the
# constant instance `workshop_draft:draft` for the session, every
# `workshop_apply` in that phase then runs with no further card, and
# `workshop_delete` — `remove`, which the phase never named — still costs one.
#
# HOW THE PHASE IS WRITTEN, and it is not optional: it names the slot TYPE in
# its `slots` with NO id. Under an enforcing gate,
# plangate.MissingSlotDeclarations refuses SILENCE about a declared slot type
# -- update_plan itself fails and no plan is frozen at all -- while
# deliberately permitting DEFERRAL. `draft` is fixed by the toolbox and an
# agent has no way to learn it, so the id-less declaration is the only honest
# form, and planGateBindings supplies the instance from the permission
# surface's own ConstantResourceID.
#
# WHAT IT DOES NOT PROVE: the same things workshop-apply-earns-a-real-verdict's
# own header disclaims — there is no validating admission webhook in this
# harness, and no production Workshop-Ready -> sidecar-identity path. The real
# workshop server is mounted directly by test/e2e/workshop_mcp.go; a green run
# here is evidence about the GATE in front of its tools, not about how a live
# sidecar would come by its identity.
apiVersion: v1
kind: Secret
metadata: {name: demo-workshop-draft-placeholder, namespace: default}
type: Opaque
stringData: {api-key: "unused-by-the-test-provider"}
---
apiVersion: v1
kind: Secret
metadata: {name: demo-workshop-draft-fake-creds, namespace: default}
type: Opaque
stringData: {placeholder: "unused-by-the-fake-channel"}
---
apiVersion: agentprimitives.authzed.com/v1alpha1
kind: AgentIdentity
metadata: {name: demo-workshop-draft-identity, namespace: default}
spec:
  description: "Fixture identity for the workshop-draft-slot-narrows-to-the-phase bundle; the toolbox needs no upstream credential (upstreamAuth.provider: none)."
  credentials: []
---
# SpiceboxClass named to match the workshop toolbox's own sandbox.class
# (pkg/tools/workshopmcp/deploy/sidecartoolbox.yaml). Required for the
# SidecarToolbox/workshop below to reach Valid=True at all — the real
# sidecartoolbox.Reconciler Gets this class and requires ITS Valid condition
# True before continuing (see Harness.StampSpiceboxClassesValid's doc).
apiVersion: agentprimitives.authzed.com/v1alpha1
kind: SpiceboxClass
metadata: {name: workshop-sandbox}
spec:
  image: ""
  resources: {cpu: "100m", memory: "64Mi", ephemeralStorage: "16Mi"}
  network: {mode: allowlist, allowedHosts: []}
---
# Copy of pkg/tools/workshopmcp/deploy/sidecartoolbox.yaml's spec, wrapped in
# CR metadata — verbatim, exactly as the other four workshop fixtures carry it,
# and held to that by TestWorkshopFixtures_MatchDeployToolSet (which compares
# spec.tools AND spec.spicedbSchema, this fixture's path included in its table).
#
# Both halves are load-bearing HERE in a way they are not in a bundle that runs
# with the gate disabled. The four `permission.check` blocks below —
# apply/change, delete/remove, watch_test/test, project_agent/project, each on
# the CONSTANT id "draft" — are what the phase approval binds and what the
# delete is refused against. spec.spicedbSchema is what DECLARES that resource:
# without the fragment, composition finds no such definition, every slot is
# skipped, no slot_grant_<permission> relation exists to write, and the builder
# silently goes back to a card per apply.
apiVersion: agentprimitives.authzed.com/v1alpha1
kind: SidecarToolbox
metadata: {name: workshop, namespace: default}
spec:
  name: workshop
  version: "1"
  intent: >-
    The agent-builder's own MCP toolset: inventories the cluster's real
    capabilities, probes candidate images/MCP servers, applies and inspects
    draft agent-primitive CRs inside the caller's workshop namespace, renders
    plain-language summaries for approval cards, and exports/loads a portable
    .oap draft. Runs only inside a Ready, session-owned Workshop's provisioned
    namespace — never a standing deployment.

  source:
    image: ap-workshop:dev

  sandbox:
    class: workshop-sandbox

  transport:
    port: 8080
    path: /mcp
    healthcheck:
      path: /healthz
      timeoutSeconds: 30

  upstreamAuth:
    provider: none

  tools:
    - name: inventory
      intent: "Snapshot of this cluster's real capabilities, channel kinds, renderers, sandbox classes, MCP catalog, and the caller's effective settings ceilings, and the first-party sidecar images this cluster admits (with the reference to use), and the sign-in flows (providers) an account can be connected with."
      effects:
        readOnly: true
      permission:
        stateImpact: passthrough

    - name: probe_mcp
      intent: "List the tools a candidate MCP server exposes (tools/list), through the SSRF-guarded client."
      args:
        allowedFields: ["url"]
      effects:
        readOnly: true
      permission:
        stateImpact: passthrough

    - name: probe_image
      intent: "Run a candidate container image and discover the MCP tool surface it declares."
      args:
        allowedFields: ["image", "timeout_seconds"]
      effects:
        readOnly: true
      permission:
        stateImpact: passthrough

    - name: cli_help
      intent: "Run a candidate container image's CLI binary with --help to discover its interface."
      args:
        allowedFields: ["image", "binary", "args", "timeout_seconds"]
      effects:
        readOnly: true
      permission:
        stateImpact: passthrough

    - name: validate_spec
      intent: "Round-trip a candidate resource's spec content through the real toolspec/MCP/sidecar validators and CEL compile."
      args:
        allowedFields: ["kind", "manifest"]
      effects:
        readOnly: true
      permission:
        stateImpact: passthrough

    - name: apply
      intent: "Server-side-apply a candidate custom resource into the workshop, under this sidecar's field manager."
      args:
        allowedFields: ["manifest"]
      permission:
        stateImpact: external
        check:
          resourceType: workshop_draft
          resourceIDTemplate: "draft"
          permission: change

    - name: get
      intent: "Read one custom resource, by kind and name, from the workshop."
      args:
        allowedFields: ["kind", "name"]
      effects:
        readOnly: true
      permission:
        stateImpact: passthrough

    - name: list
      intent: "List every custom resource of one kind in the workshop."
      args:
        allowedFields: ["kind"]
      effects:
        readOnly: true
      permission:
        stateImpact: passthrough

    - name: delete
      intent: "Delete one custom resource, by kind and name, from the workshop."
      args:
        allowedFields: ["kind", "name"]
      permission:
        stateImpact: external
        check:
          resourceType: workshop_draft
          resourceIDTemplate: "draft"
          permission: remove

    - name: render_summary
      intent: "Plain-language rendering of a custom resource, for approval cards and the running build summary."
      args:
        allowedFields: ["manifest", "kind", "name"]
      effects:
        readOnly: true
      permission:
        stateImpact: passthrough

    - name: export_draft
      intent: "Bundle the agent this workshop's builder has authored into a portable .oap draft, stored as a builder-session artifact."
      permission:
        stateImpact: stateless

    - name: load_draft
      intent: "Re-apply a previously exported draft's bundle into this workshop, one apply per object, resuming a build."
      args:
        allowedFields: ["oap"]
      permission:
        stateImpact: passthrough

    - name: test_tool
      intent: "Run the agent under construction as a one-shot tester against a representative request and return its tool-results (never its prose). Read-only: use it automatically for read-only tools; get the person's OK before testing a side-effecting one."
      args:
        allowedFields: ["class", "request"]
      effects:
        readOnly: true
      permission:
        stateImpact: passthrough

    - name: test_link
      intent: "The ap:agentlink props that send the person to try the agent under construction themselves, in the browser chat."
      args:
        allowedFields: ["class", "prompt"]
      effects:
        readOnly: true
      permission:
        stateImpact: passthrough

    - name: watch_test
      intent: "Ask to be told when the person's own test of the agent starts, pauses, ends, or times out."
      args:
        allowedFields: ["class", "timeoutMinutes"]
      permission:
        stateImpact: external
        check:
          resourceType: workshop_draft
          resourceIDTemplate: "draft"
          permission: test

    - name: test_sessions
      intent: "The person's own test sessions of an agent in this workshop, by name and phase."
      args:
        allowedFields: ["class"]
      effects:
        readOnly: true
      permission:
        stateImpact: passthrough

    - name: read_test_log
      intent: "Read the current test session's tool-results and tool-errors."
      args:
        allowedFields: ["session"]
      effects:
        readOnly: true
      permission:
        stateImpact: passthrough

    - name: stop_test
      intent: "Stop the person's test session; the conversation returns to the builder. Stopping deletes the test conversation and its log, so read the log first."
      args:
        allowedFields: ["session"]
      permission:
        stateImpact: passthrough

    - name: request_credential
      intent: "Ask the person to connect a bot/shared credential (an API key, PAT, or static secret to paste, or a shared OAuth-MCP account to authorize) for an AgentIdentity you authored in this workshop. A card with a secure link goes to the person; they enter or authorize it and it lands in the workshop."
      args:
        allowedFields: ["identity", "credential", "authKind"]
      permission:
        stateImpact: external

    - name: request_install
      intent: "Ask a platform admin to install the agent this workshop has built. Records the request on the workshop; an admin card (delivered by a later plan) is what the person sees. Once-only: a second call after an install has already been requested is refused, not overwritten."
      args:
        allowedFields: ["suggestedName", "bundleDigest"]
      permission:
        stateImpact: external

    - name: recommend_capability
      intent: "Recommend a platform capability this build surfaced a need for — something no existing tool or toolbox covers. Records the recommendation on the workshop for a platform admin to review. Once-only: a second call after one has already been recorded is refused, not overwritten. This tool does not end the session by itself — call agent_work_complete afterward to do that."
      args:
        allowedFields: ["summary", "artifactRef", "draftRef"]
      permission:
        stateImpact: external

    - name: close_others
      intent: "Close the person's other open builder workshops (all, or the ones named, by the name shown on the page or the workshop name). A platform admin may name anyone's. Never closes this one. Answers with what was closed, what was refused and why, and anything still being decided."
      args:
        allowedFields: ["workshops"]
      permission:
        stateImpact: external

    - name: agents_in_thread
      intent: "List the other agents that have already worked this conversation thread — participants and their own delegated subagents — so a builder picking up mid-thread knows who was here already."
      effects:
        readOnly: true
      permission:
        stateImpact: passthrough

    - name: project_agent
      intent: "Project a credential-free practice double of another agent's class — one reachable from this conversation thread — into the workshop, so a hand-off to it can be rehearsed without ever running the real agent."
      args:
        allowedFields: ["namespace", "name"]
      permission:
        stateImpact: external
        check:
          resourceType: workshop_draft
          resourceIDTemplate: "draft"
          permission: project

  spicedbSchema:
    resources:
      - name: workshop_draft
        standing: session-only
        display: {name: "the draft in this workshop"}
        relations:
          - {name: session, subjectType: agentsession}
        permissions:
          - name: change
            expr: session
            title: "Change this workshop's draft (any of its definitions)"
            planningNote: >-
              A phase that changes the draft lists this handle AND declares the
              workshop_draft slot on the phase (no id needed); the handle alone is
              refused, and the slot alone would quietly bind change.
          - name: remove
            expr: session
            title: "Remove a definition from this workshop's draft"
            planningNote: >-
              List it beside change when a definition will be replaced; a remove
              without it raises a card.
          - name: test
            expr: session
            title: "Watch a test of this workshop's draft"
            planningNote: >-
              The test phase lists it with the slot declared; re-arming the watch
              then needs no card.
          - name: project
            expr: session
            title: "Project a practice double of another agent into this workshop"
            planningNote: >-
              One approval covers every projection in the phase; the platform
              refuses any agent not already part of this conversation.
---
apiVersion: agentprimitives.authzed.com/v1alpha1
kind: AgentClass
metadata: {name: demo-workshop-draft, namespace: default}
spec:
  displayName: WorkshopDraftSlotDemoBot
  description: "E2E fixture agent proving one phase approval covers every apply of the workshop draft. Do not deploy to a real cluster."
  model:
    provider: test                 # production operator REFUSES this
    name: scripted                 # cosmetic; ignored at runtime
    apiKey: {name: demo-workshop-draft-placeholder, key: api-key}
  systemPrompt:
    inline: |
      You are a fixture agent for the agentprimitives e2e harness.
      DO NOT deploy to a real cluster — your model provider is `test`.

      You build an agent draft in a workshop. Available tools:
        - workshop_apply(manifest): apply a draft resource into the workshop
        - workshop_delete(kind, name): remove one from the workshop

      Declare your build stage with update_plan first, listing
      `perm:change:workshop_draft` on its permissions, then apply.
  agentIdentity: demo-workshop-draft-identity
  sidecarToolboxes:
    - {name: workshop, ref: workshop}
  authz:
    # ENFORCING, stated rather than inherited. This is the only workshop
    # fixture that reaches the runner's tool-call gate; the sibling four set
    # `disabled`, which is why none of them can say whether an approval was
    # asked for, bound anything, or was needed twice.
    toolCalls: {mode: enforcing}
    planGate:
      mode: enforcing
      requirePlan: true            # as the shipped builder class declares it
    # Copied from pkg/platform/builderbundle/src/manifests/agentclass.yaml. The
    # workshop sidecar's apply/delete/watch_test/project_agent are `external`
    # — "an approval naming the instance" — and each keys the CONSTANT id
    # `draft`. Without a slot for that type the runner's SlotResourceTypes
    # guard denies every one of those calls to a card, and a card's grant is
    # one-shot: a card per apply.
    #
    # permissions[] is the CEILING an approval may bind within, not a grant:
    # each one gets a slot_grant_<permission> relation in the composed schema.
    # `change` alone would leave this bundle's fourth turn with nowhere to bind
    # `remove` — and the point of that turn is that a `change` grant does not
    # satisfy `remove`, not that `remove` is unwritable.
    slots:
      - resourceType: workshop_draft
        description: "The agent draft this workshop is building."
        permission: change
        permissions: [change, remove, test, project]
  budget: {maxTurns: 30, maxTokens: 50000, maxDuration: 5m}
---
apiVersion: agentprimitives.authzed.com/v1alpha1
kind: Channel
metadata: {name: demo-workshop-draft-fake, namespace: default}
spec:
  kind: fake
  role: both
  agentClass: demo-workshop-draft
  credentialsRef: {secretName: demo-workshop-draft-fake-creds}
  fake: {echo: false}
