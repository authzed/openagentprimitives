# Fixture agent for the workshop-apply-earns-a-real-verdict bronze bundle.
#
# The session's own class ("workshop-demo") mounts the REAL
# pkg/tools/workshopmcp.Server via the "workshop" SidecarToolbox, exactly
# like workshop-inventory-is-real's fixture (see that bundle's 00-agent.yaml
# for the routing explanation: driver.go's sidecar-probe routing closure
# matches on the CR name "workshop" — the workshopSidecarToolboxRef constant
# — and sends its calls to the real server instead of the canned MCPStub).
#
# This bundle exercises `workshop_apply` instead of `workshop_inventory`: the
# scripted model asks the real server to server-side-apply two CANDIDATE
# AgentClass manifests into the workshop's own namespace ("default" — see
# mountWorkshopMCP's WorkshopIdentity), then reads back the REAL
# pkg/controllers/agentclass reconciler's own Valid condition from the tool
# result. Two extra fixtures below (cls-candidate, ts-foreign-workshop) exist
# only to give the FIRST candidate a toolBundle to be refused over — they are
# never dispatched at runtime, only referenced by name from a candidate's
# spec.toolBundles.
#
# WHAT THIS PROVES: pkg/controllers/agentclass/builderclass.go's
# validateBuilderClass — the CONSUMER half of the workshop's prefix/label
# rule — actually runs against a real reconciler in this harness and produces
# a real, discriminating verdict: a class referencing a toolspec labeled for
# a DIFFERENT workshop goes Valid=False/ReferencesWorkshopTool, and an
# otherwise-identical class with no such reference goes Valid=True. Both
# facts are read from the tool result's JSON (applyCR's polled
# status.conditions), never from the agent's prose.
#
# WHAT THIS DOES NOT PROVE: the ADMISSION-side half of the same rule (a
# validating webhook refusing the write outright) is NOT exercised here. This
# harness registers no validating admission webhook at all, so a manifest
# that a real cluster's webhook would reject outright is instead accepted by
# the (real, in-process) apiserver and only refused a moment later by the
# consumer-side reconciler this bundle asserts on. A green run here is
# evidence the CONSUMER gate works; it is NOT evidence the admission lockdown
# is wired or exercised anywhere in this suite.
apiVersion: v1
kind: Secret
metadata: {name: workshop-demo-placeholder, namespace: default}
type: Opaque
stringData: {api-key: "unused-by-the-test-provider"}
---
apiVersion: v1
kind: Secret
metadata: {name: workshop-demo-fake-creds, namespace: default}
type: Opaque
stringData: {placeholder: "unused-by-the-fake-channel"}
---
apiVersion: agentprimitives.authzed.com/v1alpha1
kind: AgentIdentity
metadata: {name: workshop-demo-identity, namespace: default}
spec:
  description: "Fixture identity for the workshop-apply-earns-a-real-verdict bundle; the toolbox needs no upstream credential (upstreamAuth.provider: none)."
  credentials: []
---
# SpiceboxClass named to match the workshop toolbox's own sandbox.class
# (pkg/tools/workshopmcp/deploy/sidecartoolbox.yaml). Required for the
# SidecarToolbox/workshop below to reach Valid=True at all — the real
# sidecartoolbox.Reconciler Gets this class and requires ITS Valid condition
# True before continuing (see Harness.StampSpiceboxClassesValid's doc).
apiVersion: agentprimitives.authzed.com/v1alpha1
kind: SpiceboxClass
metadata: {name: workshop-sandbox}
spec:
  image: ""
  resources: {cpu: "100m", memory: "64Mi", ephemeralStorage: "16Mi"}
  network: {mode: allowlist, allowedHosts: []}
---
# Copy of pkg/tools/workshopmcp/deploy/sidecartoolbox.yaml's spec, wrapped in
# CR metadata — same as workshop-inventory-is-real's fixture. Verbatim, no
# deviation: this used to carry an `args: {unconstrainedArgs: true}`
# work-around on the `apply` tool entry, because the production manifest
# declared no `args` block on ANY tool and pkg/tools/mcp/validator's
# checkAllowedFields fail-closed rule denied this bundle's own `manifest`
# argument before the call ever reached the real server. That was the
# production defect itself (2026-09-10 agent-builder plan-8c task 3): the
# deploy manifest now declares args.allowedFields per tool, derived from
# each tool's own Go InputSchema, so this fixture copies it verbatim like
# every other tool instead of working around it. CR name "workshop" is
# load-bearing: it is both workshopSidecarToolboxRef
# (test/e2e/threadrun/driver.go) — what routes this toolbox's dispatch to the
# real server — and the deploy manifest's own documented CR name.
apiVersion: agentprimitives.authzed.com/v1alpha1
kind: SidecarToolbox
metadata: {name: workshop, namespace: default}
spec:
  name: workshop
  version: "1"
  intent: >-
    The agent-builder's own MCP toolset: inventories the cluster's real
    capabilities, probes candidate images/MCP servers, applies and inspects
    draft agent-primitive CRs inside the caller's workshop namespace, renders
    plain-language summaries for approval cards, and exports/loads a portable
    .oap draft. Runs only inside a Ready, session-owned Workshop's provisioned
    namespace — never a standing deployment.

  source:
    image: ap-workshop:dev

  sandbox:
    class: workshop-sandbox

  transport:
    port: 8080
    path: /mcp
    healthcheck:
      path: /healthz
      timeoutSeconds: 30

  upstreamAuth:
    provider: none

  tools:
    - name: inventory
      intent: "Snapshot of this cluster's real capabilities, channel kinds, renderers, sandbox classes, MCP catalog, and the caller's effective settings ceilings, and the first-party sidecar images this cluster admits (with the reference to use), and the sign-in flows (providers) an account can be connected with."
      effects:
        readOnly: true
      permission:
        stateImpact: passthrough

    - name: probe_mcp
      intent: "List the tools a candidate MCP server exposes (tools/list), through the SSRF-guarded client."
      args:
        allowedFields: ["url"]
      effects:
        readOnly: true
      permission:
        stateImpact: passthrough

    - name: probe_image
      intent: "Run a candidate container image and discover the MCP tool surface it declares."
      args:
        allowedFields: ["image", "timeout_seconds"]
      effects:
        readOnly: true
      permission:
        stateImpact: passthrough

    - name: cli_help
      intent: "Run a candidate container image's CLI binary with --help to discover its interface."
      args:
        allowedFields: ["image", "binary", "args", "timeout_seconds"]
      effects:
        readOnly: true
      permission:
        stateImpact: passthrough

    - name: validate_spec
      intent: "Round-trip a candidate resource's spec content through the real toolspec/MCP/sidecar validators and CEL compile."
      args:
        allowedFields: ["kind", "manifest"]
      effects:
        readOnly: true
      permission:
        stateImpact: passthrough

    - name: apply
      intent: "Server-side-apply a candidate custom resource into the workshop, under this sidecar's field manager."
      args:
        allowedFields: ["manifest"]
      permission:
        stateImpact: external
        check:
          resourceType: workshop_draft
          resourceIDTemplate: "draft"
          permission: change

    - name: get
      intent: "Read one custom resource, by kind and name, from the workshop."
      args:
        allowedFields: ["kind", "name"]
      effects:
        readOnly: true
      permission:
        stateImpact: passthrough

    - name: list
      intent: "List every custom resource of one kind in the workshop."
      args:
        allowedFields: ["kind"]
      effects:
        readOnly: true
      permission:
        stateImpact: passthrough

    - name: delete
      intent: "Delete one custom resource, by kind and name, from the workshop."
      args:
        allowedFields: ["kind", "name"]
      permission:
        stateImpact: external
        check:
          resourceType: workshop_draft
          resourceIDTemplate: "draft"
          permission: remove

    - name: render_summary
      intent: "Plain-language rendering of a custom resource, for approval cards and the running build summary."
      args:
        allowedFields: ["manifest", "kind", "name"]
      effects:
        readOnly: true
      permission:
        stateImpact: passthrough

    - name: export_draft
      intent: "Bundle the agent this workshop's builder has authored into a portable .oap draft, stored as a builder-session artifact."
      permission:
        stateImpact: stateless

    - name: load_draft
      intent: "Re-apply a previously exported draft's bundle into this workshop, one apply per object, resuming a build."
      args:
        allowedFields: ["oap"]
      permission:
        stateImpact: passthrough

    - name: test_tool
      intent: "Run the agent under construction as a one-shot tester against a representative request and return its tool-results (never its prose). Read-only: use it automatically for read-only tools; get the person's OK before testing a side-effecting one."
      args:
        allowedFields: ["class", "request"]
      effects:
        readOnly: true
      permission:
        stateImpact: passthrough

    - name: test_link
      intent: "The ap:agentlink props that send the person to try the agent under construction themselves, in the browser chat."
      args:
        allowedFields: ["class", "prompt"]
      effects:
        readOnly: true
      permission:
        stateImpact: passthrough

    - name: watch_test
      intent: "Ask to be told when the person's own test of the agent starts, pauses, ends, or times out."
      args:
        allowedFields: ["class", "timeoutMinutes"]
      permission:
        stateImpact: external
        check:
          resourceType: workshop_draft
          resourceIDTemplate: "draft"
          permission: test

    - name: test_sessions
      intent: "The person's own test sessions of an agent in this workshop, by name and phase."
      args:
        allowedFields: ["class"]
      effects:
        readOnly: true
      permission:
        stateImpact: passthrough

    - name: read_test_log
      intent: "Read the current test session's tool-results and tool-errors."
      args:
        allowedFields: ["session"]
      effects:
        readOnly: true
      permission:
        stateImpact: passthrough

    - name: stop_test
      intent: "Stop the person's test session; the conversation returns to the builder. Stopping deletes the test conversation and its log, so read the log first."
      args:
        allowedFields: ["session"]
      permission:
        stateImpact: passthrough

    - name: request_credential
      intent: "Ask the person to connect a bot/shared credential (an API key, PAT, or static secret to paste, or a shared OAuth-MCP account to authorize) for an AgentIdentity you authored in this workshop. A card with a secure link goes to the person; they enter or authorize it and it lands in the workshop."
      args:
        allowedFields: ["identity", "credential", "authKind"]
      permission:
        stateImpact: external

    - name: request_install
      intent: "Ask a platform admin to install the agent this workshop has built. Records the request on the workshop; an admin card (delivered by a later plan) is what the person sees. Once-only: a second call after an install has already been requested is refused, not overwritten."
      args:
        allowedFields: ["suggestedName", "bundleDigest"]
      permission:
        stateImpact: external

    - name: recommend_capability
      intent: "Recommend a platform capability this build surfaced a need for — something no existing tool or toolbox covers. Records the recommendation on the workshop for a platform admin to review. Once-only: a second call after one has already been recorded is refused, not overwritten. This tool does not end the session by itself — call agent_work_complete afterward to do that."
      args:
        allowedFields: ["summary", "artifactRef", "draftRef"]
      permission:
        stateImpact: external

    - name: close_others
      intent: "Close the person's other open builder workshops (all, or the ones named, by the name shown on the page or the workshop name). A platform admin may name anyone's. Never closes this one. Answers with what was closed, what was refused and why, and anything still being decided."
      args:
        allowedFields: ["workshops"]
      permission:
        stateImpact: external

    - name: agents_in_thread
      intent: "List the other agents that have already worked this conversation thread — participants and their own delegated subagents — so a builder picking up mid-thread knows who was here already."
      effects:
        readOnly: true
      permission:
        stateImpact: passthrough

    - name: project_agent
      intent: "Project a credential-free practice double of another agent's class — one reachable from this conversation thread — into the workshop, so a hand-off to it can be rehearsed without ever running the real agent."
      args:
        allowedFields: ["namespace", "name"]
      permission:
        stateImpact: external
        check:
          resourceType: workshop_draft
          resourceIDTemplate: "draft"
          permission: project

  spicedbSchema:
    resources:
      - name: workshop_draft
        standing: session-only
        display: {name: "the draft in this workshop"}
        relations:
          - {name: session, subjectType: agentsession}
        permissions:
          - name: change
            expr: session
            title: "Change this workshop's draft (any of its definitions)"
            planningNote: >-
              A phase that changes the draft lists this handle AND declares the
              workshop_draft slot on the phase (no id needed); the handle alone is
              refused, and the slot alone would quietly bind change.
          - name: remove
            expr: session
            title: "Remove a definition from this workshop's draft"
            planningNote: >-
              List it beside change when a definition will be replaced; a remove
              without it raises a card.
          - name: test
            expr: session
            title: "Watch a test of this workshop's draft"
            planningNote: >-
              The test phase lists it with the slot declared; re-arming the watch
              then needs no card.
          - name: project
            expr: session
            title: "Project a practice double of another agent into this workshop"
            planningNote: >-
              One approval covers every projection in the phase; the platform
              refuses any agent not already part of this conversation.
---
# --- Fixtures for the CANDIDATE classes the scripted session applies below.
# Neither is ever started as a session; they exist only so the first
# candidate (builder-candidate-foreign) has a real toolBundle to be refused
# over. Both are pre-stamped Valid=True by the driver's stampToolspecsValid /
# StampSpiceboxClassesValid stand-ins before the scripted turns run (see
# those functions' own docs in test/e2e/threadrun/driver.go and
# test/e2e/harness.go) — this harness runs no SpiceboxClass/SpiceboxToolspec
# controller of its own.
apiVersion: agentprimitives.authzed.com/v1alpha1
kind: SpiceboxClass
metadata: {name: cls-candidate}
spec:
  image: registry.example.com/gh-toolbelt:latest
  resources: {cpu: "100m", memory: "64Mi", ephemeralStorage: "16Mi"}
  tools:
    - {name: gh, command: ["/usr/bin/gh"]}
---
# Labeled for a namespace OTHER than "default" — the namespace every
# candidate class below actually lands in (workshop_apply defaults an empty
# manifest namespace to the sidecar's own WorkshopIdentity.Namespace, which
# mountWorkshopMCP sets to the harness's default namespace, "default"). That
# mismatch is exactly what pkg/controllers/agentclass/builderclass.go's
# validateBuilderClass refuses: a class outside the labeled namespace must
# not reference this toolspec.
apiVersion: agentprimitives.authzed.com/v1alpha1
kind: SpiceboxToolspec
metadata:
  name: ts-foreign-workshop
  labels:
    agentprimitives.authzed.com/workshop-namespace: other-build-space
spec:
  name: ts-foreign-workshop
  version: "1"
  toolkit: {name: gh, revision: "2026-05-01"}
  allowSubcommands: ["pr view"]
---
# The A/B partner of ts-foreign-workshop: identical in every way that
# reaches validateBuilderClass EXCEPT the workshop-namespace label, which
# names "default" — the namespace the candidate classes actually land in.
# Without this the clean candidate would carry no toolBundles at all, and
# the pair would only prove "a foreign-labeled toolspec is refused, no
# toolspec is allowed" — a regression that refused ANY toolspec ref would
# pass identically. With it, the two candidates differ in exactly one
# value, so a green run pins the LABEL as the discriminator.
apiVersion: agentprimitives.authzed.com/v1alpha1
kind: SpiceboxToolspec
metadata:
  name: ts-own-workshop
  labels:
    agentprimitives.authzed.com/workshop-namespace: default
spec:
  name: ts-own-workshop
  version: "1"
  toolkit: {name: gh, revision: "2026-05-01"}
  allowSubcommands: ["pr view"]
---
apiVersion: agentprimitives.authzed.com/v1alpha1
kind: AgentClass
metadata: {name: workshop-demo, namespace: default}
spec:
  displayName: WorkshopApplyDemoBot
  description: "E2E fixture agent proving workshop_apply's result reflects a real AgentClass reconciler verdict. Do not deploy to a real cluster."
  model:
    provider: test                 # production operator REFUSES this
    name: scripted                 # cosmetic; ignored at runtime
    apiKey: {name: workshop-demo-placeholder, key: api-key}
  systemPrompt:
    inline: |
      You are a fixture agent for the agentprimitives e2e harness.
      DO NOT deploy to a real cluster — your model provider is `test`.
      Your `workshop` sidecar toolbox exposes workshop_apply and the rest
      of the agent-builder's own MCP toolset.
  agentIdentity: workshop-demo-identity
  authz:
    # Disabled so this bundle isolates the real-controller-verdict path
    # rather than re-testing the tool-call approval round trip other bundles
    # already cover — same posture as workshop-inventory-is-real.
    toolCalls: {mode: disabled}
  sidecarToolboxes:
    - {name: workshop, ref: workshop}
  budget: {maxTurns: 30, maxTokens: 50000, maxDuration: 5m}
---
apiVersion: agentprimitives.authzed.com/v1alpha1
kind: Channel
metadata: {name: workshop-demo-fake, namespace: default}
spec:
  kind: fake
  role: both
  agentClass: workshop-demo
  credentialsRef: {secretName: workshop-demo-fake-creds}
  fake: {echo: false}
