# Goal fixture: opt-in durable goals with enforcing information-flow checks.
# Uses the scripted test provider and must not be deployed to a real cluster.
apiVersion: v1
kind: Secret
metadata: {name: goaldemo-placeholder, namespace: default}
type: Opaque
stringData: {api-key: "unused-by-the-test-provider"}
---
apiVersion: v1
kind: Secret
metadata: {name: goaldemo-fake-creds, namespace: default}
type: Opaque
stringData: {placeholder: "unused-by-the-fake-channel"}
---
apiVersion: agentprimitives.authzed.com/v1alpha1
kind: AgentClass
metadata: {name: goaldemo, namespace: default}
spec:
  displayName: GoalDemoBot
  description: "E2E fixture agent. Do not deploy to a real cluster."
  model:
    provider: test                 # production operator REFUSES this
    name: scripted                 # cosmetic; ignored at runtime
    apiKey: {name: goaldemo-placeholder, key: api-key}
  systemPrompt:
    inline: |
      You are a fixture agent for the agentprimitives e2e harness.
      DO NOT deploy to a real cluster — your model provider is `test`.
      You answer briefly.
  budget: {maxTurns: 50, maxTokens: 100000, maxDuration: "1h"}
  capabilities:
    goals: {}
  authz:
    informationLeakage:
      mode: enforcing
---
apiVersion: agentprimitives.authzed.com/v1alpha1
kind: Channel
metadata: {name: goaldemo-fake, namespace: default}
spec:
  kind: fake
  role: both
  agentClass: goaldemo
  credentialsRef: {secretName: goaldemo-fake-creds}
  fake: {echo: false}
