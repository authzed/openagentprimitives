# The BrowserToolbox CR this bundle exercises — interaction: readonly.
#
# Named in bundle.json's extraManifests (as "01-browser-toolbox") as well as
# being applied through agentDir like every other file in this directory; see
# browser-blocked-host/manifests/01-browser-toolbox.yaml's header for the full
# rationale (same driver, same reason) — short version: the threadrun driver's
# browserToolboxSpecs reads the RAW TEXT of every extraManifests-named file to
# find a `kind: BrowserToolbox` document, because this AgentClass never
# references the toolbox and so nothing ever resolves it live from the API.
#
# Phase C ships the acting tool set (web_type, web_click, web_press,
# web_select, web_submit, web_request_human_step), synthesized ONLY when
# interaction: act (pkg/agent/tool/browser/synthesize.go's Synthesize appends
# them behind that gate). This toolbox is readonly, so it must keep excluding
# them: this bundle's toolNotOffered: web_click / web_type / web_submit
# assertions are the live guard that the readonly gate withholds the acting set.
#
# access.sites names an unrelated placeholder host, exactly as in
# browser-blocked-host: the real test site's host is appended automatically
# by setupBrowserFixture for an allowlist-mode toolbox.
apiVersion: agentprimitives.authzed.com/v1alpha1
kind: BrowserToolbox
metadata: {name: web, namespace: default}
spec:
  access:
    mode: allowlist
    sites:
      - host: example.com
  interaction: readonly
  state: ephemeral
