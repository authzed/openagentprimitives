# Fixture agent for the browser-readonly-catalog bronze bundle.
#
# Same shape as browser-blocked-host's fixture: a bare test-provider
# AgentClass + fake Channel, no sidecar, no MCPServer, no agentIdentity. The
# BrowserToolbox CR lives in its own file (01-browser-toolbox.yaml); see that
# file's header for why it is named in extraManifests as well as applied via
# agentDir.
apiVersion: v1
kind: Secret
metadata: {name: browser-readonly-catalog-placeholder, namespace: default}
type: Opaque
stringData: {api-key: "unused-by-the-test-provider"}
---
apiVersion: v1
kind: Secret
metadata: {name: browser-readonly-catalog-fake-creds, namespace: default}
type: Opaque
stringData: {placeholder: "unused-by-the-fake-channel"}
---
apiVersion: agentprimitives.authzed.com/v1alpha1
kind: AgentClass
metadata: {name: browser-readonly-catalog, namespace: default}
spec:
  displayName: BrowserReadonlyCatalogBot
  description: "E2E fixture agent. Do not deploy to a real cluster."
  model:
    provider: test                 # production operator REFUSES this
    name: scripted                 # cosmetic; ignored at runtime
    apiKey: {name: browser-readonly-catalog-placeholder, key: api-key}
  systemPrompt:
    inline: |
      You are a fixture agent for the agentprimitives e2e harness.
      DO NOT deploy to a real cluster — your model provider is `test`.
      You have a browser toolbox named `web`, read-only, for looking things
      up on the open web within its allowed sites.
  budget: {maxTurns: 20, maxTokens: 50000, maxDuration: 5m}
---
apiVersion: agentprimitives.authzed.com/v1alpha1
kind: Channel
metadata: {name: browser-readonly-catalog-fake, namespace: default}
spec:
  kind: fake
  role: both
  agentClass: browser-readonly-catalog
  credentialsRef: {secretName: browser-readonly-catalog-fake-creds}
  fake: {echo: false}
