# A centerdot fixture whose slot declares the full set of instance-axis fields:
# fillFrom, autoGrantFrom and membership.
#
# The point is that they are DECLARED and not yet consumed. Adding fields to an
# authz block is exactly the change that can quietly break a class — a rejected
# enum, a validator that fires when it should not, a CRD that never regenerated
# — and every one of those failure modes ends with the agent not running at all.
# So this bundle asserts the ordinary path still works end to end.
#
# The WHOLE spec is restated: ExtraManifests REPLACES the object rather than
# patching it, so a partial spec drops systemPrompt and the class fails Valid
# with "exactly one of inline or configMapRef must be set".
apiVersion: agentprimitives.authzed.com/v1alpha1
kind: AgentClass
metadata:
  name: centerdot-companies
  namespace: default
spec:
  displayName: CenterdotBot
  description: "E2E fixture agent. Do not deploy to a real cluster."
  model:
    provider: test
    name: scripted
    apiKey:
      name: centerdot-placeholder
      key: api-key
  systemPrompt:
    inline: |
      You are a fixture agent for the agentprimitives e2e harness.
      DO NOT deploy to a real cluster.

      You operate on companies and contacts. Available tools:
        - centerdot_list_companies(sinceDays): list companies created recently
        - centerdot_list_contacts_for_company(companyId): list contacts
  agentIdentity: centerdot-identity
  mcpServers:
    - name: centerdot
      ref: centerdot-companies
  budget:
    maxTurns: 10
    maxTokens: 50000
    maxDuration: 5m
  authz:
    slots:
      - resourceType: crm_company
        description: "A CRM company record"
        permission: contact_access
        # frozen pins a grant to the member set present at approval time. It is
        # the right default for a sensitive type, and here it also proves the
        # non-default enum value survives admission.
        membership: frozen
        fillFrom: [channel_thread, ask]
        autoGrantFrom: [owner]
