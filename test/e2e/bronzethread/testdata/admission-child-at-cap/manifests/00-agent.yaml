# Fixture for the admission-child-at-cap bundle: a lead that delegates to a
# coder whose class is capped at one concurrent session.
#
# The cap is on cap-coder, the CHILD's class, because that is the line the
# delegated child joins: a child session runs under the class it was
# delegated to. A cap on cap-lead would never see the child at all. A class
# cannot delegate to itself (a roster cycle is refused), so parent and child
# are necessarily of different classes, and the coder line is put at its cap
# by a direct (non-delegated) coder session, the "holder" thread.
#
# Both classes are toolless beyond their meta-tool grants and are
# channel-attached with a one-second sleepAfter: a finished session keeps its
# admission until it sleeps, and the sleep is what hands the coder line's one
# slot to the queued session at the end.
apiVersion: v1
kind: Secret
metadata: {name: capchild-placeholder, namespace: default}
type: Opaque
stringData: {api-key: "unused-by-the-test-provider"}
---
apiVersion: v1
kind: Secret
metadata: {name: capchild-fake-creds, namespace: default}
type: Opaque
stringData: {placeholder: "unused-by-the-fake-channel"}
---
apiVersion: agentprimitives.authzed.com/v1alpha1
kind: AgentClass
metadata: {name: cap-lead, namespace: default}
spec:
  displayName: CapLead
  description: "E2E fixture agent. Do not deploy to a real cluster."
  model:
    provider: test                 # production operator REFUSES this
    name: scripted                 # cosmetic; ignored at runtime
    apiKey: {name: capchild-placeholder, key: api-key}
  capabilities:
    subagents: {}
  subagents: ["cap-coder"]
  systemPrompt:
    inline: |
      You are a fixture lead for the agentprimitives e2e harness.
      DO NOT deploy to a real cluster — your model provider is `test`.
      You hand bounded coding tasks to the coder with the delegate tool.
  budget: {maxTurns: 50, maxTokens: 100000, maxDuration: "1h"}
  channels: {sleepAfter: 1s}
---
apiVersion: agentprimitives.authzed.com/v1alpha1
kind: AgentClass
metadata: {name: cap-coder, namespace: default}
spec:
  displayName: CapCoder
  description: "E2E fixture agent. Do not deploy to a real cluster."
  model:
    provider: test
    name: scripted
    apiKey: {name: capchild-placeholder, key: api-key}
  systemPrompt:
    inline: |
      You are a fixture coder for the agentprimitives e2e harness.
      DO NOT deploy to a real cluster — your model provider is `test`.
      You complete coding tasks, whether a person or a lead asked.
  budget: {maxTurns: 50, maxTokens: 100000, maxDuration: "1h"}
  channels: {sleepAfter: 1s}
  maxConcurrentSessions: 1
---
apiVersion: agentprimitives.authzed.com/v1alpha1
kind: Channel
metadata: {name: cap-lead-fake, namespace: default}
spec:
  kind: fake
  role: both
  agentClass: cap-lead
  credentialsRef: {secretName: capchild-fake-creds}
  fake: {echo: false}
---
apiVersion: agentprimitives.authzed.com/v1alpha1
kind: Channel
metadata: {name: cap-coder-fake, namespace: default}
spec:
  kind: fake
  role: both
  agentClass: cap-coder
  credentialsRef: {secretName: capchild-fake-creds}
  fake: {echo: false}
