# Fixture agents for the subagent-delegation bronzethread bundle.
#
# demo-lead grants the subagents capability and names ONE class on its
# roster, demo-coder. demo-sre is deliberately NEVER defined anywhere in
# this fixture -- its absence is what the bundle's second turn exercises: a
# class that is neither on the roster nor exists at all must be denied, and
# the denial must name it. Do not add a demo-sre class here.
#
# Both classes are deliberately toolless beyond their meta-tool grants: no
# mcpServers, no agentIdentity, no boundEntities, mirroring
# agent-attachment-native/01-agent.yaml's "toolless beyond capabilities"
# shape. demo-coder carries no subagents capability and no roster of its
# own -- delegation is not transitive in this fixture.
apiVersion: v1
kind: Secret
metadata: {name: subdel-placeholder, namespace: default}
type: Opaque
stringData: {api-key: "unused-by-the-test-provider"}
---
apiVersion: v1
kind: Secret
metadata: {name: subdel-fake-creds, namespace: default}
type: Opaque
stringData: {placeholder: "unused-by-the-fake-channel"}
---
apiVersion: agentprimitives.authzed.com/v1alpha1
kind: AgentClass
metadata: {name: demo-lead, namespace: default}
spec:
  displayName: DemoLead
  description: "E2E fixture agent. Do not deploy to a real cluster."
  model:
    provider: test                 # production operator REFUSES this
    name: scripted                 # cosmetic; ignored at runtime
    apiKey: {name: subdel-placeholder, key: api-key}
  capabilities:
    subagents: {}
  subagents: ["demo-coder"]
  systemPrompt:
    inline: |
      You are a fixture agent for the agentprimitives e2e harness.
      DO NOT deploy to a real cluster — your model provider is `test`.
      You delegate bounded tasks to other agents with the delegate tool.
  budget: {maxTurns: 50, maxTokens: 100000, maxDuration: "1h"}
---
apiVersion: agentprimitives.authzed.com/v1alpha1
kind: AgentClass
metadata: {name: demo-coder, namespace: default}
spec:
  displayName: DemoCoder
  description: "E2E fixture agent. Do not deploy to a real cluster."
  model:
    provider: test
    name: scripted
    apiKey: {name: subdel-placeholder, key: api-key}
  systemPrompt:
    inline: |
      You are a fixture agent for the agentprimitives e2e harness.
      DO NOT deploy to a real cluster — your model provider is `test`.
      You receive a single delegated task with no conversation history and
      complete it.
  budget: {maxTurns: 50, maxTokens: 100000, maxDuration: "1h"}
---
apiVersion: agentprimitives.authzed.com/v1alpha1
kind: Channel
metadata: {name: demo-lead-fake, namespace: default}
spec:
  kind: fake
  role: both
  agentClass: demo-lead
  credentialsRef: {secretName: subdel-fake-creds}
  fake: {echo: false}
