# Fixture agents for the handoff-data-slot bundle.
#
# demo-analyst reads a ledger entry (minting a pt-tag with the result stored
# behind it) and delegates to demo-auditor, handing that datum over BY
# REFERENCE through a data slot. demo-auditor has no MCP server, no roster and
# no capabilities: everything it knows about the entry arrives in its opening
# context, placed there by the runner from the bound slot. That is the whole
# point — if the slot did not resolve, the child would have only the task text.
#
# The audiences are deliberately trivial (one user, who owns the entry) so the
# grader AUTO-GRANTS. A tag that would disclose, or one carrying untrusted
# content, is refused rather than routed today, so a fixture with a wider
# audience would exercise the refusal path instead of the handoff.
apiVersion: v1
kind: Secret
metadata: {name: handoff-placeholder, namespace: default}
type: Opaque
stringData: {api-key: "unused-by-the-test-provider"}
---
apiVersion: v1
kind: Secret
metadata: {name: handoff-fake-creds, namespace: default}
type: Opaque
stringData: {placeholder: "unused-by-the-fake-channel"}
---
apiVersion: v1
kind: Secret
metadata: {name: handoff-mcp-token, namespace: default}
type: Opaque
stringData: {access_token: "unused-by-the-fake-mcp-server"}
---
apiVersion: agentprimitives.authzed.com/v1alpha1
kind: AgentIdentity
metadata: {name: handoff-identity, namespace: default}
spec:
  description: "Handoff fixture: static MCP bearer token."
  credentials:
    - name: handoff-mcp-bearer
      type: static
      static:
        secretRef: {name: handoff-mcp-token, key: access_token}
---
apiVersion: agentprimitives.authzed.com/v1alpha1
kind: MCPServer
metadata: {name: handoff-ledger, namespace: default}
spec:
  name: handoff-ledger
  version: v1
  intent: "Fixture for the data-slot handoff bundle."
  server:
    url: "{{MCP_URL}}"
    transport: http
  auth: {credential: handoff-mcp-bearer}
  spicedbSchema:
    resources:
      - name: handoff_entry
        standing: session-only
        relations:
          - {name: viewer, subjectType: user}
        permissions:
          - {name: view, expr: viewer}
  tools:
    - name: read_entry
      intent: "Fetch one ledger entry by its id."
      args: {allowedFields: [id]}
      # stateImpact: stateless — the claim here is about the HANDOFF, and a
      # per-tool Check would make a failure ambiguous between "denied" and
      # "the slot never reached the child".
      permission: {stateImpact: stateless}
      effects: {readOnly: true, idempotent: true}
  # The declared read is what mints the tag, and the mint is what stores the
  # result behind it. Without this entry there is no tag, so nothing to bind.
  toolResourceMap:
    - tool: read_entry
      reads: {resourceType: handoff_entry, idArg: id, permission: view}
---
apiVersion: agentprimitives.authzed.com/v1alpha1
kind: AgentClass
metadata: {name: demo-analyst, namespace: default}
spec:
  displayName: DemoAnalyst
  description: "E2E fixture agent. Do not deploy to a real cluster."
  model:
    provider: test
    name: scripted
    apiKey: {name: handoff-placeholder, key: api-key}
  agentIdentity: handoff-identity
  mcpServers:
    - {name: ledger, ref: handoff-ledger}
  capabilities:
    subagents: {}
  subagents: ["demo-auditor"]
  authz:
    informationLeakage:
      mode: enforcing
      approvalTTL: 1m
      onUnsupportedChannel: blockBinding
      singleUserBypass: false
      loggingNoticeToRequester: false
  systemPrompt:
    inline: |
      You are a fixture agent for the agentprimitives e2e harness.
      DO NOT deploy to a real cluster — your model provider is `test`.
      You read ledger entries with ledger_read_entry(id), and delegate
      analysis to other agents. When you delegate, hand over the data you
      read using the delegate tool's `inputs`, naming the tool call that
      produced it — do not paste the data into the task text.
  budget: {maxTurns: 50, maxTokens: 100000, maxDuration: "1h"}
---
apiVersion: agentprimitives.authzed.com/v1alpha1
kind: AgentClass
metadata: {name: demo-auditor, namespace: default}
spec:
  displayName: DemoAuditor
  description: "E2E fixture agent. Do not deploy to a real cluster."
  model:
    provider: test
    name: scripted
    apiKey: {name: handoff-placeholder, key: api-key}
  systemPrompt:
    inline: |
      You are a fixture agent for the agentprimitives e2e harness.
      DO NOT deploy to a real cluster — your model provider is `test`.
      You receive a single delegated task. Data the delegating agent
      handed you appears in your opening context, labeled by slot.
  budget: {maxTurns: 50, maxTokens: 100000, maxDuration: "1h"}
---
apiVersion: agentprimitives.authzed.com/v1alpha1
kind: Channel
metadata: {name: demo-analyst-fake, namespace: default}
spec:
  kind: fake
  role: both
  agentClass: demo-analyst
  credentialsRef: {secretName: handoff-fake-creds}
  fake: {echo: false}
---
# Seeds the entry's viewer. One user, who is also the session's own — so the
# child's audience is a subset of the tag's readers and the grader auto-grants.
apiVersion: agentprimitives.authzed.com/v1alpha1
kind: SpiceDBBootstrap
metadata: {name: handoff-seed, namespace: default}
spec:
  relationships:
    - resource: {type: handoff_entry, id: "entry-77"}
      relation: viewer
      subject: {type: user, id: "analyst-1@example.com", canonicalize: true}
