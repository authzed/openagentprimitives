# Fixture agent for the per-user preferences bundles (Task 15).
#
# The one thing that matters here is spec.userPreferences: the preferences
# capability (pkg/agent/tool/meta/capability/preferences.go) is DEFAULT-ON and
# gates purely on that list being non-empty — no capabilities grant is needed
# to turn get_preferences/set_preference on, only the schema declaration
# itself. One enum key (language: en/de) is enough to exercise save, confirm,
# durable recall on a later turn, and (paired with a locked AgentSettings
# extraManifest) the admin-lock refusal.
apiVersion: v1
kind: Secret
metadata: {name: prefdemo-placeholder, namespace: default}
type: Opaque
stringData: {api-key: "unused-by-the-test-provider"}
---
apiVersion: v1
kind: Secret
metadata: {name: prefdemo-fake-creds, namespace: default}
type: Opaque
stringData: {placeholder: "unused-by-the-fake-channel"}
---
apiVersion: agentprimitives.authzed.com/v1alpha1
kind: AgentClass
metadata: {name: prefdemo, namespace: default}
spec:
  displayName: PrefDemoBot
  description: "E2E fixture agent. Do not deploy to a real cluster."
  model:
    provider: test                 # production operator REFUSES this
    name: scripted                 # cosmetic; ignored at runtime
    apiKey: {name: prefdemo-placeholder, key: api-key}
  systemPrompt:
    inline: |
      You are a fixture agent for the agentprimitives e2e harness.
      DO NOT deploy to a real cluster — your model provider is `test`.
      You answer briefly.
  budget: {maxTurns: 50, maxTokens: 100000, maxDuration: "1h"}
  userPreferences:
    - name: language
      type: enum
      enum:
        - value: en
          description: "English"
        - value: de
          description: "German"
      default: en
      description: "Language for replies"
---
apiVersion: agentprimitives.authzed.com/v1alpha1
kind: Channel
metadata: {name: prefdemo-fake, namespace: default}
spec:
  kind: fake
  role: both
  agentClass: prefdemo
  credentialsRef: {secretName: prefdemo-fake-creds}
  fake: {echo: false}
