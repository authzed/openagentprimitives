# Fixture agent for the guest session-start gate bundles.
#
# The one thing that matters here is on the CHANNEL: `fake: {orgScoped: true}`
# makes the fake kind attribute org membership, so the pipeline's start gate
# applies. The bundles send as a user with NO membership stamp — which an
# attributing channel reads as guest, fail-closed — so a brand-new session
# parks in AwaitingStartApproval and a start_approval card goes to the
# platform admins.
#
# The SpiceDBBootstrap seeds exactly one platform admin. Without it the gate
# has no addressable approver and refuses the guest outright (the
# start_no_admin dead end), which is a different scenario than these bundles
# exercise.
apiVersion: v1
kind: Secret
metadata: {name: guestgate-placeholder, namespace: default}
type: Opaque
stringData: {api-key: "unused-by-the-test-provider"}
---
apiVersion: v1
kind: Secret
metadata: {name: guestgate-fake-creds, namespace: default}
type: Opaque
stringData: {placeholder: "unused-by-the-fake-channel"}
---
apiVersion: agentprimitives.authzed.com/v1alpha1
kind: AgentClass
metadata: {name: guestgate-bot, namespace: default}
spec:
  displayName: GuestGateBot
  description: "E2E fixture agent. Do not deploy to a real cluster."
  model:
    provider: test                 # production operator REFUSES this
    name: scripted                 # cosmetic; ignored at runtime
    apiKey: {name: guestgate-placeholder, key: api-key}
  systemPrompt:
    inline: |
      You are a fixture agent for the agentprimitives e2e harness.
      DO NOT deploy to a real cluster — your model provider is `test`.
      You summarize what the user asks for, briefly.
  budget: {maxTurns: 50, maxTokens: 100000, maxDuration: "1h"}
---
apiVersion: agentprimitives.authzed.com/v1alpha1
kind: Channel
metadata: {name: guestgate-fake, namespace: default}
spec:
  kind: fake
  role: both
  agentClass: guestgate-bot
  credentialsRef: {secretName: guestgate-fake-creds}
  # orgScoped is the whole fixture: the fake kind declares org-membership
  # attribution for this channel, and an unstamped sender reads as guest.
  fake: {orgScoped: true}
---
apiVersion: agentprimitives.authzed.com/v1alpha1
kind: SpiceDBBootstrap
metadata: {name: guestgate-platform-admin, namespace: default}
spec:
  relationships:
    # The approver seat: platform#start_session = can_admin = admin. The
    # start gate fans its approval card out to these subjects, and the
    # decision pipe re-checks the clicker against the same permission.
    - resource: { type: platform, id: "platform" }
      relation: admin
      subject:  { type: user, id: "admin@example.com", canonicalize: true }
