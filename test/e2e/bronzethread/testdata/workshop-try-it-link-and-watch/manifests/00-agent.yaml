# Fixture agent for the workshop-try-it-link-and-watch bronze bundle.
#
# The point of this fixture is proving the three tools that replaced the
# builder-delegated `run_test` actually work against a REAL cluster:
#
#  1. `test_link` (pkg/tools/workshopmcp/tools_trytest.go's handleTestLink)
#     Gets the candidate AgentClass below (`demo-built`) by name, out of
#     Identity.Namespace — not the session-bound fields, so no bind is
#     needed for this one — and returns the ap:agentlink props the builder
#     paints so the PERSON starts their own test session themselves, in the
#     browser chat. demo-built's identityMode: userPassthrough is what
#     flips the returned label to "Try it as yourself" instead of the
#     generic "Try it".
#  2. `watch_test` records the watch on THIS builder session's own real
#     Workshop CR (spec.testWatch) — which requires the SAME late-bound
#     SessionNamespace/SessionName test/e2e/threadrun's
#     bindWorkshopSessionOnce supplies once the pipeline has created the
#     real builder session, which is why this bundle scripts TWO user turns
#     (see workshop-recommend-capability-is-real's own fixture for the same
#     reasoning). Same sanction requirement too: ensureWorkshop only creates
#     a Workshop CR for a session whose (namespace, class) pair is listed in
#     ClusterAgentSettings.spec.limits.builderClasses, so this fixture ships
#     that sanction below.
#  3. `test_sessions` reads the same real Workshop CR's spec.starterCanonical
#     and lists matching AgentSessions of the named class — empty here,
#     because nobody has actually started a demo-built test session in this
#     scripted run.
#
#     What this does NOT prove: the Workshop CONTROLLER
#     (pkg/controllers/workshop) is not wired into this harness at all, so
#     nothing ever reacts to spec.testWatch and no wake-up is ever delivered
#     to this session's transcript — the bundle asserts that watch_test wrote
#     the watch, never that anything came back from it. Same disclosed gap
#     as every other workshop bundle's Workshop-CR half.
#
# The SidecarToolbox spec below is copied VERBATIM from
# pkg/tools/workshopmcp/deploy/sidecartoolbox.yaml, same as the other
# workshop bundles — see TestWorkshopFixtures_MatchDeployToolSet
# (test/e2e/bronzethread/workshop_toolbox_fixture_test.go).
apiVersion: v1
kind: Secret
metadata: {name: workshop-demo-placeholder, namespace: default}
type: Opaque
stringData: {api-key: "unused-by-the-test-provider"}
---
apiVersion: v1
kind: Secret
metadata: {name: workshop-demo-fake-creds, namespace: default}
type: Opaque
stringData: {placeholder: "unused-by-the-fake-channel"}
---
apiVersion: agentprimitives.authzed.com/v1alpha1
kind: AgentIdentity
metadata: {name: workshop-demo-identity, namespace: default}
spec:
  description: "Fixture identity for the workshop-try-it-link-and-watch bundle; the toolbox needs no upstream credential (upstreamAuth.provider: none)."
  credentials: []
---
# Sanctioning a class in ClusterAgentSettings.spec.limits.builderClasses
# (below) trips a SEPARATE rule this bundle would otherwise never hit:
# pkg/controllers/agentclass/builderclass.go's validateBuilderClass refuses
# Valid=True for a sanctioned builder class with an EMPTY
# spec.authz.session.allowedStarters ("a sanctioned builder agent must list
# who may start it"). Same pattern as the agent-gatebot fixture and the
# other sanctioned workshop bundle: a group + SpiceDBBootstrap
# (canonicalize: true) so the harness's default fake-channel user
# ("user@example.com") resolves to the same canonical id the gate checks,
# without hand-computing the base64 encoding here.
apiVersion: agentprimitives.authzed.com/v1alpha1
kind: SpiceDBBootstrap
metadata:
  name: workshop-trytest-starters
  namespace: default
spec:
  relationships:
    - resource: { type: group, id: "workshop-trytest-starters" }
      relation: member
      subject:  { type: user, id: "user@example.com", canonicalize: true }
---
# Cluster-scoped ClusterAgentSettings singleton (name MUST be "cluster" —
# spiceboxv1alpha1.ClusterAgentSettingsName). spec.limits.builderClasses is
# THE sanction: pkg/controllers/agentsession's ensureWorkshop
# (workshop_hook.go) only creates a Workshop CR for a session whose
# (namespace, class) pair is listed here, naming the exact SidecarToolbox
# that is meant to receive the workshop identity. Without this entry
# ensureWorkshop no-ops (nil sanction, fail-closed) and watch_test/
# test_sessions would find no Workshop CR to act on at all.
apiVersion: agentprimitives.authzed.com/v1alpha1
kind: ClusterAgentSettings
metadata: {name: cluster}
spec:
  limits:
    builderClasses:
      - {namespace: default, name: workshop-demo, sidecarToolbox: workshop}
---
# SpiceboxClass named to match the workshop toolbox's own sandbox.class
# (pkg/tools/workshopmcp/deploy/sidecartoolbox.yaml). Required for the
# SidecarToolbox/workshop below to reach Valid=True at all — the real
# sidecartoolbox.Reconciler Gets this class and requires ITS Valid condition
# True before continuing (see Harness.StampSpiceboxClassesValid's doc).
apiVersion: agentprimitives.authzed.com/v1alpha1
kind: SpiceboxClass
metadata: {name: workshop-sandbox}
spec:
  image: ""
  resources: {cpu: "100m", memory: "64Mi", ephemeralStorage: "16Mi"}
  network: {mode: allowlist, allowedHosts: []}
---
# Verbatim copy of pkg/tools/workshopmcp/deploy/sidecartoolbox.yaml's spec,
# wrapped in CR metadata — see TestWorkshopFixtures_MatchDeployToolSet. CR
# name "workshop" is load-bearing: it is both workshopSidecarToolboxRef
# (test/e2e/threadrun/driver.go) — what routes this toolbox's dispatch to the
# real server — and the deploy manifest's own documented CR name.
apiVersion: agentprimitives.authzed.com/v1alpha1
kind: SidecarToolbox
metadata: {name: workshop, namespace: default}
spec:
  name: workshop
  version: "1"
  intent: >-
    The agent-builder's own MCP toolset: inventories the cluster's real
    capabilities, probes candidate images/MCP servers, applies and inspects
    draft agent-primitive CRs inside the caller's workshop namespace, renders
    plain-language summaries for approval cards, and exports/loads a portable
    .oap draft. Runs only inside a Ready, session-owned Workshop's provisioned
    namespace — never a standing deployment.

  source:
    image: ap-workshop:dev

  sandbox:
    class: workshop-sandbox

  transport:
    port: 8080
    path: /mcp
    healthcheck:
      path: /healthz
      timeoutSeconds: 30

  upstreamAuth:
    provider: none

  tools:
    - name: inventory
      intent: "Snapshot of this cluster's real capabilities, channel kinds, renderers, sandbox classes, MCP catalog, and the caller's effective settings ceilings, and the first-party sidecar images this cluster admits (with the reference to use), and the sign-in flows (providers) an account can be connected with."
      effects:
        readOnly: true
      permission:
        stateImpact: passthrough

    - name: probe_mcp
      intent: "List the tools a candidate MCP server exposes (tools/list), through the SSRF-guarded client."
      args:
        allowedFields: ["url"]
      effects:
        readOnly: true
      permission:
        stateImpact: passthrough

    - name: probe_image
      intent: "Run a candidate container image and discover the MCP tool surface it declares."
      args:
        allowedFields: ["image", "timeout_seconds"]
      effects:
        readOnly: true
      permission:
        stateImpact: passthrough

    - name: cli_help
      intent: "Run a candidate container image's CLI binary with --help to discover its interface."
      args:
        allowedFields: ["image", "binary", "args", "timeout_seconds"]
      effects:
        readOnly: true
      permission:
        stateImpact: passthrough

    - name: validate_spec
      intent: "Round-trip a candidate resource's spec content through the real toolspec/MCP/sidecar validators and CEL compile."
      args:
        allowedFields: ["kind", "manifest"]
      effects:
        readOnly: true
      permission:
        stateImpact: passthrough

    - name: apply
      intent: "Server-side-apply a candidate custom resource into the workshop, under this sidecar's field manager."
      args:
        allowedFields: ["manifest"]
      permission:
        stateImpact: external
        check:
          resourceType: workshop_draft
          resourceIDTemplate: "draft"
          permission: change

    - name: get
      intent: "Read one custom resource, by kind and name, from the workshop."
      args:
        allowedFields: ["kind", "name"]
      effects:
        readOnly: true
      permission:
        stateImpact: passthrough

    - name: list
      intent: "List every custom resource of one kind in the workshop."
      args:
        allowedFields: ["kind"]
      effects:
        readOnly: true
      permission:
        stateImpact: passthrough

    - name: delete
      intent: "Delete one custom resource, by kind and name, from the workshop."
      args:
        allowedFields: ["kind", "name"]
      permission:
        stateImpact: external
        check:
          resourceType: workshop_draft
          resourceIDTemplate: "draft"
          permission: remove

    - name: render_summary
      intent: "Plain-language rendering of a custom resource, for approval cards and the running build summary."
      args:
        allowedFields: ["manifest", "kind", "name"]
      effects:
        readOnly: true
      permission:
        stateImpact: passthrough

    - name: export_draft
      intent: "Bundle the agent this workshop's builder has authored into a portable .oap draft, stored as a builder-session artifact."
      permission:
        stateImpact: stateless

    - name: load_draft
      intent: "Re-apply a previously exported draft's bundle into this workshop, one apply per object, resuming a build."
      args:
        allowedFields: ["oap"]
      permission:
        stateImpact: passthrough

    - name: test_tool
      intent: "Run the agent under construction as a one-shot tester against a representative request and return its tool-results (never its prose). Read-only: use it automatically for read-only tools; get the person's OK before testing a side-effecting one."
      args:
        allowedFields: ["class", "request"]
      effects:
        readOnly: true
      permission:
        stateImpact: passthrough

    - name: test_link
      intent: "The ap:agentlink props that send the person to try the agent under construction themselves, in the browser chat."
      args:
        allowedFields: ["class", "prompt"]
      effects:
        readOnly: true
      permission:
        stateImpact: passthrough

    - name: watch_test
      intent: "Ask to be told when the person's own test of the agent starts, pauses, ends, or times out."
      args:
        allowedFields: ["class", "timeoutMinutes"]
      permission:
        stateImpact: external
        check:
          resourceType: workshop_draft
          resourceIDTemplate: "draft"
          permission: test

    - name: test_sessions
      intent: "The person's own test sessions of an agent in this workshop, by name and phase."
      args:
        allowedFields: ["class"]
      effects:
        readOnly: true
      permission:
        stateImpact: passthrough

    - name: read_test_log
      intent: "Read the current test session's tool-results and tool-errors."
      args:
        allowedFields: ["session"]
      effects:
        readOnly: true
      permission:
        stateImpact: passthrough

    - name: stop_test
      intent: "Stop the person's test session; the conversation returns to the builder. Stopping deletes the test conversation and its log, so read the log first."
      args:
        allowedFields: ["session"]
      permission:
        stateImpact: passthrough

    - name: request_credential
      intent: "Ask the person to connect a bot/shared credential (an API key, PAT, or static secret to paste, or a shared OAuth-MCP account to authorize) for an AgentIdentity you authored in this workshop. A card with a secure link goes to the person; they enter or authorize it and it lands in the workshop."
      args:
        allowedFields: ["identity", "credential", "authKind"]
      permission:
        stateImpact: external

    - name: request_install
      intent: "Ask a platform admin to install the agent this workshop has built. Records the request on the workshop; an admin card (delivered by a later plan) is what the person sees. Once-only: a second call after an install has already been requested is refused, not overwritten."
      args:
        allowedFields: ["suggestedName", "bundleDigest"]
      permission:
        stateImpact: external

    - name: recommend_capability
      intent: "Recommend a platform capability this build surfaced a need for — something no existing tool or toolbox covers. Records the recommendation on the workshop for a platform admin to review. Once-only: a second call after one has already been recorded is refused, not overwritten. This tool does not end the session by itself — call agent_work_complete afterward to do that."
      args:
        allowedFields: ["summary", "artifactRef", "draftRef"]
      permission:
        stateImpact: external

    - name: close_others
      intent: "Close the person's other open builder workshops (all, or the ones named, by the name shown on the page or the workshop name). A platform admin may name anyone's. Never closes this one. Answers with what was closed, what was refused and why, and anything still being decided."
      args:
        allowedFields: ["workshops"]
      permission:
        stateImpact: external

    - name: agents_in_thread
      intent: "List the other agents that have already worked this conversation thread — participants and their own delegated subagents — so a builder picking up mid-thread knows who was here already."
      effects:
        readOnly: true
      permission:
        stateImpact: passthrough

    - name: project_agent
      intent: "Project a credential-free practice double of another agent's class — one reachable from this conversation thread — into the workshop, so a hand-off to it can be rehearsed without ever running the real agent."
      args:
        allowedFields: ["namespace", "name"]
      permission:
        stateImpact: external
        check:
          resourceType: workshop_draft
          resourceIDTemplate: "draft"
          permission: project

  spicedbSchema:
    resources:
      - name: workshop_draft
        standing: session-only
        display: {name: "the draft in this workshop"}
        relations:
          - {name: session, subjectType: agentsession}
        permissions:
          - name: change
            expr: session
            title: "Change this workshop's draft (any of its definitions)"
            planningNote: >-
              A phase that changes the draft lists this handle AND declares the
              workshop_draft slot on the phase (no id needed); the handle alone is
              refused, and the slot alone would quietly bind change.
          - name: remove
            expr: session
            title: "Remove a definition from this workshop's draft"
            planningNote: >-
              List it beside change when a definition will be replaced; a remove
              without it raises a card.
          - name: test
            expr: session
            title: "Watch a test of this workshop's draft"
            planningNote: >-
              The test phase lists it with the slot declared; re-arming the watch
              then needs no card.
          - name: project
            expr: session
            title: "Project a practice double of another agent into this workshop"
            planningNote: >-
              One approval covers every projection in the phase; the platform
              refuses any agent not already part of this conversation.
---
apiVersion: agentprimitives.authzed.com/v1alpha1
kind: AgentClass
metadata: {name: workshop-demo, namespace: default}
spec:
  displayName: WorkshopTryItLinkAndWatchDemoBot
  description: "E2E fixture agent proving test_link/watch_test/test_sessions work against a REAL Workshop CR. Do not deploy to a real cluster."
  model:
    provider: test                 # production operator REFUSES this
    name: scripted                 # cosmetic; ignored at runtime
    apiKey: {name: workshop-demo-placeholder, key: api-key}
  systemPrompt:
    inline: |
      You are a fixture agent for the agentprimitives e2e harness.
      DO NOT deploy to a real cluster — your model provider is `test`.
      Your `workshop` sidecar toolbox exposes test_link, watch_test and
      test_sessions, and the rest of the agent-builder's own MCP toolset.
  agentIdentity: workshop-demo-identity
  authz:
    # toolCalls disabled so this bundle isolates the session-identity/
    # Workshop-CR path rather than re-testing the tool-call approval round
    # trip other bundles already cover — same posture as the other workshop
    # bundles. session.allowedStarters is REQUIRED the moment this class is
    # sanctioned (see the SpiceDBBootstrap comment above) — the group +
    # bootstrap above puts the harness's default fake-channel user in it,
    # mirroring testdata/agent-gatebot's own fixture.
    toolCalls: {mode: disabled}
    session:
      allowedStarters: ["group:workshop-trytest-starters#member"]
      platformAdminsMayStart: false
      onlyStartersInteract: true
  sidecarToolboxes:
    - {name: workshop, ref: workshop}
  budget: {maxTurns: 30, maxTokens: 50000, maxDuration: 5m}
---
# demo-built: the CANDIDATE agent this workshop's builder is constructing —
# never itself started as a session in this harness. test_link/watch_test
# Get it by name (test_link out of Identity.Namespace, watch_test to confirm
# it exists before recording the watch) purely to read spec.identityMode;
# identityMode: userPassthrough is what flips test_link's returned label to
# "Try it as yourself" (tryLabelAsYourself in tools_trytest.go) instead of
# the generic "Try it". Minimal valid spec, same shape as the userPassthrough
# candidate classes workshop-apply-earns-a-real-verdict's own bundle applies
# through workshop_apply: spec.agentIdentity is required by the AgentClass
# CRD's CEL rule only for identityMode ask|dynamic, never for
# userPassthrough, so this candidate carries none.
apiVersion: agentprimitives.authzed.com/v1alpha1
kind: AgentClass
metadata: {name: demo-built, namespace: default}
spec:
  displayName: DemoBuiltAgent
  description: "Candidate agent under construction in this workshop; not itself run in this harness."
  model:
    provider: test
    name: scripted
    apiKey: {name: workshop-demo-placeholder, key: api-key}
  systemPrompt:
    inline: |
      You are a fixture candidate agent under construction. Do not deploy to
      a real cluster — your model provider is `test`.
  identityMode: userPassthrough
  budget: {maxTurns: 10, maxTokens: 10000, maxDuration: 5m}
---
apiVersion: agentprimitives.authzed.com/v1alpha1
kind: Channel
metadata: {name: workshop-demo-fake, namespace: default}
spec:
  kind: fake
  role: both
  agentClass: workshop-demo
  credentialsRef: {secretName: workshop-demo-fake-creds}
  fake: {echo: false}
