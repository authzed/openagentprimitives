# Fixture agent for the trigger-driven reviewbot bundle.
#
# Two Channels, and the pairing is the point. The INPUT is kind=github: nobody
# types on it, a signed webhook opens the session, and its kind is what puts the
# trigger-status meta tools in the catalog and makes the
# `trigger-status-concluded` completion requirement enforceable. The OUTPUT is
# kind=slack, because that is where a review addressed to no AP user can
# actually be read — and because slack is the only kind here that renders a
# live-view offer, so it is the only surface on which "the artifact reached the
# channel" is an observable fact rather than a tool return value.
#
# No tool bundles. The captured session did its reading through sandbox
# toolspecs, which bronzethread does not execute; see the bundle's description
# for what that leaves out and why the parts under test are unaffected.
apiVersion: v1
kind: Secret
metadata: {name: reviewbot-placeholder, namespace: default}
type: Opaque
stringData: {api-key: "unused-by-the-test-provider"}
---
# The github App credentials. app-id and installation-id are the fixture's own;
# private-key and webhook-secret are PLACEHOLDERS the harness patches over with
# a real generated key and the harness signing secret (see
# Harness.WireGitHubCredentials). A PEM does not belong checked in beside a
# bundle, and the webhook secret has exactly one writer for the same reason the
# signer reads it back off this Secret rather than from a constant.
apiVersion: v1
kind: Secret
metadata: {name: reviewbot-gh-creds, namespace: default}
type: Opaque
stringData:
  app-id: "1"
  installation-id: "1"
  private-key: "patched-by-the-harness"
  webhook-secret: "patched-by-the-harness"
---
apiVersion: v1
kind: Secret
metadata: {name: reviewbot-slack-creds, namespace: default}
type: Opaque
stringData:
  bot-token: "xoxb-test"
  app-token: "xapp-test"
---
apiVersion: agentprimitives.authzed.com/v1alpha1
kind: AgentClass
metadata: {name: demo-reviewbot, namespace: default}
spec:
  displayName: DemoReviewbot
  description: "E2E fixture agent. Do not deploy to a real cluster."
  model:
    provider: test                 # production operator REFUSES this
    name: scripted                 # cosmetic; ignored at runtime
    apiKey: {name: reviewbot-placeholder, key: api-key}
  systemPrompt:
    inline: |
      You are a fixture agent for the agentprimitives e2e harness.
      DO NOT deploy to a real cluster — your model provider is `test`.
      You review a pull request, report to the user, and answer the pull
      request itself.
  # Opt in to the artifact meta tools. Without this grant artifact_prepare and
  # artifact_offer_view are not offered at all, and the half of the round that
  # produces and delivers the report has nothing to run.
  capabilities:
    artifacts: {}
  # Mirrors the real reviewbot class (examples/reviewbot/manifests/agentclass.yaml):
  # a class-visible opt-out get_preferences can read for a NAMED user (the
  # trigger author), not just the current turn's own author. `language` has
  # NO visibility (defaults to self) — it exists only so a bundle can prove a
  # self-only key is never disclosed through a ?user-ref= read, even when a
  # value is seeded for it (see reviewbot-notifications-off).
  userPreferences:
    - name: notifications
      type: enum
      default: "on_problems"
      visibility: class
      description: "When reviewbot should @-mention the pull request author about a review"
      enum:
        - value: always
          description: "Ping on every review, even a clean pass"
        - value: on_problems
          description: "Ping only when the review finds problems (the default)"
        - value: never
          description: "Never ping; deliver the review without an @-mention"
    - name: language
      type: string
      default: "en"
      description: "Reply language (self-only; never disclosed to a named-user read)"
  authz:
    session:
      # github's input Channel has UserAttributable=false — the person who
      # opened the pull request has no AP identity — so the AgentClass
      # controller REQUIRES this: without it agentsession#interact resolves to
      # nothing for every session this class spawns.
      interactPermission: "group:demo-reviewbot-maintainers#member"
  # The step whose omission is invisible from inside the session: the review is
  # delivered, the agent is satisfied, and the pull request goes on showing the
  # work as in progress.
  completionRequirements:
    - trigger-status-concluded
  budget: {maxTurns: 50, maxTokens: 200000, maxDuration: "1h"}
---
apiVersion: agentprimitives.authzed.com/v1alpha1
kind: Channel
metadata: {name: demo-reviewbot-gh, namespace: default}
spec:
  kind: github
  role: input
  agentClass: demo-reviewbot
  sessionScope: thread
  authzSubject: "service:demo-reviewbot"
  owner:
    explicit: "user:demo-reviewbot-owner"
  credentialsRef:
    secretName: reviewbot-gh-creds
  github:
    # The check run is filed under the App's slug, so the answer on the pull
    # request reads as coming from the app a maintainer installed.
    appSlug: demo-reviewbot
    events: ["opened", "synchronize", "reopened", "ready_for_review"]
---
apiVersion: agentprimitives.authzed.com/v1alpha1
kind: Channel
metadata: {name: demo-reviewbot-slack-out, namespace: default}
spec:
  kind: slack
  role: output
  agentClass: demo-reviewbot
  credentialsRef:
    secretName: reviewbot-slack-creds
  slack:
    mode: socket
    outputDefaults:
      channelId: "C0DEMO123"
      threadStrategy: new-thread-per-session
