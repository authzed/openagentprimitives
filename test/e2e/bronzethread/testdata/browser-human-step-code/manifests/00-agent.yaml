# Fixture agent for the browser-human-step-code bronze bundle.
#
# Same shape as browser-readonly-catalog's fixture: a bare test-provider
# AgentClass + fake Channel, no sidecar, no MCPServer, no agentIdentity. The
# BrowserToolbox CR lives in its own file (01-browser-toolbox.yaml) and is named
# in extraManifests; see that file's header for why.
apiVersion: v1
kind: Secret
metadata: {name: browser-human-step-code-placeholder, namespace: default}
type: Opaque
stringData: {api-key: "unused-by-the-test-provider"}
---
apiVersion: v1
kind: Secret
metadata: {name: browser-human-step-code-fake-creds, namespace: default}
type: Opaque
stringData: {placeholder: "unused-by-the-fake-channel"}
---
apiVersion: agentprimitives.authzed.com/v1alpha1
kind: AgentClass
metadata: {name: browser-human-step-code, namespace: default}
spec:
  displayName: BrowserHumanStepCodeBot
  description: "E2E fixture agent. Do not deploy to a real cluster."
  model:
    provider: test                 # production operator REFUSES this
    name: scripted                 # cosmetic; ignored at runtime
    apiKey: {name: browser-human-step-code-placeholder, key: api-key}
  systemPrompt:
    inline: |
      You are a fixture agent for the agentprimitives e2e harness.
      DO NOT deploy to a real cluster — your model provider is `test`.
      You have a browser toolbox named `web`, in act mode, for completing a
      sign-in on its allowed sites. When a page needs a code only a person can
      read (emailed or texted), use request_human_step with kind "code": a
      person types it and it is entered for you — you never see the code.
  budget: {maxTurns: 20, maxTokens: 50000, maxDuration: 5m}
---
apiVersion: agentprimitives.authzed.com/v1alpha1
kind: Channel
metadata: {name: browser-human-step-code-fake, namespace: default}
spec:
  kind: fake
  role: both
  agentClass: browser-human-step-code
  credentialsRef: {secretName: browser-human-step-code-fake-creds}
  fake: {echo: false}
