# Turns the plan gate on in ENFORCING mode for the centerdot fixture, and shortens
# authz.approvalTimeout so an UNANSWERED tool_approval (the excluded
# company's ask, which this bundle deliberately never clicks — see
# ../README.md) resolves within the test budget instead of the 10-minute
# default (mirrors pkg/e2e/scenarios/centerdot/contacts_owner_timeout's
# approvalTimeoutOverride).
#
# The WHOLE spec is restated: ExtraManifests REPLACES the object rather than
# patching it, so a partial spec drops systemPrompt and the class fails Valid
# with "exactly one of inline or configMapRef must be set".
apiVersion: agentprimitives.authzed.com/v1alpha1
kind: AgentClass
metadata:
  name: centerdot-companies
  namespace: default
spec:
  displayName: CenterdotBot
  description: "E2E fixture agent. Do not deploy to a real cluster."
  model:
    provider: test
    name: scripted
    apiKey:
      name: centerdot-placeholder
      key: api-key
  systemPrompt:
    inline: |
      You are a fixture agent for the agentprimitives e2e harness.
      DO NOT deploy to a real cluster.

      You operate on companies and contacts. Available tools:
        - centerdot_list_companies(sinceDays): list companies created recently
        - centerdot_list_contacts_for_company(companyId): list contacts
  agentIdentity: centerdot-identity
  mcpServers:
    - name: centerdot
      ref: centerdot-companies
  budget:
    maxTurns: 10
    maxTokens: 50000
    maxDuration: 5m
  authz:
    slots:
      - resourceType: crm_company
        description: "A CRM company record"
        permission: contact_access
    # The excluded company's tool_approval ask is left unanswered on purpose
    # (see ../README.md); this keeps that wait to 3s instead of the 10m
    # default so the scenario stays fast.
    approvalTimeout: 3s
    planGate:
      mode: enforcing
      rendering:
        # ONE auto-approvable handle for the whole session. The phase below
        # declares two, so breadth alone promotes it past tier 0 and a human
        # must clear it — which is what this bundle is about. Without this the
        # phase is all-readonly, auto-approves, and the scenario asserts
        # against a card the tier gradient was never going to raise.
        maxAutoApproveHandles: 1
