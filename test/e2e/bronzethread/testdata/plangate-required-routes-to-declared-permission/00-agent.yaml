# Fixture agent for the declared-approver-permission scenario.
#
# maintrepo_repo declares:
#
#   standing: required
#   approverPermission: maintainer
#
# and NOTHING is seeded anywhere — no bootstrap, no tuple on `maintainer_ref`,
# none on `owner`. So the approval must fail closed, and the ONLY interesting
# question is which subject-set the router asked for on its way there.
#
# That is what the bundle asserts: the refusal must name "#maintainer". A router
# still building "<type>:<id>#owner" — as four call sites did — would name
# "#owner" instead and the assertion fails. Proving the routing through a
# SUCCESSFUL approval would need a seeded tuple and a click, and would then pass
# for the wrong reason if anything else in the chain went permissive; the
# refusal names the set directly and cannot.
#
# `maintainer` is deliberately not called `owner`, and is a computed permission
# (expr: maintainer_ref) rather than a bare relation, so this also covers the
# distinction the hardcode could not see: crm_company's `owner` is a real
# permission backed by seeded tuples, while git_repo's `owner` is a relation
# declared only so the checks are answerable and never populated by anything.
# The router could not tell those apart, and a push to a git remote became
# permanently unapprovable (observed live 2026-08-21).
#
# The push tool is stateImpact:external so it re-approves per call and reaches
# the approval builder rather than being satisfied by a plan-gate grant.
apiVersion: v1
kind: Secret
metadata: {name: maintrepo-placeholder, namespace: default}
type: Opaque
stringData: {api-key: "unused-by-the-test-provider"}
---
apiVersion: v1
kind: Secret
metadata: {name: maintrepo-fake-creds, namespace: default}
type: Opaque
stringData: {placeholder: "unused-by-the-fake-channel"}
---
apiVersion: v1
kind: Secret
metadata: {name: maintrepo-mcp-token, namespace: default}
type: Opaque
stringData: {access_token: "unused-by-the-fake-mcp-server"}
---
apiVersion: agentprimitives.authzed.com/v1alpha1
kind: AgentIdentity
metadata: {name: maintrepo-identity, namespace: default}
spec:
  description: "Session-only-standing e2e fixture: static MCP bearer token."
  credentials:
    - name: maintrepo-mcp-bearer
      type: static
      static: {secretRef: {name: maintrepo-mcp-token, key: access_token}}
---
# Self-contained MCP fixture exposing one tool, "push", gated on
# maintrepo_repo#push.
#
# maintrepo_repo declares NO `standing` — the field this whole feature adds —
# so it resolves to StandingSessionOnly, the CRD default. Nothing else in this
# file (or anywhere in this bundle) writes a tuple granting `owner` on
# maintrepo_repo to anybody, which is the condition this scenario exists to
# prove works.
apiVersion: agentprimitives.authzed.com/v1alpha1
kind: MCPServer
metadata: {name: maintrepo-fixture, namespace: default}
spec:
  name: maintrepo-fixture
  version: v1
  intent: "Self-contained git-push-shaped fixture for the e2e harness."
  server:
    url: "{{MCP_URL}}"   # Rewritten by the e2e harness before apply.
    transport: http
  auth:
    credential: maintrepo-mcp-bearer
  spicedbSchema:
    resources:
      - name: maintrepo_repo
        # Stated explicitly: nothing local governs who may approve, so the session's own approvers decide.
        standing: required
        approverPermission: maintainer
        relations:
          - {name: owner, subjectType: user}
          - {name: maintainer_ref, subjectType: user}
        permissions:
          # ComposeSlots rewrites this to slot_grant_push->interact + owner
          # because the AgentClass below declares maintrepo_repo as an authz
          # slot.
          #
          # title is the human phrase the approval card shows instead of the
          # wire handle (`perm:push:maintrepo_repo`) — the fragment→controller
          # →status→runner→card chain this whole bundle exists to prove.
          - {name: push, expr: owner, title: "Push commits to the repository"}
          # The permission an approver must hold. Named `maintainer`, NOT `owner`,
          # precisely so a router that still hardcoded "#owner" would resolve an
          # empty set and fail instead of quietly passing.
          - {name: maintainer, expr: maintainer_ref}
  tools:
    - name: status
      intent: "Report whether the push tool is ready to use. Stateless — no SpiceDB check."
      args:
        allowedFields: []
      permission:
        stateImpact: stateless
      effects:
        readOnly: true
        idempotent: true
    - name: push
      intent: "Push locally committed changes to a remote repository."
      args:
        allowedFields: [repoUrl]
      permission:
        stateImpact: external
        check:
          resourceType: maintrepo_repo
          resourceIDExpr: '"" + args.repoUrl'
          # The same [normalize_url, spicedb_escape] chain the real git
          # toolkit keys git_repo with — this is the exact chain the live bug
          # (raw URL reaching SpiceDB unescaped) bypassed, so exercising it
          # here is the point, not incidental.
          resourceIDTransforms: [normalize_url, spicedb_escape]
          resourceIDHint: "give the repository as a full https:// URL"
          permission: push
      effects:
        readOnly: false
        idempotent: false
---
apiVersion: agentprimitives.authzed.com/v1alpha1
kind: AgentClass
metadata: {name: maintrepo-fixture, namespace: default}
spec:
  displayName: MaintRepoBot
  description: "E2E fixture agent. Do not deploy to a real cluster."
  model:
    provider: test                 # production operator REFUSES this
    name: scripted                 # cosmetic; ignored at runtime
    apiKey: {name: maintrepo-placeholder, key: api-key}
  systemPrompt:
    inline: |
      You are a fixture agent for the agentprimitives e2e harness.
      DO NOT deploy to a real cluster — your model provider is `test`
      and the production operator will reject this AgentClass.

      You push local changes to remote repositories. Available tools:
        - maintrepo_status(): check whether the push tool is ready
        - maintrepo_push(repoUrl): push committed changes to the named repository

      When the user asks you to push, call update_plan first to declare a
      phase naming the repository, then call maintrepo_status, then call
      maintrepo_push.
  agentIdentity: maintrepo-identity
  mcpServers:
    - name: maintrepo
      ref: maintrepo-fixture
  authz:
    slots:
      - resourceType: maintrepo_repo
        description: "A remote repository, reached by its URL"
        permission: push
    planGate:
      mode: enforcing
  budget:
    maxTurns: 10
    maxTokens: 50000
    maxDuration: 5m
---
apiVersion: agentprimitives.authzed.com/v1alpha1
kind: Channel
metadata: {name: maintrepo-fixture-fake, namespace: default}
spec:
  kind: fake
  role: both
  agentClass: maintrepo-fixture
  credentialsRef: {secretName: maintrepo-fake-creds}
  fake: {echo: false}
