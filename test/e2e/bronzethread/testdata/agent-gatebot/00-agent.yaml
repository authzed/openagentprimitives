# Fixture agent for the start-gate bundles.
#
# The load-bearing property is the allowlist: spec.authz.session.allowedStarters
# names a GROUP, and the SpiceDBBootstrap below puts the bundle's default user
# in it (canonicalize: true turns the fixture email into the same canonical id
# the fake channel derives for that user). platformAdminsMayStart is false so
# the gate checked is start_explicit, and onlyStartersInteract fixes the
# session's interact set to the same group.
apiVersion: v1
kind: Secret
metadata: {name: gatebot-placeholder, namespace: default}
type: Opaque
stringData: {api-key: "unused-by-the-test-provider"}
---
apiVersion: v1
kind: Secret
metadata: {name: gatebot-fake-creds, namespace: default}
type: Opaque
stringData: {placeholder: "unused-by-the-fake-channel"}
---
apiVersion: agentprimitives.authzed.com/v1alpha1
kind: SpiceDBBootstrap
metadata:
  name: gatebot-starters
  namespace: default
spec:
  relationships:
    - resource: { type: group, id: "gatebot-starters" }
      relation: member
      subject:  { type: user, id: "user@example.com", canonicalize: true }
---
apiVersion: agentprimitives.authzed.com/v1alpha1
kind: AgentClass
metadata: {name: gatebot, namespace: default}
spec:
  displayName: GateBot
  description: "E2E fixture agent. Do not deploy to a real cluster."
  model:
    provider: test
    name: scripted
    apiKey: {name: gatebot-placeholder, key: api-key}
  systemPrompt:
    inline: |
      You are a fixture agent for the agentprimitives e2e harness.
      DO NOT deploy to a real cluster — your model provider is `test`.
      You answer briefly.
  budget: {maxTurns: 50, maxTokens: 100000, maxDuration: "1h"}
  authz:
    session:
      allowedStarters: ["group:gatebot-starters#member"]
      platformAdminsMayStart: false
      onlyStartersInteract: true
---
apiVersion: agentprimitives.authzed.com/v1alpha1
kind: Channel
metadata: {name: gatebot-fake, namespace: default}
spec:
  kind: fake
  role: both
  agentClass: gatebot
  credentialsRef: {secretName: gatebot-fake-creds}
  fake: {echo: false}
