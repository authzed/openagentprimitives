# Fixture agent for the kubectl read-only-spec bundle.
#
# The kubectl builtin toolkit, narrowed to `get` and constrained to refuse
# --all-namespaces (the exact CEL guard the validator golden covers at unit
# tier). Bronze executes no sandbox, so an ALLOWED kubectl call comes back a
# dispatch error — but a call the SPEC refuses never dispatches: the toolspec
# validator denies it and the model gets the constraint message. That refusal
# is what this fixture exists to drive whole-session.
apiVersion: v1
kind: Secret
metadata: {name: kubectl-placeholder, namespace: default}
type: Opaque
stringData: {api-key: "unused-by-the-test-provider"}
---
apiVersion: v1
kind: Secret
metadata: {name: kubectl-fake-creds, namespace: default}
type: Opaque
stringData: {placeholder: "unused-by-the-fake-channel"}
---
apiVersion: v1
kind: Secret
metadata: {name: kubectl-token-secret, namespace: default}
type: Opaque
stringData: {token: "unused-the-sandbox-never-executes"}
---
# A toolBundle requires an AgentIdentity even when the toolkit declares no
# sensitive env (kubectl's KUBECONFIG/HTTPS_PROXY are not sensitive). The
# credential is declared but never resolved — nothing reads it.
apiVersion: agentprimitives.authzed.com/v1alpha1
kind: AgentIdentity
metadata: {name: kubectl-identity, namespace: default}
spec:
  description: "Fixture identity for the kubectl read-only bundle."
  credentials:
    - name: kubectl-token
      type: static
      static: {secretRef: {name: kubectl-token-secret, key: token}}
---
apiVersion: agentprimitives.authzed.com/v1alpha1
kind: SpiceboxToolspec
metadata: {name: ts-kubectl, namespace: default}
spec:
  name: ts-kubectl
  version: "1"
  toolkit: {name: kubectl, revision: "2026-09-09"}
  # Read-only tenant access: only `get`, and never cluster-wide. --all-namespaces
  # (and its short form -A) would list every namespace's Secrets — the whole
  # point of the constraint. This is the CEL guard the validator golden checks
  # at unit tier; here it runs in a live session.
  allowSubcommands: ["get"]
  constraints:
    - cel: '!call.hasFlag("all-namespaces")'
      message: "--all-namespaces is not permitted by this read-only spec"
---
apiVersion: agentprimitives.authzed.com/v1alpha1
kind: SpiceboxClass
metadata: {name: cls-kubectl, namespace: default}
spec:
  image: registry.example.com/kubectl-toolbelt:latest
  resources: {cpu: "100m", memory: "64Mi", ephemeralStorage: "16Mi"}
  tools:
    - {name: kubectl, command: ["/usr/bin/kubectl"]}
  toolspecs:
    - {name: ts-kubectl}
---
apiVersion: agentprimitives.authzed.com/v1alpha1
kind: AgentClass
metadata: {name: kubectl-readonly, namespace: default}
spec:
  displayName: KubectlReadonly
  description: "E2E fixture agent. Do not deploy to a real cluster."
  model:
    provider: test
    name: scripted
    apiKey: {name: kubectl-placeholder, key: api-key}
  systemPrompt:
    inline: |
      You are a fixture agent for the agentprimitives e2e harness.
      DO NOT deploy to a real cluster — your model provider is `test`.
      You run read-only kubectl commands with the kubelike_kubectl tool.
  agentIdentity: kubectl-identity
  authz:
    # disabled: the discriminator is the toolspec CONSTRAINT (--all-namespaces),
    # which the validator enforces before dispatch regardless of the plan gate.
    # Leaving the gate on would refuse the unplanned `get` call first and mask
    # the constraint under test.
    planGate:
      mode: disabled
  budget: {maxTurns: 10, maxTokens: 50000, maxDuration: "1h"}
  toolBundles:
    - {name: "kubelike", class: "cls-kubectl", toolspecs: ["ts-kubectl"]}
---
apiVersion: agentprimitives.authzed.com/v1alpha1
kind: Channel
metadata: {name: kubectl-readonly-fake, namespace: default}
spec:
  kind: fake
  role: both
  agentClass: kubectl-readonly
  credentialsRef: {secretName: kubectl-fake-creds}
  fake: {echo: false}
