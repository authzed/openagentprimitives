# Placeholder secrets for the agent-pr-identity-e2e fixture. The test model
# provider never reads the API key, and nothing in this scenario ever dials a
# real `gh` binary, so neither value is ever used for its real purpose — both
# stubs exist only because the CRD schemas require the references.
#
# The gh token DOES need the "ghp_" prefix: the AgentIdentity reconciler
# validates a stored credential's value against its provider's declared token
# shape (checkCredentialShape) even for a Secret nothing ever reads for real,
# and toolkits/gh.yaml's GITHUB_TOKEN env names provider: github-pat, whose
# tokenShape.pattern is '^(gh[a-z]_|github_pat_)' (providers/github-pat.yaml).
# A value that doesn't match goes Valid=False/CredentialShapeMismatch and the
# AgentClass never reaches Valid=True.
apiVersion: v1
kind: Secret
metadata:
  name: pr-identity-placeholder
  namespace: default
type: Opaque
stringData:
  api-key: "unused-by-the-test-provider"
---
apiVersion: v1
kind: Secret
metadata:
  name: pr-identity-gh-token
  namespace: default
type: Opaque
stringData:
  token: "ghp_fixtureplaceholder"
