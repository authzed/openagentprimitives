# Placeholder Anthropic API key. The AgentClass spec requires
# spec.model.apiKey to reference a Secret with the named key, but
# provider=test never reads the value at runtime — so this Secret
# is intentionally meaningless. The agentclass controller still
# resolves it (Secret-missing / key-missing both fail Valid), which
# is why a stub Secret is required even for the test provider.
---
apiVersion: v1
kind: Secret
metadata:
  name: centerdot-placeholder
  namespace: default
type: Opaque
stringData:
  api-key: "unused-by-the-test-provider"
---
# Placeholder Channel credentials secret. The fake channel kind never
# reads it, but Channel.spec.credentialsRef.secretName is mandatory
# in the CRD schema.
apiVersion: v1
kind: Secret
metadata:
  name: centerdot-fake-creds
  namespace: default
type: Opaque
stringData:
  placeholder: "unused-by-the-fake-channel"
