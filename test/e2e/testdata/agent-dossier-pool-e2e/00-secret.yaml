# credentials; both stubs exist only because the CRD schemas require the
# references.
apiVersion: v1
kind: Secret
metadata:
  name: dossier-placeholder
  namespace: default
type: Opaque
stringData:
  api-key: "unused-by-the-test-provider"
---
apiVersion: v1
kind: Secret
metadata:
  name: dossier-fake-creds
  namespace: default
type: Opaque
stringData:
  placeholder: "unused-by-the-fake-channel"
