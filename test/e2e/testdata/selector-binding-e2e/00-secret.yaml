# Placeholder Anthropic API key and Channel credentials secret — same
# posture as leads-console-e2e/00-secret.yaml: provider=test never reads the
# key, and the fake Channel kind never reads the credentials, but both
# fields are mandatory in their respective CRD schemas.
apiVersion: v1
kind: Secret
metadata:
  name: acctbook-placeholder
  namespace: default
type: Opaque
stringData:
  api-key: "unused-by-the-test-provider"
---
apiVersion: v1
kind: Secret
metadata:
  name: acctbook-fake-creds
  namespace: default
type: Opaque
stringData:
  placeholder: "unused-by-the-fake-channel"
