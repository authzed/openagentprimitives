# AgentClass/acctbook-desk: the deployment half of the three-way tool grant
# for this fixture's one app-only tool. model.provider=test matches every
# other fixture under test/e2e/testdata (see leads-console-e2e/03-agentclass.yaml).
apiVersion: agentprimitives.authzed.com/v1alpha1
kind: AgentClass
metadata:
  name: acctbook-desk
  namespace: default
spec:
  displayName: AcctbookDeskBot
  description: "E2E fixture agent for the agent-defined-UI selector-binding scenario. Do not deploy to a real cluster."
  model:
    provider: test                 # production operator REFUSES this
    name: scripted                 # cosmetic; ignored at runtime
    apiKey:
      name: acctbook-placeholder
      key: api-key
  systemPrompt:
    inline: |
      You are a fixture agent for the agentprimitives e2e harness.
      DO NOT deploy to a real cluster — your model provider is `test`.
  mcpServers:
    - name: acct
      ref: acctbook-crm
  agentUI:
    ref: acctbook-ui
    # The DEPLOYMENT half of the tool grant — see uigrant's three-way
    # intersection.
    grantedTools: [acct_search_accounts]
  budget:
    maxTurns: 10
    maxTokens: 50000
    maxDuration: 5m
