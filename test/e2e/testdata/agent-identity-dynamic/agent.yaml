# Fixture for the identityMode=dynamic → userPassthrough e2e scenario.
#
# A dynamic-mode agent with ONE MCP server that requires a credential
# (dyn-mcp-bearer). The required credential is what forces the passthrough
# credential-link park: after the initiating user chooses "Run as me", the
# operator's passthrough gate finds no linked UserIdentity for that credential
# and parks the session in AwaitingCredentials until the test links it.
#
#   - First (provisional-agent) boot: the AgentIdentity dyn-identity supplies
#     dyn-mcp-bearer, so buildMCPTools succeeds and the runner reaches the
#     identity-choice gate.
#   - After the userPassthrough choice + credential link: the SAME credential
#     name is resolved from the initiating user's linked UserIdentity, so the
#     re-spawned runner boots under passthrough.
#
# spec.server.url is the {{MCP_URL}} sentinel the harness rewrites to the live
# MCPStub URL. The tool is stateImpact=passthrough (no SpiceDB check / schema
# fragment), so no SpiceDBBootstrap is needed. No real names per CLAUDE.md.
---
apiVersion: v1
kind: Secret
metadata:
  name: dyn-placeholder
  namespace: default
type: Opaque
stringData:
  api-key: "unused-by-the-test-provider"
---
apiVersion: v1
kind: Secret
metadata:
  name: dyn-fake-creds
  namespace: default
type: Opaque
stringData:
  placeholder: "unused-by-the-fake-channel"
---
apiVersion: v1
kind: Secret
metadata:
  name: dyn-mcp-token
  namespace: default
type: Opaque
stringData:
  access_token: "unused-by-the-fake-mcp-server"
---
apiVersion: agentprimitives.authzed.com/v1alpha1
kind: AgentIdentity
metadata:
  name: dyn-identity
  namespace: default
spec:
  description: "identityMode=dynamic e2e fixture: static MCP bearer (provisional-agent boot)."
  credentials:
    - name: dyn-mcp-bearer
      type: static
      static:
        secretRef:
          name: dyn-mcp-token
          key: access_token
---
apiVersion: agentprimitives.authzed.com/v1alpha1
kind: MCPServer
metadata:
  name: dyn-tools
  namespace: default
spec:
  name: dyn-tools
  version: v1
  intent: "identityMode=dynamic e2e fixture MCP server."
  server:
    url: "{{MCP_URL}}"
    transport: http
  auth:
    credential: dyn-mcp-bearer
  tools:
    - name: echo
      intent: "Echo a message back."
      args:
        allowedFields: [message]
      permission:
        stateImpact: passthrough
---
apiVersion: agentprimitives.authzed.com/v1alpha1
kind: AgentClass
metadata:
  name: dyn-agent
  namespace: default
spec:
  displayName: Dynamic Bot
  description: "E2E fixture for identityMode=dynamic. Do not deploy to a real cluster."
  model:
    provider: test
    name: scripted
    apiKey:
      name: dyn-placeholder
      key: api-key
  systemPrompt:
    inline: |
      You are a fixture agent for the identityMode=dynamic e2e harness.
      DO NOT deploy to a real cluster — your model provider is `test`.
  identityMode: dynamic
  agentIdentity: dyn-identity
  identityRecommendation:
    prompt: |
      Prefer acting on the user's behalf when a single user works from fresh
      context; prefer the agent's own identity in busy multi-person threads.
  mcpServers:
    - name: dyn
      ref: dyn-tools
  budget:
    maxTurns: 5
    maxTokens: 10000
    maxDuration: 2m
---
apiVersion: agentprimitives.authzed.com/v1alpha1
kind: Channel
metadata:
  name: dyn-fake
  namespace: default
spec:
  kind: fake
  role: both
  agentClass: dyn-agent
  credentialsRef:
    secretName: dyn-fake-creds
  fake:
    echo: false
