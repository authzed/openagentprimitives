# Placeholder secrets for the agent-interruptible-tool fixture. The test
# provider doesn't read the API key; the fake channel kind doesn't read its
# credentials. Both stubs are mandatory because the CRD schemas require the
# references.
apiVersion: v1
kind: Secret
metadata:
  name: interruptible-placeholder
  namespace: default
type: Opaque
stringData:
  api-key: "unused-by-the-test-provider"
---
apiVersion: v1
kind: Secret
metadata:
  name: interruptible-fake-creds
  namespace: default
type: Opaque
stringData:
  placeholder: "unused-by-the-fake-channel"
