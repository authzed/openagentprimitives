# Placeholder Anthropic API key. AgentClass.spec.model.apiKey must reference
# a Secret with the named key, but provider=test never reads the value at
# runtime — the same posture as every other fixture under test/e2e/testdata
# (see agent-centerdot-companies/00-secret.yaml).
apiVersion: v1
kind: Secret
metadata:
  name: pipeline-desk-placeholder
  namespace: default
type: Opaque
stringData:
  api-key: "unused-by-the-test-provider"
---
# Placeholder Channel credentials secret. The fake channel kind never reads
# it, but Channel.spec.credentialsRef.secretName is mandatory in the CRD
# schema. Not every scenario built on this fixture creates a Channel (the
# browser-arm self-test never does), but keeping the secret alongside the
# rest of the fixture costs nothing and lets a Channel-needing scenario
# reference it without adding a second file.
apiVersion: v1
kind: Secret
metadata:
  name: pipeline-desk-fake-creds
  namespace: default
type: Opaque
stringData:
  placeholder: "unused-by-the-fake-channel"
