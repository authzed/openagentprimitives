# Placeholder Anthropic API key. AgentClass.spec.model.apiKey must
# reference a Secret with the named key, but provider=test never reads
# the value at runtime — so this Secret is intentionally meaningless.
# The agentclass controller still resolves it (Secret-missing and
# key-missing both fail Valid), which is why a stub is required even
# for the test provider.
---
apiVersion: v1
kind: Secret
metadata:
  name: ptdemo-placeholder
  namespace: default
type: Opaque
stringData:
  api-key: "unused-by-the-test-provider"
---
# Placeholder Channel credentials. The fake channel kind never reads
# it, but Channel.spec.credentialsRef.secretName is mandatory in the
# CRD schema.
apiVersion: v1
kind: Secret
metadata:
  name: ptdemo-fake-creds
  namespace: default
type: Opaque
stringData:
  placeholder: "unused-by-the-fake-channel"
