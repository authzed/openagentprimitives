# Placeholder Anthropic API key. The AgentClass spec requires
# spec.model.apiKey to reference a Secret with the named key, but
# provider=test never reads the value at runtime — so this Secret
# is intentionally meaningless. The agentclass controller still
# resolves it (Secret-missing / key-missing both fail Valid), which
# is why a stub Secret is required even for the test provider.
---
apiVersion: v1
kind: Secret
metadata:
  name: slack-dm-placeholder
  namespace: default
type: Opaque
stringData:
  api-key: "unused-by-the-test-provider"
---
# Slack credentials Secret. The e2e harness's fake Slack transport
# (slack.InstallTestTransport) ignores the token VALUES entirely — both
# the listener and sender clients are swapped for a shared fakeslack.Client
# regardless of what's in this Secret. The keys still must be PRESENT
# (bot-token, app-token) because:
#   - the Channel controller's RequiredSecretKeys check for kind=slack with
#     role=both requires both keys to exist before Connected=True, and
#   - the e2e harness's channel-listener starter calls
#     resolve.ForChannel(...), which builds channelkinds.Deps from this
#     Secret before ever consulting the fake-transport override.
apiVersion: v1
kind: Secret
metadata:
  name: slack-dm-creds
  namespace: default
type: Opaque
stringData:
  bot-token: "xoxb-test"
  app-token: "xapp-test"
