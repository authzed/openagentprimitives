# Placeholder secrets for the SEP-1913 trust-enforcement e2e fixture.
#
# sep1913-placeholder: the AgentClass spec.model.apiKey must reference a
# Secret with the named key, but provider=test never reads the value at
# runtime. A stub Secret is required so the agentclass controller can
# resolve it (Secret-missing / key-missing both fail Valid).
---
apiVersion: v1
kind: Secret
metadata:
  name: sep1913-placeholder
  namespace: default
type: Opaque
stringData:
  api-key: "unused-by-the-test-provider"
---
# sep1913-fake-creds: Channel.spec.credentialsRef.secretName is mandatory
# in the CRD schema. The fake channel kind never reads it.
apiVersion: v1
kind: Secret
metadata:
  name: sep1913-fake-creds
  namespace: default
type: Opaque
stringData:
  placeholder: "unused-by-the-fake-channel"
