apiVersion: apps/v1
kind: Deployment
metadata:
  name: agentprimitives-authzd
  namespace: agentprimitives-system
spec:
  template:
    spec:
      containers:
      - env:
        - name: SPICEDB_TOKEN
          valueFrom:
            secretKeyRef:
              optional: false
        name: authzd
      volumes:
      - name: nats-creds
        secret:
          optional: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spicebox-operator
  namespace: agentprimitives-system
spec:
  template:
    spec:
      containers:
      - env:
        - name: SPICEDB_TOKEN
          valueFrom:
            secretKeyRef:
              optional: false
        - name: POSTGRES_URI
          valueFrom:
            secretKeyRef:
              optional: false
        name: operator
      volumes:
      - name: channelsd-memory-token
        secret:
          optional: false
      - name: authzd-memory-token
        secret:
          optional: false
      - name: webd-memory-token
        secret:
          optional: false
      - name: nats-creds
        secret:
          optional: false
      - name: admind-token
        secret:
          optional: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spicebox-webd
  namespace: agentprimitives-system
spec:
  template:
    spec:
      volumes:
      - name: signing-key
        secret:
          optional: false
      - name: memory-token
        secret:
          optional: false
      - name: spicedb-token
        secret:
          optional: false
      - name: nats-creds
        secret:
          optional: false
      - name: admind-token
        secret:
          optional: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spicebox-channelsd
  namespace: agentprimitives-system
spec:
  template:
    spec:
      volumes:
      - name: spicedb-token
        secret:
          optional: false
