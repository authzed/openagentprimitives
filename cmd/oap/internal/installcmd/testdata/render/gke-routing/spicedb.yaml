apiVersion: v1
data:
  endpoint: spicebox-spicedb.agentprimitives-system.svc:50051
kind: ConfigMap
metadata:
  name: spicebox-spicedb-config
  namespace: agentprimitives-system
---
apiVersion: batch/v1
kind: Job
metadata:
  name: spicebox-spicedb-createdb
  namespace: agentprimitives-system
spec:
  activeDeadlineSeconds: 120
  backoffLimit: 6
  template:
    metadata:
      labels:
        authzed.com/cluster: spicebox-spicedb
    spec:
      containers:
      - command:
        - sh
        - -c
        - |-
          set -eu
          if psql "$POSTGRES_URI" -tAc "SELECT 1 FROM pg_database WHERE datname='spicedb'" | grep -q 1; then
            echo "database spicedb already exists"
          else
            psql "$POSTGRES_URI" -c "CREATE DATABASE spicedb"
            echo "database spicedb created"
          fi
        env:
        - name: POSTGRES_URI
          valueFrom:
            secretKeyRef:
              key: uri
              name: spicebox-postgres-token
        image: pgvector/pgvector:pg17
        name: createdb
        resources: {}
      restartPolicy: OnFailure
---
apiVersion: authzed.com/v1alpha1
kind: SpiceDBCluster
metadata:
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
  name: spicebox-spicedb
  namespace: agentprimitives-system
spec:
  baseImage: ghcr.io/authzed/spicedb
  config:
    datastoreEngine: postgres
    replicas: 2
  secretName: spicebox-spicedb-token
  version: v1.56.2
