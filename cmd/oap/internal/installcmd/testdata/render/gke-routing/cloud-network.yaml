apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-cloud
  namespace: agentprimitives-system
spec:
  egress:
  - ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
    to:
    - ipBlock:
        cidr: 169.254.0.0/16
  podSelector:
    matchExpressions:
    - key: app.kubernetes.io/name
      operator: NotIn
      values:
      - agentprimitives-extractord
  policyTypes:
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-webd-gateway
  namespace: agentprimitives-system
spec:
  ingress:
  - from:
    - ipBlock:
        cidr: 35.191.0.0/16
    - ipBlock:
        cidr: 130.211.0.0/22
    ports:
    - port: 8080
      protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/name: spicebox-webd
  policyTypes:
  - Ingress
---
apiVersion: networking.gke.io/v1
kind: HealthCheckPolicy
metadata:
  name: spicebox-webd
  namespace: agentprimitives-system
spec:
  default:
    config:
      httpHealthCheck:
        requestPath: /healthz
      type: HTTP
  targetRef:
    group: ""
    kind: Service
    name: spicebox-webd
