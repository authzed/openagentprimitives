apiVersion: apps/v1
kind: Deployment
metadata:
  name: spicebox-operator
  namespace: agentprimitives-system
spec:
  template:
    spec:
      containers:
        - name: operator
          env:
            - name: AP_CLUSTER_KIND
              value: gke
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spicebox-webd
  namespace: agentprimitives-system
spec:
  template:
    spec:
      containers:
        - name: webd
          env:
            - name: AP_CLUSTER_KIND
              value: gke
